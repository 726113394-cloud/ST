<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
<title>🧩 句型建筑师 · 液态玻璃版</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
        --ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);
        --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
        --ease-elastic: cubic-bezier(0.68, -0.55, 0.27, 1.55);
        --anim-ease: var(--ease-smooth);
    }
    body {
        font-family: 'Segoe UI', 'PingFang SC', Roboto, system-ui, sans-serif;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: clamp(10px, 1.5vw, 24px);
        background: linear-gradient(145deg, #fce4d6 0%, #fde9d0 40%, #fef6e0 100%);
        transition: background 0.8s var(--ease-smooth);
    }
    .app {
        width: 100%;
        max-width: min(1280px, calc(100vw - 32px));
        background: rgba(255, 245, 235, 0.70);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-radius: clamp(28px, 3vw, 48px);
        border: 1px solid rgba(255, 220, 180, 0.6);
        box-shadow: 0 20px 60px rgba(200, 150, 100, 0.12);
        overflow: hidden;
        transition: all 0.6s var(--ease-spring);
        position: relative;
    }

    /* ============================================================
       高级渲染 · 液态玻璃
       ============================================================ */
    .app.high-end {
        --anim-ease: var(--ease-spring);
        background: rgba(255, 240, 225, 0.08);
        backdrop-filter: blur(80px) saturate(240%) brightness(1.08);
        -webkit-backdrop-filter: blur(80px) saturate(240%) brightness(1.08);
        border: 1px solid rgba(255, 220, 180, 0.30);
        box-shadow:
            0 50px 120px rgba(180, 130, 80, 0.22),
            0 20px 50px rgba(255, 180, 140, 0.18),
            0 4px 12px rgba(255, 150, 120, 0.08),
            inset 0 2px 0 rgba(255, 250, 245, 0.95),
            inset 0 -3px 0 rgba(255, 200, 150, 0.35),
            inset 0 0 100px rgba(255, 210, 170, 0.12);
    }
    .app.high-end::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background:
            radial-gradient(ellipse 70% 50% at 20% 10%, rgba(255, 230, 200, 0.55), rgba(255, 200, 160, 0.15) 40%, transparent 70%),
            radial-gradient(ellipse 60% 40% at 80% 90%, rgba(255, 180, 150, 0.35), transparent 65%),
            radial-gradient(ellipse 50% 30% at 50% 0%, rgba(255, 255, 255, 0.5), transparent 60%);
        pointer-events: none;
        z-index: 0;
        animation: liquidShift 14s ease-in-out infinite alternate;
    }
    .app.high-end::after {
        content: '';
        position: absolute;
        inset: -1px;
        border-radius: inherit;
        background: conic-gradient(from 0deg at 50% 50%,
                rgba(255, 200, 160, 0.15), rgba(255, 150, 200, 0.10),
                rgba(200, 220, 255, 0.12), rgba(255, 220, 160, 0.15),
                rgba(255, 200, 160, 0.15));
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        padding: 1px;
        pointer-events: none;
        opacity: 0.7;
        animation: iridescentShift 12s linear infinite;
    }
    @keyframes liquidShift {
        0%   { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 0.85; }
        50%  { transform: translate(2%, 1.5%) scale(1.04) rotate(1deg); opacity: 1; }
        100% { transform: translate(-1.5%, 2%) scale(1.02) rotate(-1deg); opacity: 0.9; }
    }
    @keyframes iridescentShift {
        0%   { background-position: 0% 0%; }
        100% { background-position: 100% 100%; }
    }

    .app.high-end .header {
        background: rgba(255, 240, 220, 0.06);
        border-bottom: 1px solid rgba(255, 220, 180, 0.15);
        backdrop-filter: blur(30px);
        -webkit-backdrop-filter: blur(30px);
    }
    .app.high-end .settings {
        background: rgba(255, 240, 220, 0.04);
        border-bottom: 1px solid rgba(255, 220, 180, 0.12);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
    }
    .app.high-end .info-bar,
    .app.high-end .chinese-hint,
    .app.high-end .status-badge,
    .app.high-end .card-pool,
    .app.high-end .answer-zone,
    .app.high-end .history-section {
        background: rgba(255, 245, 230, 0.08);
        backdrop-filter: blur(24px) saturate(180%);
        -webkit-backdrop-filter: blur(24px) saturate(180%);
        border: 1px solid rgba(255, 220, 180, 0.22);
        box-shadow:
            inset 0 1px 0 rgba(255, 255, 255, 0.55),
            inset 0 -1px 0 rgba(255, 200, 160, 0.15),
            0 6px 20px rgba(180, 130, 80, 0.06);
    }
    .app.high-end .card-pool {
        border-style: solid;
        border-color: rgba(255, 220, 180, 0.20);
    }
    .app.high-end .answer-zone {
        border-color: rgba(255, 200, 160, 0.30);
        box-shadow:
            inset 0 2px 12px rgba(255, 200, 160, 0.10),
            inset 0 1px 0 rgba(255, 255, 255, 0.55),
            0 6px 20px rgba(180, 130, 80, 0.06);
    }

    .app.high-end .card-pool .token,
    .app.high-end .answer-zone .token {
        background: linear-gradient(135deg,
            rgba(255, 250, 240, 0.45) 0%,
            rgba(255, 235, 215, 0.30) 50%,
            rgba(255, 220, 190, 0.22) 100%);
        backdrop-filter: blur(24px) saturate(200%);
        -webkit-backdrop-filter: blur(24px) saturate(200%);
        border: 1px solid rgba(255, 240, 220, 0.55);
        box-shadow:
            0 10px 28px rgba(180, 130, 80, 0.14),
            0 3px 8px rgba(180, 130, 80, 0.08),
            inset 0 1.5px 0 rgba(255, 255, 255, 0.85),
            inset 0 -1.5px 0 rgba(200, 150, 100, 0.20),
            inset 0 0 24px rgba(255, 220, 190, 0.10);
        will-change: transform;
    }
    .app.high-end .card-pool .token:hover:not(.used) {
        background: linear-gradient(135deg,
            rgba(255, 252, 245, 0.65) 0%,
            rgba(255, 240, 220, 0.45) 50%,
            rgba(255, 225, 200, 0.35) 100%);
        border-color: rgba(255, 220, 180, 0.7);
        box-shadow:
            0 20px 50px rgba(217, 140, 106, 0.28),
            0 6px 16px rgba(217, 140, 106, 0.18),
            0 0 40px rgba(255, 200, 160, 0.25),
            inset 0 2px 0 rgba(255, 255, 255, 1),
            inset 0 -2px 0 rgba(200, 150, 100, 0.25);
    }
    .app.high-end .card-pool .token::before,
    .app.high-end .answer-zone .token::before {
        content: '';
        position: absolute;
        inset: 1px;
        border-radius: inherit;
        background: linear-gradient(160deg,
            rgba(255, 255, 255, 0.55) 0%,
            rgba(255, 255, 255, 0) 40%,
            rgba(255, 255, 255, 0) 60%,
            rgba(255, 220, 190, 0.3) 100%);
        pointer-events: none;
        opacity: 0.7;
    }

    /* ============ 头部 ============ */
    .header {
        padding: clamp(12px, 1.6vh, 22px) clamp(18px, 2vw, 32px);
        display: flex; flex-wrap: wrap; gap: 8px 16px;
        align-items: center; justify-content: space-between;
        background: rgba(255, 235, 215, 0.40);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255, 220, 180, 0.3);
        position: relative; z-index: 1;
    }
    .logo {
        font-size: clamp(1.05rem, 0.6vw + 0.85rem, 1.5rem);
        font-weight: 800; color: #7a4a2a;
        display: flex; align-items: center; gap: 6px;
    }
    .logo span {
        background: linear-gradient(135deg, #f7b88a, #d98c6a);
        color: #fff;
        font-size: clamp(0.5rem, 0.2vw + 0.45rem, 0.65rem);
        padding: 2px 12px; border-radius: 30px; font-weight: 700;
    }
    .header-actions { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
    .btn-glass {
        background: rgba(255, 235, 215, 0.4);
        border: 1px solid rgba(255, 200, 160, 0.3);
        border-radius: 30px;
        padding: clamp(4px, 0.6vh, 7px) clamp(10px, 1vw, 16px);
        font-size: clamp(0.8rem, 0.3vw + 0.7rem, 1rem);
        cursor: pointer;
        transition: all 0.3s var(--ease-spring);
        font-family: inherit; color: #7a4a2a;
        backdrop-filter: blur(4px);
        position: relative; z-index: 1;
    }
    .btn-glass:hover { background: rgba(255, 245, 235, 0.7); border-color: #f7b88a; transform: scale(1.05); }
    .btn-glass.on {
        background: linear-gradient(135deg, rgba(255, 200, 160, 0.6), rgba(240, 160, 120, 0.5));
        border-color: rgba(255, 200, 160, 0.9);
        color: #5a3020;
        box-shadow:
            0 0 20px rgba(240, 160, 120, 0.4),
            inset 0 1px 0 rgba(255, 255, 255, 0.8);
    }
    .btn-icon { min-width: 36px; text-align: center; padding: 6px 10px; }

    /* ============ 设置栏 ============ */
    .settings {
        padding: clamp(8px, 1.2vh, 14px) clamp(16px, 1.8vw, 26px);
        display: flex; flex-wrap: wrap; gap: 6px 14px;
        align-items: center;
        background: rgba(255, 235, 215, 0.35);
        border-bottom: 1px solid rgba(255, 220, 180, 0.25);
        position: relative; z-index: 1;
    }
    .settings .group { display: flex; align-items: center; gap: 4px 8px; flex-wrap: wrap; }
    .settings .group label {
        font-size: clamp(0.55rem, 0.15vw + 0.5rem, 0.7rem);
        text-transform: uppercase; letter-spacing: 0.5px;
        font-weight: 700; color: #8a6a4a;
    }
    .settings .unit-group { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
    .settings .unit-group .unit-check {
        display: flex; align-items: center; gap: 3px;
        font-size: clamp(0.65rem, 0.15vw + 0.6rem, 0.8rem);
        font-weight: 600; color: #5a3a2a; cursor: pointer;
    }
    .settings .unit-group .unit-check input[type="checkbox"] {
        width: 14px; height: 14px; accent-color: #d98c6a; cursor: pointer;
    }
    .settings .unit-group .unit-check .unit-label {
        background: rgba(255, 235, 215, 0.4);
        padding: 0 8px; border-radius: 20px;
        border: 1px solid rgba(255, 200, 160, 0.15);
        transition: all 0.25s var(--ease-spring);
    }
    .settings .switch {
        display: flex; align-items: center; gap: 6px;
        font-size: clamp(0.65rem, 0.15vw + 0.6rem, 0.8rem);
        font-weight: 600; color: #5a3a2a; cursor: pointer;
    }
    .settings .switch input { width: 36px; height: 18px; accent-color: #d98c6a; cursor: pointer; }

    .main { padding: clamp(12px, 2vh, 24px) clamp(18px, 2vw, 32px) clamp(16px, 2.4vh, 28px); position: relative; z-index: 1; }

    .info-bar {
        display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
        gap: 8px 16px; padding: clamp(5px, 0.7vh, 9px) clamp(12px, 1.4vw, 20px);
        background: rgba(255, 235, 215, 0.35);
        border-radius: 40px; border: 1px solid rgba(255, 220, 180, 0.3);
        margin-bottom: clamp(10px, 1.4vh, 16px);
        transition: all 0.4s var(--anim-ease);
    }
    .info-bar .item {
        display: flex; align-items: center; gap: 6px;
        font-weight: 600;
        font-size: clamp(0.75rem, 0.2vw + 0.7rem, 0.9rem);
        color: #5a3a2a;
    }
    .info-bar .item .num {
        background: rgba(247, 184, 138, 0.2); padding: 2px 14px;
        border-radius: 30px; font-weight: 700; color: #7a4a2a;
    }
    .info-bar .item .score-num {
        background: linear-gradient(135deg, #ffb88a, #e08a6a);
        color: #fff; padding: 2px 16px; border-radius: 30px; font-weight: 700;
    }
    .info-bar .actions button {
        background: rgba(255, 235, 215, 0.4);
        border: 1px solid rgba(255, 200, 160, 0.2);
        border-radius: 30px; padding: 4px 14px;
        font-size: clamp(0.65rem, 0.15vw + 0.6rem, 0.8rem);
        font-weight: 700; color: #5a3a2a;
        cursor: pointer; transition: 0.25s var(--anim-ease); font-family: inherit;
    }
    .info-bar .actions button:hover { background: #fff9f0; border-color: #f7b88a; transform: translateY(-2px); }

    .chinese-hint {
        font-size: clamp(1.05rem, 0.4vw + 0.9rem, 1.4rem);
        font-weight: 700; color: #4a2a1a;
        text-align: center;
        padding: clamp(8px, 1.2vh, 14px) clamp(10px, 1.2vw, 16px);
        background: rgba(255, 235, 215, 0.4);
        border-radius: 30px; border: 1px solid rgba(255, 220, 180, 0.3);
        margin-bottom: clamp(8px, 1.2vh, 14px);
        min-height: clamp(44px, 5vh, 58px);
        display: flex; align-items: center; justify-content: center;
        gap: 8px; flex-wrap: wrap;
        transition: all 0.4s var(--anim-ease);
    }
    .chinese-hint .label {
        font-size: clamp(0.55rem, 0.15vw + 0.5rem, 0.7rem);
        text-transform: uppercase; letter-spacing: 0.5px;
        color: #8a6a4a; background: rgba(247, 184, 138, 0.15);
        padding: 0 12px; border-radius: 20px;
    }
    .chinese-hint .zh { font-size: clamp(1.15rem, 0.5vw + 0.95rem, 1.55rem); }
    .pattern-badge {
        font-size: clamp(0.6rem, 0.15vw + 0.55rem, 0.75rem);
        background: rgba(217, 140, 106, 0.15);
        padding: 2px 16px; border-radius: 30px;
        color: #7a4a2a; font-weight: 600; display: inline-block; margin-top: 2px;
    }

    .status-badge {
        display: block; padding: clamp(5px, 0.7vh, 9px) 18px; border-radius: 40px;
        font-weight: 700;
        font-size: clamp(0.75rem, 0.2vw + 0.7rem, 0.95rem);
        background: rgba(255, 235, 215, 0.3);
        color: #5a3a2a; border: 1px solid rgba(255, 220, 180, 0.25);
        margin-bottom: clamp(10px, 1.4vh, 16px);
        text-align: center; min-height: 38px;
        line-height: 1.6; transition: all 0.4s var(--anim-ease);
    }
    .status-badge.correct { background: #fce4d6; color: #7a4a2a; border-color: #e08a6a; animation: pop 0.6s var(--ease-spring); }
    .status-badge.wrong { background: #fce4d6; color: #b05a4a; border-color: #d98c6a; animation: shake 0.55s var(--ease-spring); }
    .status-badge.done { background: #fde9d0; border-color: #f7b88a; }
    @keyframes pop { 0% { transform: scale(0.85); opacity: 0.5; } 50% { transform: scale(1.06); } 100% { transform: scale(1); opacity: 1; } }
    @keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }

    .card-pool {
        display: flex; flex-wrap: wrap;
        gap: clamp(6px, 0.8vw, 10px);
        justify-content: center;
        padding: clamp(10px, 1.4vh, 16px) clamp(6px, 0.8vw, 12px);
        min-height: clamp(60px, 8vh, 86px);
        background: rgba(255, 235, 215, 0.25);
        border-radius: clamp(24px, 2.4vw, 32px);
        border: 2px dashed rgba(255, 200, 160, 0.3);
        margin-bottom: clamp(10px, 1.4vh, 16px);
        transition: all 0.4s var(--anim-ease);
        position: relative;
    }
    .card-pool .token {
        padding: clamp(5px, 0.8vh, 9px) clamp(14px, 1.5vw, 22px);
        border-radius: 40px;
        font-weight: 700;
        font-size: clamp(0.9rem, 0.3vw + 0.8rem, 1.15rem);
        color: #4a2a1a;
        background: rgba(255, 245, 235, 0.8);
        border: 2px solid rgba(255, 200, 160, 0.3);
        cursor: pointer;
        transition: transform 0.4s var(--anim-ease),
                    box-shadow 0.3s var(--anim-ease),
                    background 0.3s var(--anim-ease),
                    border-color 0.3s var(--anim-ease),
                    opacity 0.35s var(--anim-ease);
        user-select: none; -webkit-user-select: none;
        box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        position: relative;
        touch-action: manipulation;
        transform-style: preserve-3d;
    }
    .card-pool .token:hover:not(.used) {
        transform: translateY(-5px) scale(1.06);
        border-color: #d98c6a; background: #fff9f0;
        box-shadow: 0 12px 32px rgba(217,140,106,0.18);
    }
    .card-pool .token:active:not(.used) { transform: scale(0.94); }
    .card-pool .token.used {
        opacity: 0; transform: scale(0.7) translateY(-20px);
        pointer-events: none;
        transition: all 0.5s var(--ease-spring);
    }

    .answer-zone {
        display: flex; flex-wrap: wrap;
        gap: clamp(6px, 0.8vw, 10px);
        justify-content: center;
        align-items: center;
        min-height: clamp(56px, 7.5vh, 78px);
        padding: clamp(9px, 1.3vh, 15px) clamp(10px, 1.2vw, 16px);
        background: rgba(255, 235, 215, 0.3);
        border-radius: clamp(24px, 2.4vw, 32px);
        border: 2px solid rgba(255, 200, 160, 0.25);
        margin-bottom: clamp(10px, 1.4vh, 16px);
        transition: all 0.4s var(--anim-ease);
        position: relative;
        touch-action: none;
    }
    .answer-zone .placeholder {
        color: #b08a7a; font-weight: 600;
        font-size: clamp(0.75rem, 0.2vw + 0.7rem, 0.95rem);
        opacity: 0.6;
    }
    .answer-zone .token {
        padding: clamp(5px, 0.8vh, 9px) clamp(14px, 1.5vw, 22px);
        border-radius: 40px;
        font-weight: 700;
        font-size: clamp(0.9rem, 0.3vw + 0.8rem, 1.15rem);
        color: #4a2a1a;
        background: rgba(255, 245, 235, 0.7);
        border: 2px solid rgba(255, 200, 160, 0.3);
        cursor: pointer;
        transition: transform 0.4s var(--anim-ease),
                    box-shadow 0.3s var(--anim-ease),
                    background 0.3s var(--anim-ease),
                    border-color 0.3s var(--anim-ease);
        user-select: none; -webkit-user-select: none;
        position: relative;
        touch-action: none;
        transform-style: preserve-3d;
        will-change: transform;
    }
    .answer-zone .token:hover {
        border-color: #d98c6a;
        background: rgba(255,200,160,0.18);
        box-shadow: 0 10px 26px rgba(217,140,106,0.12);
    }
    .answer-zone .token:active { cursor: grabbing; }
    .answer-zone .token .order {
        position: absolute; top: -8px; left: -8px;
        background: #f7b88a; color: #fff;
        font-size: 0.5rem; width: 20px; height: 20px;
        border-radius: 50%; display: flex; align-items: center; justify-content: center;
        font-weight: 800; pointer-events: none;
        box-shadow: 0 2px 6px rgba(217, 140, 106, 0.3);
    }
    .app.high-end .answer-zone .token .order {
        background: linear-gradient(135deg, #f7b88a, #e08a6a);
        box-shadow:
            0 2px 8px rgba(217, 140, 106, 0.4),
            inset 0 1px 0 rgba(255, 255, 255, 0.6);
    }

    .action-row {
        display: flex; flex-wrap: wrap;
        gap: clamp(8px, 1vw, 12px);
        justify-content: center;
        margin-top: 4px; margin-bottom: clamp(6px, 1vh, 12px);
    }
    .action-row .btn {
        padding: clamp(7px, 1vh, 11px) clamp(20px, 2vw, 32px);
        border-radius: 40px;
        font-weight: 700;
        font-size: clamp(0.8rem, 0.25vw + 0.72rem, 1rem);
        border: none; cursor: pointer;
        transition: all 0.4s var(--anim-ease);
        font-family: inherit; display: inline-flex; align-items: center; gap: 6px;
    }
    .action-row .btn:active { transform: scale(0.94); }
    .action-row .btn-primary {
        background: linear-gradient(135deg, #f7b88a, #d98c6a);
        color: #fff; box-shadow: 0 4px 20px rgba(217, 140, 106, 0.25);
    }
    .action-row .btn-primary:hover:not(:disabled) { transform: translateY(-3px) scale(1.03); box-shadow: 0 10px 34px rgba(217,140,106,0.32); }
    .action-row .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }
    .action-row .btn-secondary {
        background: rgba(255, 235, 215, 0.5); color: #5a3a2a;
        border: 1px solid rgba(255, 200, 160, 0.2);
    }
    .action-row .btn-secondary:hover { background: #fff9f0; border-color: #f7b88a; transform: translateY(-3px); box-shadow: 0 6px 20px rgba(217,140,106,0.10); }

    .history-section {
        margin-top: clamp(10px, 1.4vh, 16px);
        padding: clamp(6px, 0.9vh, 10px) clamp(12px, 1.4vw, 18px);
        background: rgba(255, 235, 215, 0.2);
        border-radius: 28px;
        border: 1px solid rgba(255, 220, 180, 0.2);
        transition: all 0.4s var(--anim-ease);
    }
    .history-section .hdr {
        display: flex; justify-content: space-between; align-items: center;
        font-size: clamp(0.65rem, 0.15vw + 0.6rem, 0.8rem);
        font-weight: 700; color: #6a4a3a; margin-bottom: 4px;
    }
    .history-section .hdr .clear-btn {
        background: none; border: none; color: #b08a7a; cursor: pointer;
        font-size: 0.6rem; transition: 0.2s; font-family: inherit; text-decoration: underline;
    }
    .history-section .hdr .clear-btn:hover { color: #b05a4a; }
    .history-list { display: flex; flex-wrap: wrap; gap: 4px; max-height: 60px; overflow-y: auto; }
    .history-list .h-item {
        padding: 2px 12px; border-radius: 30px;
        font-size: clamp(0.6rem, 0.15vw + 0.55rem, 0.75rem);
        font-weight: 600;
        background: rgba(255, 245, 235, 0.4);
        border: 1px solid rgba(255, 200, 160, 0.15);

    const Sound = {
        ctx: null,
        init() {
            if (!this.ctx) {
                try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { return; }
            }
            if (this.ctx.state === 'suspended') this.ctx.resume();
        },
        play(freq, dur = 0.08, vol = 0.2, type = 'sine') {
            if (!this.ctx) return;
            try {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(this.ctx.currentTime);
                osc.stop(this.ctx.currentTime + dur);
            } catch(e) {}
        },
        click() { this.play(660, 0.05, 0.08); setTimeout(()=>this.play(880,0.04,0.06), 30); },
        correct() { this.play(880, 0.1, 0.2); setTimeout(() => this.play(1108, 0.12, 0.2), 90); },
        wrong() { this.play(280, 0.2, 0.12, 'sawtooth'); },

    // ================================================================
    //  5. 工具函数
    // ================================================================
    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }
    function tokenize(sentence) {
        const tokens = sentence.match(/[A-Za-z']+|[.,!?;:]/g);
        return tokens ? tokens.map(t => t.toLowerCase()) : [];
    }
    function getDistractors(exclude, count = 4) {
        const pool = OLD_WORDS.filter(w => !exclude.includes(w));
        if (pool.length === 0) return [];
        return shuffleArray([...pool]).slice(0, count);
    }
    function capitalizeFirst(word) {
        if (!word) return word;
        if (/[a-z]/.test(word[0])) return word[0].toUpperCase() + word.slice(1);
        return word;
    }
    function getBe(num) { return num === 'p' ? 'are' : 'is'; }
    function ease() { return state.highEnd ? 'cubic-bezier(0.34, 1.56, 0.64, 1)' : 'cubic-bezier(0.4, 0, 0.2, 1)'; }

    // ================================================================
    //  6. 生成题目
    // ================================================================
    function generateQuestion() {
        let pool = [];
        for (const unit of state.selectedUnits) {
            const data = TEMPLATES_DATA[unit];
            if (data) pool = pool.concat(data.templates.map(t => ({ ...t, unitDesc: data.desc })));
        }
        if (pool.length === 0) return null;

        const template = pool[Math.floor(Math.random() * pool.length)];
        const slotKeys = Object.keys(template.slots);
        const chosen = {};
        for (const key of slotKeys) {
            if (key === 'be') continue;
            const arr = template.slots[key];
            chosen[key] = arr[Math.floor(Math.random() * arr.length)];
        }
        let subjectNum = 's';
        for (const key of slotKeys) {
            if (key === 'be') continue;
            const item = chosen[key];
            if (item && item.num) { subjectNum = item.num; break; }
        }
        let en = template.en, zh = template.zh;
        for (const key of slotKeys) {
            if (key === 'be') continue;
            const val = chosen[key];
            let enVal = val.en, zhVal = val.zh;
            if (key === '职业') {
                if (subjectNum === 'p') { enVal = val.plural; zhVal = val.zh; }
                else { enVal = `a ${val.en}`; zhVal = `一位${val.zh}`; }
            }
            if (key === '动作') {
                enVal = (subjectNum === 'p') ? val.base : val.en;
            }
            en = en.replace(`{${key}}`, enVal);
            zh = zh.replace(`{${key}}`, zhVal);
        }
        if (en.includes('{be}')) en = en.replace(/{be}/g, getBe(subjectNum));
        if (!en.endsWith('.') && !en.endsWith('?') && !en.endsWith('!')) en += '.';
        if (!zh.endsWith('。') && !zh.endsWith('？') && !zh.endsWith('！')) zh += '。';
        return {
            en, zh,
            patternDesc: template.unitDesc,
            templateEn: template.en,
            correctWords: tokenize(en),
        };
    }

    // ================================================================
    //  7. 3D 倾斜（高级渲染）
    // ================================================================
    function applyTilt(el) {
        if (!state.highEnd) return;
        let rafId = null;
        el.addEventListener('pointermove', (e) => {
            if (isDragging) return;
            if (e.pointerType !== 'mouse' && e.pointerType !== 'pen') return;
            const rect = el.getBoundingClientRect();
            const cx = e.clientX - (rect.left + rect.width / 2);
            const cy = e.clientY - (rect.top + rect.height / 2);
            const rotY = (cx / (rect.width / 2)) * 14;
            const rotX = -(cy / (rect.height / 2)) * 14;
            if (rafId) cancelAnimationFrame(rafId);
            rafId = requestAnimationFrame(() => {
                el.style.transition = 'transform 0.08s linear, box-shadow 0.25s ease';
                el.style.transform = `perspective(500px) rotateX(${rotX}deg) rotateY(${rotY}deg) translateZ(14px) scale(1.06)`;
                el.style.zIndex = '5';
            });
        });
        el.addEventListener('pointerleave', () => {
            if (isDragging) return;
            if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
            el.style.transition = 'transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease';
            el.style.transform = '';
            el.style.zIndex = '';
        });
    }

    // ================================================================
    //  8. 渲染卡片池
    // ================================================================
    function renderCardPool() {
        const oldRects = new Map();
        cardPool.querySelectorAll('.token').forEach(el => {
            const key = el.dataset.poolIdx;
            if (key !== undefined) oldRects.set(key, el.getBoundingClientRect());
        });
        cardPool.innerHTML = '';
        state.shuffledWords.forEach((word, idx) => {
            const div = document.createElement('div');
            div.className = 'token';
            div.dataset.poolIdx = idx;
            div.textContent = word;
            if (state.usedIndices.includes(idx)) {
                div.classList.add('used');
            } else {
                div.addEventListener('click', () => addToAnswer(idx, word, div));
                if (state.highEnd) applyTilt(div);
            }
            cardPool.appendChild(div);
        });
        requestAnimationFrame(() => {
            cardPool.querySelectorAll('.token').forEach(el => {
                const key = el.dataset.poolIdx;
                const oldRect = oldRects.get(key);
                if (!oldRect) return;
                const newRect = el.getBoundingClientRect();
                const dx = oldRect.left - newRect.left;
                const dy = oldRect.top - newRect.top;
                if (Math.abs(dx) > 0.5 || Math.abs(dy) > 0.5) {
                    el.animate([
                        { transform: `translate(${dx}px, ${dy}px)` },
                        { transform: 'translate(0, 0)' }
                    ], {
                        duration: state.highEnd ? 380 : 280,
                        easing: ease()
                    });
                }
            });
        });
    }

    // ================================================================
    //  9. 渲染答案区（含飞入/回弹动画）
    // ================================================================
    function renderAnswerZone(opts = {}) {
        const { sourceRect = null, newItemId = null } = opts;
        const oldRects = new Map();
        answerZone.querySelectorAll('.token[data-id]').forEach(el => {
            oldRects.set(parseInt(el.dataset.id), el.getBoundingClientRect());
        });
        answerZone.innerHTML = '';
        if (state.answerItems.length === 0) {
            answerZone.innerHTML = `<span class="placeholder">👆 点击下方单词添加到此处</span>`;
            return;
        }
        state.answerItems.forEach((item, idx) => {
            const div = document.createElement('div');
            div.className = 'token';
            div.dataset.id = item.id;
            let display = item.word;
            if (idx === 0 && /[a-z]/.test(item.word[0])) display = capitalizeFirst(item.word);
            div.textContent = display;
            const orderSpan = document.createElement('span');
            orderSpan.className = 'order';
            orderSpan.textContent = idx + 1;
            div.appendChild(orderSpan);
            if (dragState && dragState.itemId === item.id) {
                div.style.visibility = 'hidden';
            } else {
                attachAnswerToken(div, item.id);
                if (state.highEnd) applyTilt(div);
            }
            answerZone.appendChild(div);
        });

        requestAnimationFrame(() => {
            answerZone.querySelectorAll('.token[data-id]').forEach(el => {
                const id = parseInt(el.dataset.id);
                const newRect = el.getBoundingClientRect();
                // 1) 飞入动画（速度加快 + 高级渲染下有弹性回弹）
                if (id === newItemId && sourceRect) {
                    const dx = sourceRect.left - newRect.left;
                    const dy = sourceRect.top - newRect.top;
                    if (state.highEnd) {
                        el.animate([
                            { transform: `translate(${dx}px, ${dy}px) scale(0.75) rotate(-8deg)`, opacity: 0.4, offset: 0 },
                            { transform: `translate(${dx*0.55}px, ${dy*0.55}px) scale(1.12) rotate(3deg)`, opacity: 1, offset: 0.55 },
                            { transform: `translate(0, 0) scale(0.94) rotate(-1.5deg)`, opacity: 1, offset: 0.78 },
                            { transform: 'translate(0, 0) scale(1.03) rotate(0.5deg)', opacity: 1, offset: 0.9 },
                            { transform: 'translate(0, 0) scale(1) rotate(0deg)', opacity: 1, offset: 1 }
                        ], {
                            duration: 420,
                            easing: 'cubic-bezier(0.34, 1.56, 0.64, 1)'
                        });
                    } else {
                        el.animate([
                            { transform: `translate(${dx}px, ${dy}px) scale(0.9) rotate(-3deg)`, opacity: 0.6, offset: 0 },
                            { transform: 'translate(0, 0) scale(1) rotate(0)', opacity: 1, offset: 1 }
                        ], {
                            duration: 280,
                            easing: 'cubic-bezier(0.4, 0, 0.2, 1)'
                        });
                    }
                    return;
                }
                // 2) FLIP 换位
                const oldRect = oldRects.get(id);
                if (oldRect) {
                    const dx = oldRect.left - newRect.left;
                    const dy = oldRect.top - newRect.top;
                    if (Math.abs(dx) > 0.5 || Math.abs(dy) > 0.5) {
                        el.animate([
                            { transform: `translate(${dx}px, ${dy}px)` },
                            { transform: 'translate(0, 0)' }
                        ], {
                            duration: state.highEnd ? 380 : 260,
                            easing: ease()
                        });
                    }
                } else {
                    el.animate([
                        { transform: 'scale(0.6) rotate(-6deg)', opacity: 0 },
                        { transform: 'scale(1.08) rotate(3deg)', opacity: 1, offset: 0.65 },
                        { transform: 'scale(1) rotate(0)', opacity: 1 }
                    ], {
                        duration: state.highEnd ? 420 : 300,
                        easing: ease()
                    });
                }
            });
        });
    }

    // ================================================================
    //  10. 添加/移除/换位
    // ================================================================
    function addToAnswer(poolIndex, word, sourceEl) {
        if (state.isAnswered) return;
        if (state.usedIndices.includes(poolIndex)) return;
        const sourceRect = sourceEl ? sourceEl.getBoundingClientRect() : null;
        const newId = ++nextItemId;
        state.answerItems.push({ id: newId, word, poolIndex });
        state.usedIndices.push(poolIndex);
        Sound.click();
        renderCardPool();
        renderAnswerZone({ sourceRect, newItemId: newId });
    }

    function removeFromAnswer(itemId) {
        if (state.isAnswered) return;
        const idx = state.answerItems.findIndex(it => it.id === itemId);
        if (idx === -1) return;
        const item = state.answerItems[idx];
        state.answerItems.splice(idx, 1);
        const ui = state.usedIndices.indexOf(item.poolIndex);
        if (ui !== -1) state.usedIndices.splice(ui, 1);
        Sound.remove();
        renderCardPool();
        renderAnswerZone();
    }

    function reorderItems(draggingId, beforeId) {
        const curIdx = state.answerItems.findIndex(it => it.id === draggingId);
        if (curIdx === -1) return false;
        const [item] = state.answerItems.splice(curIdx, 1);
        let insertIdx;
        if (beforeId === null) insertIdx = state.answerItems.length;
        else {
            insertIdx = state.answerItems.findIndex(it => it.id === beforeId);
            if (insertIdx === -1) insertIdx = state.answerItems.length;
        }
        state.answerItems.splice(insertIdx, 0, item);
        return true;
    }

    // ================================================================
    //  11. 拖动
    // ================================================================
    function getInsertBeforeId(clientX, draggingId) {
        const tokens = [...answerZone.querySelectorAll('.token[data-id]')];
        for (const el of tokens) {
            const id = parseInt(el.dataset.id);
            if (id === draggingId) continue;
            const rect = el.getBoundingClientRect();
            if (clientX < rect.left + rect.width / 2) return id;
        }
        return null;
    }

    function startRealDrag(itemId, offsetX, offsetY, pointerX, pointerY) {
        const origEl = answerZone.querySelector(`.token[data-id="${itemId}"]`);
        if (!origEl) return;
        const rect = origEl.getBoundingClientRect();
        const ghost = origEl.cloneNode(true);
        ghost.style.cssText = `
            position: fixed;
            left: ${rect.left}px;
            top: ${rect.top}px;
            width: ${rect.width}px;
            height: ${rect.height}px;
            pointer-events: none;
            z-index: 10000;
            margin: 0;
            transform: rotate(-3deg) scale(1.10);
            box-shadow: 0 22px 60px rgba(217, 140, 106, 0.45), 0 8px 20px rgba(217, 140, 106, 0.25);
            transition: none;
            opacity: 0.95;
        `;
        if (state.highEnd) {
            ghost.style.background = 'linear-gradient(135deg, rgba(255,252,245,0.85) 0%, rgba(255,235,215,0.7) 100%)';
            ghost.style.backdropFilter = 'blur(24px) saturate(200%)';
            ghost.style.webkitBackdropFilter = 'blur(24px) saturate(200%)';
            ghost.style.border = '1px solid rgba(255,240,220,0.7)';
        }
        document.body.appendChild(ghost);
        origEl.style.visibility = 'hidden';
        const curIdx = state.answerItems.findIndex(it => it.id === itemId);
        const nextItem = state.answerItems[curIdx + 1];
        dragState = {
            itemId, ghost, offsetX, offsetY,
            targetBeforeId: nextItem ? nextItem.id : null,
        };
        updateRealDrag(pointerX, pointerY);
    }

    function updateRealDrag(pointerX, pointerY) {
        if (!dragState) return;
        dragState.ghost.style.left = (pointerX - dragState.offsetX) + 'px';
        dragState.ghost.style.top = (pointerY - dragState.offsetY) + 'px';
        const beforeId = getInsertBeforeId(pointerX, dragState.itemId);
        if (beforeId !== dragState.targetBeforeId) {
            dragState.targetBeforeId = beforeId;
            reorderItems(dragState.itemId, beforeId);
            Sound.drop();
            renderAnswerZone();
        }
    }

    function endRealDrag(clientX, clientY) {
        if (!dragState) return;
        const { itemId, ghost } = dragState;
        ghost.remove();
        const azRect = answerZone.getBoundingClientRect();
        const inside = clientX >= azRect.left - 30 && clientX <= azRect.right + 30 &&
                       clientY >= azRect.top - 30 && clientY <= azRect.bottom + 30;
        dragState = null;
        if (!inside) {
            const idx = state.answerItems.findIndex(it => it.id === itemId);
            if (idx !== -1) {
                const item = state.answerItems[idx];
                state.answerItems.splice(idx, 1);
                const ui = state.usedIndices.indexOf(item.poolIndex);
                if (ui !== -1) state.usedIndices.splice(ui, 1);
                Sound.remove();
                renderCardPool();
            }
        }
        renderAnswerZone();
    }

    function attachAnswerToken(el, itemId) {
        el.addEventListener('pointerdown', (e) => {
            if (state.isAnswered || dragState || isDragging) return;
            if (e.pointerType === 'mouse' && e.button !== 0) return;
            const pid = e.pointerId;
            const startX = e.clientX, startY = e.clientY;
            const rect = el.getBoundingClientRect();
            const offsetX = e.clientX - rect.left;
            const offsetY = e.clientY - rect.top;
            let didDrag = false;
            const onMove = (ev) => {
                if (ev.pointerId !== pid) return;
                const dx = ev.clientX - startX, dy = ev.clientY - startY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (!didDrag && dist > 8) {
                    didDrag = true;
                    isDragging = true;
                    startRealDrag(itemId, offsetX, offsetY, ev.clientX, ev.clientY);
                }
                if (didDrag) updateRealDrag(ev.clientX, ev.clientY);
            };
            const onEnd = (ev) => {
                if (ev.pointerId !== pid) return;
                document.removeEventListener('pointermove', onMove);
                document.removeEventListener('pointerup', onEnd);
                document.removeEventListener('pointercancel', onEnd);
                if (didDrag) endRealDrag(ev.clientX, ev.clientY);
                else removeFromAnswer(itemId);
                isDragging = false;
            };
            document.addEventListener('pointermove', onMove);
            document.addEventListener('pointerup', onEnd);
            document.addEventListener('pointercancel', onEnd);
        });
    }

    // ================================================================
    //  12. 游戏逻辑
    // ================================================================
    function loadQuestion() {
        if (autoNextTimer) { clearTimeout(autoNextTimer); autoNextTimer = null; }
        if (state.selectedUnits.size === 0) {
            document.querySelectorAll('#unitCheckGroup input[type="checkbox"]:not(#unit-all)').forEach(cb => cb.checked = true);
            document.getElementById('unit-all').checked = true;
            state.selectedUnits.clear();
            document.querySelectorAll('#unitCheckGroup input[type="checkbox"]:not(#unit-all)').forEach(cb => {
                if (cb.checked) state.selectedUnits.add(cb.value);
            });
        }
        const q = generateQuestion();
        if (!q) {
            statusBadge.textContent = '⚠️ 没有可用的句型模板';
            statusBadge.className = 'status-badge';
            return;
        }
        state.currentEn = q.en;
        state.currentZh = q.zh;
        state.correctWords = q.correctWords;
        chineseHint.textContent = q.zh;
        patternBadge.textContent = `📐 句型：${q.templateEn}`;

        let distractors = [];
        if (state.moreOldWords) {
            const exclude = new Set(q.correctWords);
            distractors = getDistractors([...exclude], 4);
        }
        let allWords = q.correctWords.slice();
        distractors.forEach(d => allWords.push(d));
        state.shuffledWords = shuffleArray(allWords);
        state.answerItems = [];
        state.usedIndices = [];
        state.isAnswered = false;
        checkBtn.disabled = false;
        nextBtn.disabled = true;
        renderCardPool();
        renderAnswerZone();
        statusBadge.textContent = '🔄 点击下方单词添加到句子，拖动可换位';
        statusBadge.className = 'status-badge';
        progress.textContent = `${state.currentIndex+1}/${state.totalQuestions}`;
        updateScore();
    }

    function checkAnswer() {
        if (state.isAnswered) return;
        const user = state.answerItems.map(it => it.word);
        const correct = state.correctWords;
        if (user.length !== correct.length) {
            statusBadge.textContent = '❌ 单词数量不对，请检查是否漏选或有多余单词';
            statusBadge.className = 'status-badge wrong';
            Sound.wrong();
            return;
        }
        let allMatch = true;
        for (let i = 0; i < correct.length; i++) {
            if (user[i] !== correct[i]) { allMatch = false; break; }
        }
        if (allMatch) {
            state.isAnswered = true;
            state.score += 2;
            updateScore();
            statusBadge.textContent = '✅ 完全正确！ +2分（即将进入下一题）';
            statusBadge.className = 'status-badge correct';
            Sound.correct();
            state.history.push({ en: state.currentEn, zh: state.currentZh, correct: true });
            updateHistoryUI();
            checkBtn.disabled = true;
            nextBtn.disabled = false;
            // 答对后自动进入下一题
            if (autoNextTimer) clearTimeout(autoNextTimer);
            autoNextTimer = setTimeout(() => {
                autoNextTimer = null;
                if (state.isAnswered) nextQuestion();
            }, state.highEnd ? 1100 : 900);
        } else {
            let wrongIdx = -1;
            for (let i = 0; i < Math.min(user.length, correct.length); i++) {
                if (user[i] !== correct[i]) { wrongIdx = i; break; }
            }
            statusBadge.textContent = `❌ 第 ${wrongIdx+1} 个单词位置错误，再试试！`;
            statusBadge.className = 'status-badge wrong';
            Sound.wrong();
            state.history.push({ en: state.currentEn, zh: state.currentZh, correct: false });
            updateHistoryUI();
        }
    }

    function nextQuestion() {
        if (autoNextTimer) { clearTimeout(autoNextTimer); autoNextTimer = null; }
        if (!state.isAnswered) {
            if (state.answerItems.length === 0) {
                statusBadge.textContent = '⏳ 请先排列句子再继续';
                statusBadge.className = 'status-badge';
                return;
            }
            if (confirm('当前答案未检查，确定跳过吗？')) {
                state.history.push({ en: state.currentEn, zh: state.currentZh, correct: false });
                updateHistoryUI();
                state.currentIndex++;
                if (state.currentIndex < state.totalQuestions) loadQuestion();
                else finishRound();
                return;
            } else return;
        }
        state.currentIndex++;
        if (state.currentIndex < state.totalQuestions) loadQuestion();
        else finishRound();
    }

    function finishRound() {
        statusBadge.textContent = '🎉 全部完成！点击「重排」再来一轮';
        statusBadge.className = 'status-badge done';
        Sound.done();
        cardPool.innerHTML = '';
        answerZone.innerHTML = `<span class="placeholder">🎉 完成！</span>`;
        checkBtn.disabled = true;
        nextBtn.disabled = true;
        progress.textContent = `${state.totalQuestions}/${state.totalQuestions}`;
    }

    function resetGame() {
        state.currentIndex = 0;
        state.score = 0;
        state.history = [];
        updateHistoryUI();
        if (state.selectedUnits.size === 0) {
            document.querySelectorAll('#unitCheckGroup input[type="checkbox"]:not(#unit-all)').forEach(cb => cb.checked = true);
            document.getElementById('unit-all').checked = true;
            state.selectedUnits.clear();
            document.querySelectorAll('#unitCheckGroup input[type="checkbox"]:not(#unit-all)').forEach(cb => {
                if (cb.checked) state.selectedUnits.add(cb.value);
            });
        }
        loadQuestion();
        statusBadge.textContent = '🎯 点击下方单词开始';
        statusBadge.className = 'status-badge';
        Sound.start();
    }

    function updateScore() {
        scoreEl.textContent = state.score;
        scoreEl.animate([
            { transform: 'scale(1)' },
            { transform: 'scale(1.25)' },
            { transform: 'scale(1)' }
        ], {
            duration: state.highEnd ? 500 : 350,
            easing: ease()
        });
    }

    function updateHistoryUI() {
        historyList.innerHTML = '';
        const items = state.history.slice(-12).reverse();
        items.forEach(item => {
            const div = document.createElement('div');
            div.className = 'h-item';
            div.innerHTML = `${item.correct ? '✅' : '❌'} ${item.en}`;
            div.title = item.zh;
            div.addEventListener('click', () => {
                if (window.speechSynthesis) {
                    const utter = new SpeechSynthesisUtterance(item.en);
                    utter.lang = 'en-US';
                    window.speechSynthesis.speak(utter);
                }
            });
            historyList.appendChild(div);
        });
    }

    // ================================================================
    //  13. 单元选择
    // ================================================================
    function renderUnitChecks() {
        const units = Object.keys(TEMPLATES_DATA);
        unitCheckGroup.innerHTML = '';
        const allDiv = document.createElement('span');
        allDiv.className = 'unit-check';
        allDiv.innerHTML = `<input type="checkbox" id="unit-all" checked /> <label for="unit-all" class="unit-label">全部</label>`;
        unitCheckGroup.appendChild(allDiv);
        units.forEach(u => {
            const div = document.createElement('span');
            div.className = 'unit-check';
            div.innerHTML = `<input type="checkbox" id="unit-${u}" value="${u}" checked /> <label for="unit-${u}" class="unit-label">${u}</label>`;
            unitCheckGroup.appendChild(div);
        });
        const allCheck = document.getElementById('unit-all');
        const unitChecks = unitCheckGroup.querySelectorAll('input[type="checkbox"]:not(#unit-all)');
        allCheck.addEventListener('change', function() {
            const checked = this.checked;
            unitChecks.forEach(cb => cb.checked = checked);
            updateSelectedUnits();
        });
        unitChecks.forEach(cb => {
            cb.addEventListener('change', function() {
                const allChecked = Array.from(unitChecks).every(c => c.checked);
                allCheck.checked = allChecked;
                updateSelectedUnits();
            });
        });
        function updateSelectedUnits() {
            state.selectedUnits.clear();
            unitChecks.forEach(cb => { if (cb.checked) state.selectedUnits.add(cb.value); });
            if (state.selectedUnits.size > 0) {
                resetGame();
            } else {
                statusBadge.textContent = '⚠️ 请至少选择一个单元';
                statusBadge.className = 'status-badge';
                cardPool.innerHTML = '';
                answerZone.innerHTML = `<span class="placeholder">👆 请选择单元</span>`;
            }
        }
        updateSelectedUnits();
    }

    // ================================================================
    //  14. 事件绑定
    // ================================================================
    moreOldWordsCheck.addEventListener('change', function() {
        state.moreOldWords = this.checked;
        if (state.selectedUnits.size > 0) loadQuestion();
    });

    shuffleBtn.addEventListener('click', function() {
        if (state.isAnswered) {
            statusBadge.textContent = '⏳ 本题已答，请点击下一题';
            statusBadge.className = 'status-badge';
            return;
        }
        state.answerItems = [];
        state.usedIndices = [];
        const correct = state.correctWords;
        const distractors = state.shuffledWords.filter(w => !correct.includes(w));
        let all = correct.slice();
        distractors.forEach(d => all.push(d));
        state.shuffledWords = shuffleArray(all);
        Sound.shuffle();
        renderCardPool();
        renderAnswerZone();
        statusBadge.textContent = '🔀 已重排，请重新排列';
        statusBadge.className = 'status-badge';
    });

    checkBtn.addEventListener('click', checkAnswer);
    nextBtn.addEventListener('click', nextQuestion);

    clearHistoryBtn.addEventListener('click', function() {
        state.history = [];
        updateHistoryUI();
    });

    historyBtn.addEventListener('click', function() {
        if (state.history.length === 0) { alert('暂无练习记录'); return; }
        let msg = '📜 练习历史 (最近12条)\n\n';
        state.history.slice(-12).reverse().forEach((item, i) => {
            const icon = item.correct ? '✅' : '❌';
            msg += `${i+1}. ${icon} ${item.en} (${item.zh})\n`;
        });
        alert(msg);
    });

    resetProgressBtn.addEventListener('click', function() {
        if (confirm('重置所有进度和分数？')) {
            state.totalQuestions = 20;
            resetGame();
        }
    });

    // 高级渲染开关（仅图标）
    glassToggle.addEventListener('click', function() {
        state.highEnd = !state.highEnd;
        const app = document.getElementById('app');
        app.classList.toggle('high-end', state.highEnd);
        glassToggle.classList.toggle('on', state.highEnd);
        modeTag.textContent = state.highEnd ? '液态玻璃' : '流畅版';
        localStorage.setItem('highEnd', state.highEnd ? '1' : '0');
        if (state.shuffledWords.length > 0) {
            renderCardPool();
            renderAnswerZone();
        }
        Sound.shuffle();
    });
    if (localStorage.getItem('highEnd') === '1') {
        state.highEnd = true;
        document.getElementById('app').classList.add('high-end');
        glassToggle.classList.add('on');
        modeTag.textContent = '液态玻璃';
    }

    // ================================================================
    //  15. 教学弹窗
    // ================================================================
    const tutorialSteps = [
        {
            title: '第一步：点击单词',
            desc: '点击下方卡片池中的单词，它会自动飞入上方答题区，按顺序排列成句子。'
        },
        {
            title: '第二步：拖动换位',
            desc: '在答题区内，按住任意单词左右拖动，可以调整顺序，其他单词会自动被"挤"到旁边。'
        },
        {
            title: '第三步：检查答案',
            desc: '排列完成后点击「检查答案」，系统会判断正误。答对会自动进入下一题，让练习更连贯。'
        },
        {
            title: '第四步：高级渲染',
            desc: '点击右上角 ✨ 开启液态玻璃效果，卡片会跟随鼠标倾斜，动画也更灵动。试试看！'
        }
    ];
    let tutorialIndex = 0;
    let tutorialAutoTimer = null;

    function updateTutorialStep(idx) {
        tutorialIndex = idx;
        tutorialTitle.textContent = tutorialSteps[idx].title;
        tutorialDesc.textContent = tutorialSteps[idx].desc;
        stageContents.forEach((el, i) => el.classList.toggle('active', i === idx));
        tutorialDots.forEach((d, i) => d.classList.toggle('active', i === idx));
        tutorialNext.textContent = idx === tutorialSteps.length - 1 ? '开始游戏 🚀' : '下一步 →';
    }

    function openTutorial() {
        tutorialOverlay.classList.add('show');
        updateTutorialStep(0);
    }
    function closeTutorial() {
        tutorialOverlay.classList.remove('show');
    }

    tutorialBtn.addEventListener('click', openTutorial);
    tutorialClose.addEventListener('click', closeTutorial);
    tutorialSkip.addEventListener('click', closeTutorial);
    tutorialNext.addEventListener('click', () => {
        if (tutorialIndex >= tutorialSteps.length - 1) {
            closeTutorial();
        } else {
            updateTutorialStep(tutorialIndex + 1);
        }
    });
    tutorialOverlay.addEventListener('click', (e) => {
        if (e.target === tutorialOverlay) closeTutorial();
    });

    // 首次访问自动弹出教学（仅一次）
    if (!localStorage.getItem('tutorialShown')) {
        setTimeout(() => {
            openTutorial();
            localStorage.setItem('tutorialShown', '1');
        }, 600);
    }

    // ================================================================
    //  16. 清理
    // ================================================================
    document.addEventListener('visibilitychange', () => {
        if (document.hidden && dragState) {
            dragState.ghost.remove();
            dragState = null;
            isDragging = false;
            renderAnswerZone();
        }
    });

    // ================================================================
    //  17. 启动
    // ================================================================
    renderUnitChecks();
    console.log('🧩 句型建筑师 · 液态玻璃版已启动');
});
</script>
