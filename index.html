    // ================================================================
    //  5.5 句型提示：英文骨架 + 槽位名（如「主语 + be + 形容词」）
    //   —— 不给完整句子，也不给槽位里该填的词；be 的各种形式统一写成 be
    // ================================================================
    const PRONOUNS = { i: 1, you: 1, he: 1, she: 1, it: 1, we: 1, they: 1, this: 1, that: 1, these: 1, those: 1 };
    const POSSESSIVES = { my: 1, your: 1, his: 1, her: 1, our: 1, their: 1, its: 1 };
    const AUX_OR_BE = /^(is|are|am|was|were|be|'s|'re|'m|can|could|would|should|will|may|must|do|does|did|have|has|had)$/i;
    const BE_TOKENS = /^(is|are|am|was|were|be|'s|'re|'m)$/i;
    const CONTRACTIONS = {
        "i'm": '主语 + be', "it's": '主语 + be', "he's": '主语 + be', "she's": '主语 + be',
        "that's": '主语 + be', "they're": '主语 + be', "we're": '主语 + be',
        "what's": '疑问词 + be', "who's": '疑问词 + be', "where's": '疑问词 + be', "let's": "Let's",
    };
    const WH_WORDS = { what: '疑问词', where: '疑问词', which: '疑问词', how: '疑问词', whose: '疑问词', why: '疑问词', who: '疑问词', when: '疑问词' };

    // 固定句（没有槽位）用的功能词表：这些照原样显示，其余内容词挖成 ___
    // —— 卡片本来就在学生眼前，提示只该给结构，不能把顺序全交代了
    const KEEP_WORDS = {};
    ('a an the some any and or but in on at to for with of from up down out not too also often ' +
     'very so please now then here there just all me us him them do does did can could would ' +
     'should will may must have has had let is are am').split(' ').forEach(w => { KEEP_WORDS[w] = 1; });

    function buildPatternHint(template) {
        if (template.hint) return template.hint;
        const slotKeys = Object.keys(template.slots || {});
        const en = template.en;
        if (slotKeys.length === 0) {
            const kind = /\?\s*$/.test(en) ? '疑问句' : (/!\s*$/.test(en) ? '感叹句' : '陈述句');
            const tokens = (en.match(/[A-Za-z0-9'\-]+/g) || []);
            const parts = tokens.map(t => {
                const low = t.toLowerCase();
                if (CONTRACTIONS[low]) return CONTRACTIONS[low];
                if (BE_TOKENS.test(low)) return 'be';
                if (PRONOUNS[low]) return '主语';
                if (WH_WORDS[low]) return WH_WORDS[low];
                if (KEEP_WORDS[low]) return t;
                return '___';
            });
            const merged = [];
            parts.forEach(p => { if (p === '___' && merged[merged.length - 1] === '___') return; merged.push(p); });
            return `📐 ${kind} · ${tokens.length} 个词 · ${merged.join(' + ')}`;
        }
        // 把 {槽位} 换成占位符再切词，避免槽位名里的中文被拆开
        const slots = {};
        let marked = en;
        slotKeys.forEach((k, i) => {
            const tag = '\u0001' + i + '\u0001';
            slots[tag] = k === 'be' ? 'be' : k;
            marked = marked.replace(new RegExp('\\{' + k + '\\}', 'g'), ' ' + tag + ' ');
        });
        const tokens = (marked.match(/\u0001\d+\u0001|[A-Za-z'\-]+|[.,!?]/g) || [])
            .map(t => t.replace(/[.,!?]+$/, ''))
            .filter(Boolean);
        const isSlot = (t) => slots[t] !== undefined;
        // 主语段折成「主语」：代词开头只吞一个词；My name / My favourite place 这类
        // 名词短语主语吞到第一个助动词或槽位之前
        const out = [];
        let i = 0;
        const first = (tokens[0] || '').toLowerCase();
        if (PRONOUNS[first]) {
            out.push('主语');
            i = 1;
        } else if (POSSESSIVES[first]) {
            let j = 0;
            while (j < tokens.length && !AUX_OR_BE.test(tokens[j]) && !isSlot(tokens[j])) j++;
            if (j === 0) j = 1;
            out.push('主语');
            i = j;
        }
        for (; i < tokens.length; i++) {
            const t = tokens[i];
            if (isSlot(t)) { out.push(slots[t]); continue; }
            const low = t.toLowerCase();
            if (CONTRACTIONS[low]) { out.push(CONTRACTIONS[low]); continue; }
            if (BE_TOKENS.test(low)) { out.push('be'); continue; }
            if (PRONOUNS[low]) { out.push('主语'); continue; }
            if (WH_WORDS[low]) { out.push(WH_WORDS[low]); continue; }
            out.push(t);
        }
        return '📐 ' + out.join(' + ');
    }

    // ================================================================
    //  6. 生成题目
    // ================================================================
    function generateQuestion() {
        let pool = [];
        for (const unit of state.selectedUnits) {
            const data = TEMPLATES_DATA[unit];
            if (data) pool = pool.concat(data.templates.map(t => ({ ...t, unitDesc: data.desc })));
        }
        if (pool.length === 0) return null;
        for (let attempt = 0; attempt < 30; attempt++) {
            const template = pool[Math.floor(Math.random() * pool.length)];
            const slotKeys = Object.keys(template.slots);
            const chosen = {};
            let valid = true;
            for (const key of slotKeys) {
                const arr = template.slots[key];
                if (!arr || arr.length === 0) { valid = false; break; }
                chosen[key] = arr[Math.floor(Math.random() * arr.length)];
            }
            if (!valid) continue;

            let subjectNum = 's';
            for (const key of slotKeys) {
                if (key === 'be') continue;
                const item = chosen[key];
                if (item && item.num) { subjectNum = item.num; break; }
            }

            const fillEn = (s) => {
                let out = s;
                for (const key of slotKeys) {
                    if (key === 'be') continue;
                    out = out.replace(`{${key}}`, chosen[key].en);
                }
                if (out.includes('{be}')) out = out.replace(/{be}/g, getBe(subjectNum));
                return out;
            };
            const fillZh = (s) => {
                let out = s;
                for (const key of slotKeys) {
                    if (key === 'be') continue;
                    out = out.replace(`{${key}}`, chosen[key].zh);
                }
                return out;
            };

            let en = fillEn(template.en);
            let zh = fillZh(template.zh);
            if (!/[.?!]$/.test(en)) en += '.';
            if (!/[。？！]$/.test(zh)) zh += '。';

            return {
                en, zh,
                patternDesc: template.unitDesc,
                templateEn: template.en,
                hint: buildPatternHint(template),
                slotPool: collectSlotPool(template),
                correctWords: tokenizePhraseAware(en, state.splitPhrases),
            };
        }
        return null;
    }

    // ================================================================
    //  7. 倾斜
    // ================================================================
    function applyTilt(el) {
        if (!state.highEnd) return;
        if (el.dataset.tiltBound === '1') return;
        el.dataset.tiltBound = '1';
        let rafId = null, hovering = false;
        let tRX = 0, tRY = 0, tLift = 0;
        let cRX = 0, cRY = 0, cLift = 0;
        const PERSPECTIVE = 720, ROT_RANGE = 28, LIFT = 30;

        function tick() {
            cRX += (tRX - cRX) * 0.17;
            cRY += (tRY - cRY) * 0.17;
            cLift += (tLift - cLift) * 0.17;
            const settled = !hovering &&
                Math.abs(tRX - cRX) < 0.04 &&
                Math.abs(tRY - cRY) < 0.04 &&
                Math.abs(tLift - cLift) < 0.12;
            if (settled) { el.style.transform = ''; el.style.zIndex = ''; rafId = null; return; }
            const scale = 1 + cLift * 0.008;
            el.style.transform =
                `perspective(${PERSPECTIVE}px) rotateX(${cRX.toFixed(2)}deg) rotateY(${cRY.toFixed(2)}deg) translateZ(${cLift.toFixed(2)}px) scale(${scale.toFixed(3)})`;
            rafId = requestAnimationFrame(tick);
        }
        function kick() { if (rafId === null) rafId = requestAnimationFrame(tick); }
        el.addEventListener('pointermove', (e) => {
            if (isDragging) return;
            if (e.pointerType === 'mouse' && e.buttons !== 0) return;
            const r = el.getBoundingClientRect();
            if (!r.width || !r.height) return;
            const px = (e.clientX - r.left) / r.width;
            const py = (e.clientY - r.top) / r.height;
            tRY = (px - 0.5) * ROT_RANGE;
            tRX = -(py - 0.5) * ROT_RANGE;
            tLift = LIFT; hovering = true; el.style.zIndex = '6'; kick();
        });
        el.addEventListener('pointerleave', () => {
            if (isDragging) return;
            hovering = false; tRX = 0; tRY = 0; tLift = 0; kick();
        });
        el.addEventListener('pointerdown', (e) => {
            if (isDragging) return;
            const r = el.getBoundingClientRect();
            if (!r.width || !r.height) return;
            const px = (e.clientX - r.left) / r.width;
            const py = (e.clientY - r.top) / r.height;
            cRX = -(py - 0.5) * 18; cRY = (px - 0.5) * 18; cLift = 26;
            if (!hovering) { tRX = 0; tRY = 0; tLift = 0; }
            el.style.transform =
                `perspective(${PERSPECTIVE}px) rotateX(${cRX.toFixed(2)}deg) rotateY(${cRY.toFixed(2)}deg) translateZ(${cLift.toFixed(2)}px) scale(1.03)`;
            kick();
        });
    }

    let panelTiltSetup = false;
    function setupPanelTilt() {
        if (panelTiltSetup) return;
        panelTiltSetup = true;
        let rafId = null, hovering = false;
        let tRX = 0, tRY = 0, cRX = 0, cRY = 0;
        const ROT_X_RANGE = 6, ROT_Y_RANGE = 8;
        function tick() {
            cRX += (tRX - cRX) * 0.12;
            cRY += (tRY - cRY) * 0.12;
            const settled = !hovering &&
                Math.abs(tRX - cRX) < 0.02 && Math.abs(tRY - cRY) < 0.02;
            if (settled) { appEl.style.transform = ''; rafId = null; return; }
            appEl.style.transform = `rotateX(${cRX.toFixed(2)}deg) rotateY(${cRY.toFixed(2)}deg)`;
            rafId = requestAnimationFrame(tick);
        }
        function kick() { if (rafId === null) rafId = requestAnimationFrame(tick); }
        document.addEventListener('pointermove', (e) => {
            if (!state.highEnd) return;
            if (e.pointerType === 'touch') return;
            const vw = window.innerWidth, vh = window.innerHeight;
            tRY = (e.clientX / vw - 0.5) * ROT_Y_RANGE;
            tRX = -(e.clientY / vh - 0.5) * ROT_X_RANGE;
            hovering = true; kick();
        }, { passive: true });
        document.addEventListener('pointerleave', () => {
            if (!state.highEnd) return;
            hovering = false; tRX = 0; tRY = 0; kick();
        });
    }
    function resetPanelTilt() { appEl.style.transform = ''; }

    const GLOW_SELECTOR = '.info-bar, .chinese-hint, .history-section, .card-pool, .answer-zone';
    let glowTargets = null, glowRaf = null, glowPointer = null;
    function getGlowTargets() {
        if (!glowTargets || !glowTargets[0] || !glowTargets[0].isConnected) {
            glowTargets = [...document.querySelectorAll(GLOW_SELECTOR)];
        }
        return glowTargets;
    }
    function setupBigCardGlow() {
        document.addEventListener('pointermove', (e) => {
            if (!state.highEnd) return;
            if (isDragging) return;      // 拖动中别做每帧 getBoundingClientRect（强制回流）
            glowPointer = { x: e.clientX, y: e.clientY };
            if (glowRaf !== null) return;
            glowRaf = requestAnimationFrame(() => {
                glowRaf = null;
                if (!state.highEnd || !glowPointer) return;
                const { x, y } = glowPointer;
                getGlowTargets().forEach(el => {
                    const r = el.getBoundingClientRect();
                    if (!r.width || !r.height) return;
                    const px = (x - r.left) / r.width;
                    const py = (y - r.top) / r.height;
                    if (px < -0.12 || px > 1.12 || py < -0.12 || py > 1.12) {
                        if (el.dataset.glowOp !== '0') {
                            el.dataset.glowOp = '0';
                            el.style.setProperty('--glow-op', '0');
                        }
                        return;
                    }
                    el.style.setProperty('--cx', (px * 100).toFixed(1) + '%');
                    el.style.setProperty('--cy', (py * 100).toFixed(1) + '%');
                    if (el.dataset.glowOp !== '1') {
                        el.dataset.glowOp = '1';
                        el.style.setProperty('--glow-op', '1');
                    }
                });
            });
        }, { passive: true });
        document.addEventListener('pointerleave', () => {
            if (!state.highEnd) return;
            getGlowTargets().forEach(el => {
                el.dataset.glowOp = '0';
                el.style.setProperty('--glow-op', '0');
            });
        });
    }

    // ================================================================
    //  8. 渲染卡片池 ★ 使用 toDisplayForm 处理大小写
    // ================================================================
    function renderCardPool() {
        const oldRects = new Map();
        cardPool.querySelectorAll('.token').forEach(el => {
            const key = el.dataset.poolIdx;
            if (key !== undefined) oldRects.set(key, el.getBoundingClientRect());
        });
        cardPool.innerHTML = '';
        state.shuffledWords.forEach((word, idx) => {
            const div = document.createElement('div');
            div.className = 'token';
            div.dataset.poolIdx = idx;
            div.textContent = toDisplayForm(word);  // ★ 应用显示形式
            if (state.usedIndices.includes(idx)) {
                div.classList.add('used');
            } else {
                if (state.guided) {
                    const need = guidedWords()[state.guidedIndex];
                    if (need && cmpKeyOf(word) !== cmpKeyOf(need)) div.classList.add('locked');
                }
                div.addEventListener('click', () => addToAnswer(idx, word, div));
                if (state.highEnd) applyTilt(div);
            }
            cardPool.appendChild(div);
        });
        requestAnimationFrame(() => {
            cardPool.querySelectorAll('.token').forEach(el => {
                const key = el.dataset.poolIdx;
                const oldRect = oldRects.get(key);
                if (!oldRect) return;
                const newRect = el.getBoundingClientRect();
                const dx = oldRect.left - newRect.left;
                const dy = oldRect.top - newRect.top;
                if (Math.abs(dx) > 0.5 || Math.abs(dy) > 0.5) {
                    if (state.highEnd) {
                        el.animate([
                            { transform: `translate(${dx}px, ${dy}px) scale(0.96)` },
                            { transform: `translate(${dx*0.3}px, ${dy*0.3}px) scale(1.03)`, offset: 0.65 },
                            { transform: 'translate(0, 0) scale(1)' }
                        ], { duration: 420, easing: ease() });
                    } else {
                        el.animate([
                            { transform: `translate(${dx}px, ${dy}px)` },
                            { transform: 'translate(0, 0)' }
                        ], { duration: 280, easing: ease() });
                    }
                }
            });
        });
    }

    // ================================================================
    //  9. 渲染答案区 ★ 第一个位置首字母大写，其他位置小写
    // ================================================================
    function renderAnswerZone(opts = {}) {
        const { sourceRect = null, newItemId = null } = opts;
        const oldRects = new Map();
        answerZone.querySelectorAll('.token[data-id]').forEach(el => {
            oldRects.set(parseInt(el.dataset.id), el.getBoundingClientRect());
        });
        answerZone.innerHTML = '';
        if (state.answerItems.length === 0) {
            answerZone.innerHTML = `<span class="placeholder">👆 点击下方单词添加到此处</span>`;
            return;
        }
        state.answerItems.forEach((item, idx) => {
            const div = document.createElement('div');
            div.className = 'token';
            div.dataset.id = item.id;
            // ★ 通过位置决定大小写
            const display = idx === 0 ? toFirstPositionForm(item.word) : toDisplayForm(item.word);
            div.textContent = display;
            const orderSpan = document.createElement('span');
            orderSpan.className = 'order';
            orderSpan.textContent = idx + 1;
            div.appendChild(orderSpan);
            if (dragState && dragState.itemId === item.id) {
                div.style.visibility = 'hidden';
            } else {
                attachAnswerToken(div, item.id);
                if (state.highEnd) applyTilt(div);
            }
            answerZone.appendChild(div);
        });
        requestAnimationFrame(() => {
            const tokens = [...answerZone.querySelectorAll('.token[data-id]')];
            tokens.forEach((el) => {
                const id = parseInt(el.dataset.id);
                const newRect = el.getBoundingClientRect();
                if (id === newItemId && sourceRect) {
                    const dx = sourceRect.left - newRect.left;
                    const dy = sourceRect.top - newRect.top;
                    if (state.highEnd) {
                        el.animate([
                            { transform: `translate(${dx}px, ${dy}px) scale(0.55) rotate(-16deg)`, opacity: 0.25, offset: 0 },
                            { transform: `translate(${dx*0.68}px, ${dy*0.68 - 22}px) scale(1.22) rotate(7deg)`, opacity: 1, offset: 0.48 },
                            { transform: `translate(${dx*0.26}px, ${dy*0.26 + 6}px) scale(0.92) rotate(-4deg)`, opacity: 1, offset: 0.74 },
                            { transform: `translate(${dx*0.06}px, ${dy*0.06 - 2}px) scale(1.07) rotate(2deg)`, opacity: 1, offset: 0.88 },
                            { transform: 'translate(0, 0) scale(1) rotate(0deg)', opacity: 1, offset: 1 }
                        ], { duration: 620, easing: 'cubic-bezier(0.34, 1.56, 0.64, 1)', fill: 'backwards' });
                    } else {
                        el.animate([
                            { transform: `translate(${dx}px, ${dy}px) scale(0.86) rotate(-6deg)`, opacity: 0.35, offset: 0 },
                            { transform: `translate(${dx*0.28}px, ${dy*0.28}px) scale(1.05) rotate(2deg)`, opacity: 1, offset: 0.72 },
                            { transform: 'translate(0, 0) scale(1) rotate(0deg)', opacity: 1, offset: 1 }
                        ], { duration: 380, easing: 'cubic-bezier(0.25, 0.1, 0.25, 1)', fill: 'backwards' });
                    }
                    return;
                }
                const oldRect = oldRects.get(id);
                if (oldRect) {
                    const dx = oldRect.left - newRect.left;
                    const dy = oldRect.top - newRect.top;
                    if (Math.abs(dx) > 0.5 || Math.abs(dy) > 0.5) {
                        if (state.highEnd) {
                            const horiz = Math.abs(dx) >= Math.abs(dy);
                            const sx0 = horiz ? 0.84 : 1;
                            const sy0 = horiz ? 1 : 0.84;
                            const sx1 = horiz ? 1.07 : 1;
                            const sy1 = horiz ? 1 : 1.07;
                            el.animate([
                                { transform: `translate(${dx}px, ${dy}px) scale(${sx0}, ${sy0})` },
                                { transform: `translate(${dx*0.36}px, ${dy*0.36}px) scale(${sx1}, ${sy1})`, offset: 0.6 },
                                { transform: `translate(${dx*0.09}px, ${dy*0.09}px) scale(0.985, 0.985)`, offset: 0.84 },
                                { transform: 'translate(0, 0) scale(1, 1)' }
                            ], { duration: 480, easing: 'cubic-bezier(0.34, 1.56, 0.64, 1)', fill: 'backwards' });
                        } else {
                            el.animate([
                                { transform: `translate(${dx}px, ${dy}px)` },
                                { transform: 'translate(0, 0)' }
                            ], { duration: 260, easing: 'cubic-bezier(0.25, 0.1, 0.25, 1)', fill: 'backwards' });
                        }
                    }
                } else {
                    el.animate([
                        { transform: 'scale(0.6) rotate(-6deg)', opacity: 0 },
                        { transform: 'scale(1.08) rotate(3deg)', opacity: 1, offset: 0.65 },
                        { transform: 'scale(1) rotate(0)', opacity: 1 }
                    ], { duration: state.highEnd ? 460 : 300, easing: ease(), fill: 'backwards' });
                }
            });
        });
    }

    // ================================================================
    //  10. 添加 / 移除 / 换位
    // ================================================================
    // ================================================================
    //  10.5 连错 6 次 → 对位卡片引导
    // ================================================================
    // 比对用的归一化：标点保留原字符，其余小写去符号
    function cmpKeyOf(t) {
        return isPunctuationToken(t) ? String(t) : normalizeToken(t);
    }

    // 对位卡片也带标点：标点同样要按顺序点进去
    function guidedWords() {
        return state.correctWords.slice();
    }
    function renderGuideCard() {
        if (!state.guided) { guideCard.hidden = true; guideCard.innerHTML = ''; return; }
        const words = guidedWords();
        guideCard.hidden = false;
        let html = '<div class="guide-title">🧭 对位卡片 · 按编号顺序，一个个点进上面的方框</div><div class="guide-row">';
        words.forEach((w, i) => {
            const done = i < state.guidedIndex;
            const now = i === state.guidedIndex;
            html += `<div class="guide-slot${done ? ' done' : ''}${now ? ' now' : ''}">
                <span class="guide-idx">${i + 1}</span>
                <span class="guide-word">${toDisplayForm(w)}</span>
            </div>`;
        });
        html += '</div>';
        guideCard.innerHTML = html;
    }
    function enterGuidedMode() {
        state.guided = true;
        state.guidedIndex = 0;
        // 把答题区清空，让学生按顺序重新点一遍（而不是带着乱序继续）
        state.answerItems = [];
        state.usedIndices = [];
        renderCardPool();
        renderAnswerZone();
        renderGuideCard();
        statusBadge.textContent = `🧭 连错 ${GUIDE_AFTER} 次了 —— 这次按「对位卡片」的顺序点，点对了会走下一个`;
        statusBadge.className = 'status-badge';
        Sound.shuffle();
    }
    function exitGuidedMode() {
        if (!state.guided) return;
        state.guided = false;
        state.guidedIndex = 0;
        renderGuideCard();
    }

    function addToAnswer(poolIndex, word, sourceEl) {
        if (state.isAnswered) return;
        if (state.usedIndices.includes(poolIndex)) return;
        if (state.guided && cmpKeyOf(word) !== cmpKeyOf(guidedWords()[state.guidedIndex] || '')) {
            statusBadge.textContent = '🧭 对位模式：请按「对位卡片」上的顺序点下一个单词';
            statusBadge.className = 'status-badge';
            Sound.wrong();
            return;
        }
        const sourceRect = sourceEl ? sourceEl.getBoundingClientRect() : null;
        const newId = ++nextItemId;
        state.answerItems.push({ id: newId, word, poolIndex });
        state.usedIndices.push(poolIndex);
        Sound.click();
        if (state.guided) {
            state.guidedIndex++;
            if (state.guidedIndex >= guidedWords().length) {
                statusBadge.textContent = '🧭 对位完成！点「✅ 检查答案」收尾';
                statusBadge.className = 'status-badge';
            }
        }
        renderCardPool();
        renderAnswerZone({ sourceRect, newItemId: newId });
        if (state.guided) renderGuideCard();
    }
    function removeFromAnswer(itemId) {
        if (state.isAnswered) return;
        const idx = state.answerItems.findIndex(it => it.id === itemId);
        if (idx === -1) return;
        const item = state.answerItems[idx];
        state.answerItems.splice(idx, 1);
        const ui = state.usedIndices.indexOf(item.poolIndex);
        if (ui !== -1) state.usedIndices.splice(ui, 1);
        Sound.remove();
        renderCardPool();
        renderAnswerZone();
    }
    function reorderItems(draggingId, beforeId) {
        const curIdx = state.answerItems.findIndex(it => it.id === draggingId);
        if (curIdx === -1) return false;
        const [item] = state.answerItems.splice(curIdx, 1);
        let insertIdx;
        if (beforeId === null) insertIdx = state.answerItems.length;
        else {
            insertIdx = state.answerItems.findIndex(it => it.id === beforeId);
            if (insertIdx === -1) insertIdx = state.answerItems.length;
        }
        state.answerItems.splice(insertIdx, 0, item);
        return true;
    }

    // ================================================================
    //  11. 拖动
    // ================================================================
    // ⚠️ 必须同时看 X 和 Y。以前只看 X：真实句子在手机上会折成好几行，
    //    手指还在第 2 行，却会算出第 1 行的落点 → 目标反复翻 → 每次都全量重建答题区。
    // ⚠️ 判"同一行"用 offsetTop，**不能用 getBoundingClientRect().top**：
    //    拖动时卡片带 transform:scale，rect 会被改掉（本技能在别的工具踩过这个坑）。
    function getInsertBeforeId(clientX, clientY, draggingId) {
        const tokens = [...answerZone.querySelectorAll('.token[data-id]')];
        let rowTop = null;
        if (clientY != null) {
            let near = null, best = Infinity;
            for (const el of tokens) {
                const r = el.getBoundingClientRect();
                const d = Math.abs(r.top + r.height / 2 - clientY);
                if (d < best) { best = d; near = el; }
            }
            if (near) rowTop = near.offsetTop;
        }
        for (const el of tokens) {
            const id = parseInt(el.dataset.id);
            if (id === draggingId) continue;
            if (rowTop !== null && el.offsetTop !== rowTop) continue;   // 只看手指所在那一行
            const rect = el.getBoundingClientRect();
            if (clientX < rect.left + rect.width / 2) return id;
        }
        return null;
    }
    function startRealDrag(itemId, offsetX, offsetY, pointerX, pointerY) {
        const origEl = answerZone.querySelector(`.token[data-id="${itemId}"]`);
        if (!origEl) return;
        const rect = origEl.getBoundingClientRect();
        const ghost = origEl.cloneNode(true);
        ghost.style.cssText = `
            position: fixed; left: ${rect.left}px; top: ${rect.top}px;
            width: ${rect.width}px; height: ${rect.height}px;
            pointer-events: none; z-index: 10000; margin: 0;
            transform: rotate(-3deg) scale(1.12);
            box-shadow: 0 26px 66px rgba(217, 140, 106, 0.42), 0 8px 20px rgba(217, 140, 106, 0.22);
            transition: none; opacity: 0.96;
        `;
        if (state.highEnd) {
            ghost.style.background = 'linear-gradient(140deg, rgba(255,255,255,0.55) 0%, rgba(255,240,225,0.32) 100%)';
            ghost.style.backdropFilter = 'blur(26px) saturate(210%)';
            ghost.style.webkitBackdropFilter = 'blur(26px) saturate(210%)';
            ghost.style.border = '1px solid rgba(255,255,255,0.75)';
        }
        document.body.appendChild(ghost);
        origEl.style.visibility = 'hidden';
        const curIdx = state.answerItems.findIndex(it => it.id === itemId);
        const nextItem = state.answerItems[curIdx + 1];
        dragState = { itemId, ghost, offsetX, offsetY, targetBeforeId: nextItem ? nextItem.id : null };
        updateRealDrag(pointerX, pointerY);
    }
    function updateRealDrag(pointerX, pointerY) {
        if (!dragState) return;
        dragState.ghost.style.left = (pointerX - dragState.offsetX) + 'px';
        dragState.ghost.style.top = (pointerY - dragState.offsetY) + 'px';
        const beforeId = getInsertBeforeId(pointerX, pointerY, dragState.itemId);
        if (beforeId !== dragState.targetBeforeId) {
            dragState.targetBeforeId = beforeId;
            reorderItems(dragState.itemId, beforeId);
            Sound.drop();
            syncAnswerOrder();      // ← 只挪节点，绝不在这里全量重建（见下面的说明）
        }
    }
    // 拖动中的"弹性挤开"：只把被拖那张的节点挪到新位置，其余卡片用 FLIP 补一段动画。
    // ⚠️⚠️ 这里**不能**调 renderAnswerZone()：它 answerZone.innerHTML = '' 会把
    //     **正在拖的那张卡**也销毁重建 —— 触摸指针的隐式捕获就在那张卡上，
    //     元素被销毁后指针流会断（pointerup 收不到），拖动永远结束不了；
    //     而且一次拖动里会重建七八次（实测 7 次），纯粹白烧性能。
    const DRAG_REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    function syncAnswerOrder() {
        const draggedEl = answerZone.querySelector(`.token[data-id="${dragState.itemId}"]`);
        if (!draggedEl) { renderAnswerZone(); return; }
        const tokens = [...answerZone.querySelectorAll('.token[data-id]')];
        const before = new Map(tokens.map(el => [el, el.getBoundingClientRect()]));
        const refEl = dragState.targetBeforeId == null
            ? null
            : answerZone.querySelector(`.token[data-id="${dragState.targetBeforeId}"]`);
        if (refEl) answerZone.insertBefore(draggedEl, refEl);
        else answerZone.appendChild(draggedEl);
        // 重新编号 + 首词首字母大写（和 renderAnswerZone 的规则一致）
        [...answerZone.querySelectorAll('.token[data-id]')].forEach((el, i) => {
            const o = el.querySelector('.order');
            if (o) o.textContent = i + 1;
            if (el === draggedEl) return;
            const item = state.answerItems.find(it => it.id === parseInt(el.dataset.id));
            const node = el.firstChild;
            if (item && node && node.nodeType === 3) {
                node.nodeValue = i === 0 ? toFirstPositionForm(item.word) : toDisplayForm(item.word);
            }
        });
        // FLIP：只给"没被拖的那几张"补动画（被拖的那张由 ghost 顶着）
        if (DRAG_REDUCED) return;
        tokens.forEach(el => {
            if (el === draggedEl) return;
            const a = before.get(el), b = el.getBoundingClientRect();
            const dx = a.left - b.left, dy = a.top - b.top;
            if (Math.abs(dx) < 1 && Math.abs(dy) < 1) return;
            el.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: 'none' }],
                       { duration: 240, easing: 'cubic-bezier(.22,1,.36,1)' });
        });
    }
    function endRealDrag(clientX, clientY) {
        if (!dragState) return;
        const { itemId, ghost } = dragState;
        ghost.remove();
        const azRect = answerZone.getBoundingClientRect();
        const inside = clientX >= azRect.left - 30 && clientX <= azRect.right + 30 &&
                       clientY >= azRect.top - 30 && clientY <= azRect.bottom + 30;
        dragState = null;
        if (!inside) {
            const idx = state.answerItems.findIndex(it => it.id === itemId);
            if (idx !== -1) {
                const item = state.answerItems[idx];
                state.answerItems.splice(idx, 1);
                const ui = state.usedIndices.indexOf(item.poolIndex);
                if (ui !== -1) state.usedIndices.splice(ui, 1);
                Sound.remove();
                renderCardPool();
            }
        }
        renderAnswerZone();
    }
    function attachAnswerToken(el, itemId) {
        el.addEventListener('pointerdown', (e) => {
            if (state.isAnswered || dragState || isDragging) return;
            if (e.pointerType === 'mouse' && e.button !== 0) return;
            const pid = e.pointerId;
            const startX = e.clientX, startY = e.clientY;
            const rect = el.getBoundingClientRect();
            const offsetX = e.clientX - rect.left;
            const offsetY = e.clientY - rect.top;
            let didDrag = false;
            const onMove = (ev) => {
                if (ev.pointerId !== pid) return;
                const dx = ev.clientX - startX, dy = ev.clientY - startY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (!didDrag && dist > 8) {
                    didDrag = true; isDragging = true;
                    startRealDrag(itemId, offsetX, offsetY, ev.clientX, ev.clientY);
                }
                if (didDrag) updateRealDrag(ev.clientX, ev.clientY);
            };
            const onEnd = (ev) => {
                if (ev.pointerId !== pid) return;
                document.removeEventListener('pointermove', onMove);
                document.removeEventListener('pointerup', onEnd);
                document.removeEventListener('pointercancel', onEnd);
                // ⚠️⚠️ 收尾必须在 finally 里。以前 `isDragging = false` 写在
                //    endRealDrag() **之后**：中间任何异常（Sound / 渲染 / 数据越界）
                //    都会让它永远停在 true，而本函数开头的守卫
                //    `if (state.isAnswered || dragState || isDragging) return;`
                //    会把之后**所有**拖动都挡掉 —— 卡片再也拖不动，只能刷新页面，
                //    刷新就丢练习进度。这就是老师报的"卡住卡片"。
                try {
                    if (didDrag) endRealDrag(ev.clientX, ev.clientY);
                    else removeFromAnswer(itemId);
                } finally {
                    isDragging = false;
                    const stuck = !!dragState;                // 走到这里还留着 = 上面抛过异常
                    if (dragState) {
                        try { dragState.ghost.remove(); } catch (e) {}
                        dragState = null;
                    }
                    // 正常路径 endRealDrag() 自己会 render，这里只补异常路径那一次
                    if (stuck) { try { renderAnswerZone(); } catch (e) {} }
                }
            };
            document.addEventListener('pointermove', onMove);
            document.addEventListener('pointerup', onEnd);
            document.addEventListener('pointercancel', onEnd);
        });
    }

    // ================================================================
    //  12. 游戏逻辑
    // ================================================================
    function loadQuestion() {
        if (autoNextTimer) { clearTimeout(autoNextTimer); autoNextTimer = null; }
        state.retryMode = false;
        state.attempts = 0;
        exitGuidedMode();
        if (state.selectedUnits.size === 0) {
            showUnitPrompt();
            return;
        }
        // 间隔复习：先把到期的句子练一遍（错题本）
        if (state.reviewQueue && state.reviewQueue.length) {
            const rv = state.reviewQueue.shift();
            applyQuestion({
                en: rv.en, zh: rv.zh || '', review: true,
                hint: buildPatternHint({ en: rv.en, zh: rv.zh || '', slots: {} }),
                templateEn: '',
                correctWords: tokenizePhraseAware(rv.en, state.splitPhrases),
                slotPool: null,
            });
            return;
        }
        const q = generateQuestion();
        if (!q) {
            statusBadge.textContent = '⚠️ 没有可用的句型模板';
            statusBadge.className = 'status-badge';
            return;
        }
        applyQuestion(q);
    }

    function applyQuestion(q) {
        state.currentEn = q.en;
        state.currentZh = q.zh;
        state.reviewMode = !!q.review;
        state.srsMarked = false;
        state.correctWords = q.correctWords;
        state.patternHint = q.hint || '';
        state.patternFull = q.templateEn ? `✅ 完整句型：${q.templateEn}` : '';
        resetPatternHint();
        renderPromptNote();

        // 听音组句：不显示中文；**不自动播放** —— 手机只认点击触发的声音，
        // 让学生点「🔊 播放句子」这个按钮（那一下就是手势）
        if (state.qmode === 'listen' && !q.review) {
            chineseHint.textContent = '（点下面「🔊 播放句子」听题）';
            replayBtn.textContent = '🔊 播放句子';
        } else {
            chineseHint.textContent = q.zh;
        }

        let allWords = q.correctWords.slice();
        if (state.moreOldWords) {
            const excludeLower = lower(q.correctWords);
            const distractors = getDistractors(excludeLower, 4, q.slotPool);
            distractors.forEach(d => allWords.push(d));
        }
        state.shuffledWords = shuffleArray(allWords);
        state.answerItems = [];
        state.usedIndices = [];
        state.isAnswered = false;
        checkBtn.disabled = false;
        nextBtn.disabled = true;
        renderCardPool();
        renderAnswerZone();
        statusBadge.textContent = state.qmode === 'listen'
            ? '🔊 点「播放句子」听一遍，再把单词顺序拼好'
            : (q.review ? '📖 复习题（错题本 / 间隔复习）—— 点击下方单词组句'
                        : '🔄 点击下方单词添加到句子，拖动可换位');
        statusBadge.className = 'status-badge';
        progress.textContent = `${state.currentIndex + 1}/${state.totalQuestions}`;
        updateScore();
    }

    // 题干提示行：只有听音模式才出现
    function renderPromptNote() {
        if (state.qmode === 'listen') {
            promptNote.hidden = false;
            promptNoteText.textContent = '🔊 听句子，把单词顺序拼出来';
            replayBtn.hidden = false;
            return;
        }
        promptNote.hidden = true;
        replayBtn.hidden = true;
    }

    function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function loadHistoricalQuestion(item) {
        if (autoNextTimer) { clearTimeout(autoNextTimer); autoNextTimer = null; }
        state.retryMode = true;
        state.attempts = 0;
        exitGuidedMode();
        state.currentEn = item.en;
        state.currentZh = item.zh;
        state.correctWords = tokenizePhraseAware(item.en, state.splitPhrases);
        chineseHint.textContent = item.zh;
        state.patternHint = '';
        state.patternFull = '';
        resetPatternHint();
        let allWords = state.correctWords.slice();
        if (state.moreOldWords) {
            const excludeLower = lower(state.correctWords);
            const distractors = getDistractors(excludeLower, 4);
            distractors.forEach(d => allWords.push(d));
        }
        state.shuffledWords = shuffleArray(allWords);
        state.answerItems = [];
        state.usedIndices = [];
        state.isAnswered = false;
        checkBtn.disabled = false;
        nextBtn.disabled = true;
        renderCardPool();
        renderAnswerZone();
        statusBadge.textContent = '📖 复习旧句子（已练习过的句子不重复计分）';
        statusBadge.className = 'status-badge';
        progress.textContent = `📖 复习`;
        Sound.start();
    }

    function checkAnswer() {
        if (state.isAnswered) return;

        // 标点也参与判分：比对用的归一化——标点保留原字符，其余小写去符号
        const cmpKey = (t) => isPunctuationToken(t) ? String(t) : normalizeToken(t);

        const userWords = state.answerItems.map(it => cmpKey(it.word)).filter(t => t.length > 0);
        const correctWords = state.correctWords.map(t => cmpKey(t)).filter(t => t.length > 0);

        // 诊断：说清"少了/多了/顺序不对"，只给"第几位 / 该靠前还是靠后"这类线索，不直接给答案
        const dg = diagnose(userWords, correctWords);
        if (dg.kind === 'count') {
            Sound.wrong();
            markWrongOnce();
            noteWrongAttempt('❌ ' + dg.msg);
            return;
        }

        let wrongIdx = dg.kind === 'order' ? dg.idx : -1;

        if (wrongIdx === -1) {
            state.isAnswered = true;
            markAnswerFeedback(-1);
            const key = state.currentEn;
            const alreadyScored = state.scoredSentences.has(key);
            const previouslyFailed = state.failedSentences.has(key);
            if (alreadyScored || previouslyFailed || state.retryMode) {
                statusBadge.textContent = '✅ 完全正确！（此句已练习过，不重复计分）';
            } else {
                state.score += 2;
                state.scoredSentences.add(key);
                statusBadge.textContent = '✅ 完全正确！ +2分（即将进入下一题）';
            }
            statusBadge.className = 'status-badge correct';
            srsMark(state.currentEn, state.currentZh, true);
            if (state.qmode === 'listen') chineseHint.textContent = state.currentZh;
            revealFullPattern();
            Sound.correct();
            state.history.push({ en: state.currentEn, zh: state.currentZh, correct: true });
            updateHistoryUI();
            checkBtn.disabled = true;
            nextBtn.disabled = false;
            if (autoNextTimer) { clearTimeout(autoNextTimer); autoNextTimer = null; }
            if (state.autoRead) {
                playAnswerThenAdvance();
            } else {
                autoNextTimer = setTimeout(() => {
                    autoNextTimer = null;
                    if (state.isAnswered) nextQuestion();
                }, state.highEnd ? 1200 : 950);
            }
        } else {
            markAnswerFeedback(wrongIdx);
            state.failedSentences.add(state.currentEn);
            Sound.wrong();
            markWrongOnce();
            const last = state.history[state.history.length - 1];
            if (!last || last.en !== state.currentEn) {
                state.history.push({ en: state.currentEn, zh: state.currentZh, correct: false });
                updateHistoryUI();
            }
            noteWrongAttempt('❌ ' + dg.msg);
        }
    }

    // 一次作答只记一次失败，别因为连错 6 次就记成"错 6 次"
    function markWrongOnce() {
        if (state.srsMarked) return;
        state.srsMarked = true;
        srsMark(state.currentEn, state.currentZh, false);
    }

    // 答对后把这句话读一遍（磨耳朵），**读完再自动进下一题** ——
    // 原来不管放音、固定 950ms 就跳题，会把录音掐断；也不用担心手机拦，
    // 因为「检查答案」那一下点击就是用户手势
    async function playAnswerThenAdvance() {
        // 「看中文组句」模式下提示行本来是收起的，这里要把它打开才露出「再听一遍」
        if (state.qmode !== 'listen') {
            promptNote.hidden = false;
            promptNoteText.textContent = '✅ 答对啦 —— 再听一遍这句话';
        }
        replayBtn.hidden = false;
        replayBtn.textContent = '🔊 再听一遍';
        const how = await playSentence(state.currentEn);
        let wait = state.highEnd ? 1200 : 950;
        if (how === 'file') {
            const el = getAudioEl();
            if (el.duration && isFinite(el.duration)) {
                wait = Math.min(Math.max(0, (el.duration - el.currentTime) * 1000) + 450, 7000);
            } else {
                wait = 2000;
            }
            statusBadge.textContent = statusBadge.textContent.replace('（即将进入下一题）', '（听完自动进入下一题）');
        } else if (how === 'words' || how === 'tts') {
            wait = 2600;
            statusBadge.textContent = statusBadge.textContent.replace('（即将进入下一题）', '（听完自动进入下一题）');
        }
        if (autoNextTimer) clearTimeout(autoNextTimer);
        autoNextTimer = setTimeout(() => {
            autoNextTimer = null;
            if (state.isAnswered) nextQuestion();
        }, wait);
    }

    // 判分诊断：说清是"少了/多了"还是"顺序不对"。
    // 注意：**绝不给标准答案那个词的首字母** —— 学生手里可能正拿着那个词（只是位置不对），
    // 提示"首字母 T"会让他以为放对了（这个坑踩过一次）
    function diagnose(userWords, correctWords) {
        const count = (arr) => arr.reduce((m, w) => (m[w] = (m[w] || 0) + 1, m), {});
        const uc = count(userWords), cc = count(correctWords);
        const missing = [], extra = [];
        Object.keys(cc).forEach(w => { for (let i = 0; i < (cc[w] || 0) - (uc[w] || 0); i++) missing.push(w); });
        Object.keys(uc).forEach(w => { for (let i = 0; i < (uc[w] || 0) - (cc[w] || 0); i++) extra.push(w); });
        if (missing.length || extra.length) {
            const parts = [];
            const split = (arr) => [arr.filter(t => !isPunctuationToken(t)), arr.filter(t => isPunctuationToken(t))];
            if (missing.length) {
                const [mw, mp] = split(missing);
                const bits = [];
                if (mw.length) bits.push(mw.length + ' 个词');
                if (mp.length) bits.push(mp.length + ' 个标点（' + mp.join(' ') + '）');
                parts.push(`少了 ${bits.join(' + ')}（它在第 ${correctWords.indexOf(missing[0]) + 1} 个位置）`);
            }
            if (extra.length) {
                const [ew, ep] = split(extra);
                const bits = [];
                if (ew.length) bits.push(ew.length + ' 个词（"' + ew[0] + '" 不在这一句里）');
                if (ep.length) bits.push(ep.length + ' 个标点（' + ep.join(' ') + ' 不该出现）');
                parts.push(`多了 ${bits.join(' + ')}`);
            }
            return { kind: 'count', msg: '数量和答案对不上：' + parts.join('；') };
        }
        const idx = correctWords.findIndex((w, i) => w !== userWords[i]);
        if (idx === -1) return { kind: 'ok', msg: '' };
        const w = userWords[idx];
        const should = correctWords.indexOf(w);
        const dir = should > idx ? '应该更靠后' : '应该更靠前';
        const isPunct = isPunctuationToken(w);
        return {
            kind: 'order', idx,
            msg: isPunct
                ? `标点「${w}」的位置不对：它应该在最后（现在在第 ${idx + 1} 个）`
                : `词都对了，但顺序不对：第 ${idx + 1} 个位置放错了（「${w}」${dir}）—— 点「📐 看句型提示」看看顺序`,
        };
    }

    // 判分反馈：把答题区的卡片逐个标出对/错（标点也算，同 checkAnswer 的口径）
    function markAnswerFeedback(wrongIdx) {
        const els = [...answerZone.querySelectorAll('.token[data-id]')];
        let cmp = 0;
        els.forEach((el) => {
            const item = state.answerItems.find(it => it.id === parseInt(el.dataset.id, 10));
            if (!item) return;
            const t = isPunctuationToken(item.word) ? String(item.word) : normalizeToken(item.word);
            if (!t) return;
            if (wrongIdx === -1 || cmp < wrongIdx) el.classList.add('ok');
            else if (cmp === wrongIdx) el.classList.add('bad');
            cmp++;
        });
    }

    // 每一次判错都要计数：连错到 GUIDE_AFTER 次就给对位卡片
    function noteWrongAttempt(message) {
        state.attempts++;
        if (state.attempts >= GUIDE_AFTER) {
            enterGuidedMode();
            return;
        }
        const left = GUIDE_AFTER - state.attempts;
        statusBadge.textContent = message + (left <= 2 ? `（再错 ${left} 次就给你对位卡片）` : '');
        statusBadge.className = 'status-badge wrong';
    }

    function nextQuestion() {
        if (autoNextTimer) { clearTimeout(autoNextTimer); autoNextTimer = null; }
        if (state.retryMode) {
            state.retryMode = false;
            state.currentIndex++;
            if (state.currentIndex < state.totalQuestions) loadQuestion();
            else finishRound();
            return;
        }
        if (!state.isAnswered) {
            if (state.answerItems.length === 0) {
                statusBadge.textContent = '⏳ 请先排列句子再继续';
                statusBadge.className = 'status-badge';
                return;
            }
            if (confirm('当前答案未检查，确定跳过吗？')) {
                state.failedSentences.add(state.currentEn);
                state.history.push({ en: state.currentEn, zh: state.currentZh, correct: false });
                updateHistoryUI();
                state.currentIndex++;
                if (state.currentIndex < state.totalQuestions) loadQuestion();
                else finishRound();
                return;
            } else return;
        }
        state.currentIndex++;
        if (state.currentIndex < state.totalQuestions) loadQuestion();
        else finishRound();
    }

    function finishRound() {
        statusBadge.textContent = '🎉 全部完成！点击「重排」再来一轮';
        statusBadge.className = 'status-badge done';
        Sound.done();
        cardPool.innerHTML = '';
        answerZone.innerHTML = `<span class="placeholder">🎉 完成！</span>`;
        checkBtn.disabled = true;
        nextBtn.disabled = true;
        progress.textContent = `${state.totalQuestions}/${state.totalQuestions}`;
    }

    function resetGame() {
        state.currentIndex = 0;
        state.score = 0;
        state.scoredSentences = new Set();
        state.failedSentences = new Set();
        state.retryMode = false;
        state.reviewQueue = srsDue(5);   // 每轮先把最多 5 条到期错题排进去
        updateHistoryUI();
        if (state.selectedUnits.size === 0) {
            showUnitPrompt();
            return;
        }
        loadQuestion();
        if (state.qmode !== 'listen') {
            statusBadge.textContent = '🎯 点击下方单词开始';
            statusBadge.className = 'status-badge';
        }
        Sound.start();
    }

    function updateScore() {
        scoreEl.textContent = state.score;
        scoreEl.animate([
            { transform: 'scale(1)' },
            { transform: 'scale(1.28)' },
            { transform: 'scale(1)' }
        ], { duration: state.highEnd ? 560 : 360, easing: ease() });
    }

    // ---- 句型提示：默认收起，点按钮才展开；答对后才给完整句型 ----
    function resetPatternHint() {
        patternBadge.textContent = '';
        patternBadge.hidden = true;
        patternToggle.hidden = false;
        patternToggle.classList.remove('on');
        patternToggle.textContent = '📐 看句型提示';
    }
    function togglePatternHint() {
        if (!state.patternHint) {
            // 别让按钮"点了没反应"：明确说一句
            patternToggle.textContent = '📐 这句没有句型提示';
            patternToggle.classList.add('on');
            setTimeout(() => {
                if (!state.patternHint) {
                    patternToggle.textContent = '📐 看句型提示';
                    patternToggle.classList.remove('on');
                }
            }, 1400);
            return;
        }
        const willShow = patternBadge.hidden;
        patternBadge.textContent = willShow ? state.patternHint : '';
        patternBadge.hidden = !willShow;
        patternToggle.classList.toggle('on', willShow);
        patternToggle.textContent = willShow ? '📐 收起提示' : '📐 看句型提示';
        Sound.shuffle();
    }
    function revealFullPattern() {
        if (!state.patternFull) return;
        patternBadge.textContent = state.patternFull;
        patternBadge.hidden = false;
        patternToggle.classList.add('on');
        patternToggle.textContent = '📐 收起提示';
    }

    function updateHistoryUI() {
        saveHistory();
        historyList.innerHTML = '';
        const items = state.history.slice(-12).reverse();
        items.forEach(item => {
            const div = document.createElement('div');
            div.className = 'h-item';
            div.innerHTML = `${item.correct ? '✅' : '❌'} ${item.zh}`;
            div.title = `${item.en}（点击重新练习）`;
            div.addEventListener('click', () => { loadHistoricalQuestion(item); });
            historyList.appendChild(div);
        });
    }

    // ================================================================
    //  13. 单元选择
    // ================================================================
    // ================================================================
    //  13.5 错题本 / 间隔复习
    // ================================================================
    function renderWrongModal() {
        const list = srsWrongList();
        const due = srsDue(999).length;
        wrongSub.textContent = list.length
            ? `错题 ${list.length} 条，其中 ${due} 条现在就该复习。点任意一条可以单独重练。`
            : '还没有错题。答错的句子会自动记在这里，并按 10 分钟 → 1 小时 → 8 小时 → 1 天 → 3 天 → 7 天 的间隔安排复习。';
        if (!list.length) {
            wrongList.innerHTML = '<div class="wrong-empty">暂无错题 —— 先去练几题吧</div>';
            return;
        }
        wrongList.innerHTML = list.map(it =>
            `<div class="wrong-item" data-en="${escapeHtml(it.en)}">
                <span class="wm-zh">${escapeHtml(it.zh || it.en)}</span>
                <span class="wm-en">${escapeHtml(it.en)}</span>
                <span class="wm-count">错 ${it.wrong || 0} 次</span>
            </div>`).join('');
        wrongList.querySelectorAll('.wrong-item').forEach(el => {
            el.addEventListener('click', () => {
                wrongModalOverlay.classList.remove('show');
                state.reviewQueue = [];
                applyQuestion({
                    en: el.dataset.en,
                    zh: (state.srs[el.dataset.en] || {}).zh || '',
                    review: true,
                    hint: buildPatternHint({ en: el.dataset.en, zh: '', slots: {} }),
                    templateEn: '',
                    correctWords: tokenizePhraseAware(el.dataset.en, state.splitPhrases),
                    slotPool: null,
                });
            });
        });

    var TUT_KEY = 'patternBuilder.tutorialShown_v2';
    try { localStorage.removeItem(LS_TUTORIAL); } catch (e) {}

    var TUT_REDUCED = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    var tById = function (id) { return document.getElementById(id); };
    var tSleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };

    /* ---------- 真元素上的提示脉冲 ---------- */
    var tutTapped = [];
    function tutMark(el, scale) {
        if (!el) return;
        el.classList.add(scale ? 'tut-tap-scale' : 'tut-tap');
        tutTapped.push(el);
    }
    function tutClearTaps() {
        tutTapped.forEach(function (el) { el.classList.remove('tut-tap', 'tut-tap-scale'); });
        tutTapped = [];
    }

    /* ---------- 聚光灯（挖洞）与讲解卡的位置 ---------- */
    var tutSpotEl = tById('tutSpot');
    var tutCardEl = tById('tutCard');

    function tutSpotOff() { if (tutSpotEl) tutSpotEl.classList.add('off'); }

    function tutSpotOn(els, pad) {
        if (!tutSpotEl) return;
        els = (els || []).filter(Boolean);
        var L = Infinity, T = Infinity, R = -Infinity, B = -Infinity, any = false;
        els.forEach(function (e) {
            var r = e.getBoundingClientRect();
            if (!r.width && !r.height) return;
            any = true;
            L = Math.min(L, r.left); T = Math.min(T, r.top);
            R = Math.max(R, r.right); B = Math.max(B, r.bottom);
        });
        if (!any) { tutSpotOff(); return; }
        var p = (pad == null ? 8 : pad);
        tutSpotEl.classList.remove('off');
        var L2 = Math.max(0, L - p), T2 = Math.max(0, T - p);
        var R2 = Math.min(window.innerWidth, R + p), B2 = Math.min(window.innerHeight, B + p);
        tutSpotEl.style.left = L2 + 'px';
        tutSpotEl.style.top = T2 + 'px';
        tutSpotEl.style.width = (R2 - L2) + 'px';
        tutSpotEl.style.height = (B2 - T2) + 'px';
        // ⚠️ 讲解卡要按**目标矩形**算位置，不能去读 spot.getBoundingClientRect()：
        //    聚光灯的 left/top 带 .42s 过渡，刚设完立刻读，读到的是**旧位置** ——
        //    卡片会被排到上一个目标旁边（实测跑到了屏幕正中央）。
        tutPlaceCard({ left: L2, top: T2, right: R2, bottom: B2 });
    }

    function tutPlaceCard(rect) {
        if (!tutCardEl || !tutSpotEl) return;
        var s = rect || tutSpotEl.getBoundingClientRect();
        if (!s || (!s.width && !s.height && s.right === s.left && s.bottom === s.top)) {
            s = tutSpotEl.getBoundingClientRect();
        }
        var W = tutCardEl.offsetWidth || 348, H = tutCardEl.offsetHeight || 200;
        var vw = window.innerWidth, vh = window.innerHeight, m = 10, gap = 14;
        var L, T;
        var belowOK = s.bottom + gap + H <= vh - m;
        var aboveOK = s.top - gap - H >= m;
        var rightOK = s.right + gap + W <= vw - m;
        var leftOK = s.left - gap - W >= m;
        // 目标在最上面那条（工具栏 / 设置栏）时**优先往下放**：旁边放会压住那一排，
        // 而下面通常是空的卡片池，最不碍事
        if (s.top < vh * 0.22 && belowOK) { L = Math.min(s.left, vw - W - m); T = s.bottom + gap; }
        else if (rightOK) { L = s.right + gap; T = s.top; }
        else if (leftOK) { L = s.left - gap - W; T = s.top; }
        else if (belowOK) { L = Math.min(s.left, vw - W - m); T = s.bottom + gap; }
        else if (aboveOK) { L = Math.min(s.left, vw - W - m); T = s.top - gap - H; }
        else { L = (vw - W) / 2; T = (vh - H) / 2; }
        tutCardEl.style.left = Math.round(Math.max(m, Math.min(L, vw - W - m))) + 'px';
        tutCardEl.style.top = Math.round(Math.max(m, Math.min(T, vh - H - m))) + 'px';
    }

    // ① 挑单元：真开单元表 → 真点「全选」→ 真点「取消全选」→ 真选一个 → 真点「确定」

    //    ⚠️ 这一段的等待时间别加回去：它整体只有 5 秒左右，才轮得到 loopMs 那一拍；
    //       拖长了（原来 6.3 秒）循环就会被挤出"演示 + 间隔"的窗口（C1 验收逮到过）。
    async function tutDemoUnits() {

        if (none) { tutMark(none); await tSleep(320); none.click(); await tSleep(440); }
        // ⚠️ 点一下单元会 renderUnitModal() 重建 unitModalBody.innerHTML，
        //    所以每次都要**重新查**元素，别留旧引用（那个已经不在文档里了）
        var body = tById('unitModalBody');
        var first = body ? body.querySelector('.unit-item') : null;
        if (first) {
            tutMark(first);

    // ② 点单词：真点池里的卡（真的飞进答题区）→ 再真点答题区那张（真的飞回池子）
    // ⚠️⚠️ 答题区的卡**不能**用 el.click()：它绑的是 pointerdown/pointerup（为了拖动），
    //        程序化 click() 只派发 click 事件，走不到 removeFromAnswer —— 卡片根本不会动。
    //        必须真的派 pointerdown + pointerup（位移 0 = 一次点击 = 取出卡片）。
    function tutRealTap(el) {
        return new Promise(function (resolve) {
            if (!el) { resolve(false); return; }
            var r = el.getBoundingClientRect();
            var px = r.left + r.width / 2, py = r.top + r.height / 2;
            var pid = 9300 + Math.floor(Math.random() * 600);
            var mk = function (type, buttons) {
                return new PointerEvent(type, {
                    bubbles: true, cancelable: true, composed: true,
                    pointerId: pid, pointerType: 'mouse', isPrimary: true,
                    button: 0, buttons: buttons, clientX: px, clientY: py
                });
            };
            el.dispatchEvent(mk('pointerdown', 1));
            document.dispatchEvent(mk('pointerup', 0));
            setTimeout(function () { resolve(true); }, 340);
        });
    }

    async function tutDemoPick() {
        if (!state.currentEn) return;
        var pool = tById('cardPool'), zone = tById('answerZone');
        if (!pool || !zone) return;
        var tok = pool.querySelector('.token:not(.used)');
        if (!tok) return;
        tutMark(tok);
        tutSpotOn([tok], 8);
        await tSleep(620);
        tok.click();                                  // 真点 → 真的飞进答题区
        await tSleep(820);
        var inZone = zone.querySelector('.token[data-id]');
        if (!inZone) { tutClearTaps(); return; }
        tutMark(inZone);
        tutSpotOn([inZone], 8);
        await tSleep(560);
        await tutRealTap(inZone);                     // 真点 → 真的飞回池子
        await tSleep(560);
        tutClearTaps();
    }

    /* 真拖：在卡片上派 pointerdown，再往 document 上派 pointermove / pointerup。
       走的就是卡片自己那套 attachAnswerToken → updateRealDrag → endRealDrag，
       所以弹性挤开、幽灵卡、落点判定全是真的。
       ⚠️ 位移必须超过 8px 才会被当成"拖动"（否则工具会把它当成一次点击 = 取出卡片）。 */
    function tutRealDrag(fromEl, toX, toY) {
        return new Promise(function (resolve) {
            if (!fromEl) { resolve(false); return; }
            var r = fromEl.getBoundingClientRect();
            var pid = 9100 + Math.floor(Math.random() * 800);
            var sx = r.left + r.width / 2, sy = r.top + r.height / 2;
            var mk = function (type, x, y, buttons) {
                return new PointerEvent(type, {
                    bubbles: true, cancelable: true, composed: true,
                    pointerId: pid, pointerType: 'mouse', isPrimary: true,
                    button: 0, buttons: buttons, clientX: x, clientY: y
                });
            };
            fromEl.dispatchEvent(mk('pointerdown', sx, sy, 1));
            var n = 8, i = 0;
            var step = function () {
                i++;
                document.dispatchEvent(mk('pointermove', sx + (toX - sx) * i / n, sy + (toY - sy) * i / n, 1));
                if (i < n) { requestAnimationFrame(step); return; }
                document.dispatchEvent(mk('pointerup', toX, toY, 0));
                setTimeout(function () { resolve(true); }, 460);
            };
            requestAnimationFrame(step);
        });
    }

    // ③ 换位置：真把最后一张拖到最前，再把最前那张拖到最后 —— 一来一回净变化为 0，可循环
    //    ⚠️ 答题区空空的时候没法演示"换位置"：第 2 步是"点进去 → 点回来"净零，
    //       走到这一步时答题区通常还是空的，于是拖动演示会**悄悄什么都不做**。
    //       所以先真点几张卡进来（最多 3 张，不会越积越多）。
    async function tutDemoDrag() {
        var zone = tById('answerZone');
        if (!zone) return;
        for (var k = zone.querySelectorAll('.token[data-id]').length; k < 3; k++) {
            var add = tById('cardPool').querySelector('.token:not(.used)');
            if (!add) break;
            tutMark(add);
            add.click();
            await tSleep(220);
        }
        var toks = Array.prototype.slice.call(zone.querySelectorAll('.token[data-id]'));
        if (toks.length < 2) { tutClearTaps(); return; }
        var a = toks[toks.length - 1], b = toks[0];
        tutMark(a);
        tutSpotOn([a], 8);
        await tSleep(620);
        var rb = b.getBoundingClientRect();
        if (!await tutRealDrag(a, rb.left + rb.width / 2 - 8, rb.top + rb.height / 2)) { tutClearTaps(); return; }
        await tSleep(520);
        var toks2 = Array.prototype.slice.call(zone.querySelectorAll('.token[data-id]'));
        if (toks2.length >= 2) {
            var c = toks2[0], d = toks2[toks2.length - 1];
            tutMark(c);
            tutSpotOn([c], 8);
            await tSleep(460);
            var rd = d.getBoundingClientRect();
            await tutRealDrag(c, rd.left + rd.width / 2 + 8, rd.top + rd.height / 2);
        }
        tutClearTaps();
    }

    // ④ 检查答案：用**正确的词、故意错的顺序**排一排，再真点「检查答案」——
    //    这样一定会走"顺序错了"那条提示：第一个错的卡变红抖动 + 上面那行说清错在第几位。
    //    ⚠️ 千万别在这里排出正确句子：答对会加分、进历史、写间隔复习，还会自动跳下一题。
    //    ⚠️ 别用"把池子里的卡按池子顺序全点进去"的办法：那样词数和顺序都碰运气，
    //       可能得到"少了/多了"那种线索，也可能正好是对的然后加分。
    function tutPoolMatch(word) {
        var toks = tById('cardPool').querySelectorAll('.token:not(.used)');
        var punct = isPunctuationToken(word);
        var want = punct ? String(toDisplayForm(word)) : normalizeToken(word);
        for (var i = 0; i < toks.length; i++) {
            if (punct ? (toks[i].textContent === want) : (normalizeToken(toks[i].textContent) === want)) return toks[i];
        }
        return null;
    }

    async function tutDemoCheck() {
        var btn = tById('checkBtn');
        if (!btn || !state.currentEn) return;
        tutMark(btn);
        tutSpotOn([btn], 8);
        await tSleep(560);
        if (state.isAnswered) { await tSleep(500); tutClearTaps(); return; }
        // 先把答题区清空（每张都真点一下收回池子），再按"正确的词、错的顺序"重排一遍。
        // ⚠️ 不先清空的话，上一轮循环剩下的卡会让词数对不上，于是检查出来的是
        //    "少了/多了"那种线索，而不是这一步要教的"顺序错了"（实测踩过）。
        for (var g = 0; g < 14; g++) {
            var back = tById('answerZone').querySelector('.token[data-id]');
            if (!back) break;
            await tutRealTap(back);
        }
        var order = state.correctWords.slice();
        if (order.length > 2) order.push(order.shift());   // 轮转一位 = 顺序一定错
        for (var w = 0; w < order.length; w++) {
            var el = tutPoolMatch(order[w]);
            if (!el) continue;
            el.click();
            await tSleep(170);
        }
        await tSleep(380);
        if (!state.isAnswered && state.answerItems.length >= 2
            && state.answerItems.map(function (it) { return it.word; }).join('\u0001') === state.correctWords.join('\u0001')) {
            state.answerItems.reverse();   // 兜底：万一还是正序，换两个的位置（收尾整份还原）
            renderAnswerZone();
            await tSleep(380);
        }
        if (!state.isAnswered) btn.click();               // 真点「检查答案」→ 真红闪 / 真线索
        await tSleep(1200);
        // 真出意外答对了：把自动跳题的定时器掐掉，别让画面在演示中途换题
        if (state.isAnswered && autoNextTimer) { clearTimeout(autoNextTimer); autoNextTimer = null; }
        tutClearTaps();
    }

    // ⑤ 句型提示：真展开、真收回
    async function tutDemoHint() {
        var t = tById('patternToggle');
        if (!t || t.hidden) return;
        tutMark(t);
        tutSpotOn([t], 8);
        await tSleep(560);
        t.click();                                        // 真的展开
        await tSleep(1050);
        if (t.classList.contains('on')) { t.click(); await tSleep(520); }   // 收回去，不占着屏幕
        tutClearTaps();
    }

    // ⑥ 重排：真点 🔀，卡片真的飞回池子再重新散开
    async function tutDemoShuffle() {

    // ⑦ 错题本：真开、真关

    // ⑧ 最近练习：真点一条 → 真的把那句话重新练一遍（第一次安装时列表是空的，就只圈出来讲）
    async function tutDemoHistory() {

    /* ================================================================
       八步。每一步都给 loopMs —— 老师要求"教学要一直循环演给学生看"。
       各步的 run 都必须是**可循环**的（净副作用为 0，或靠收尾整份还原）：
       · ① 每轮真的重开单元表、真的重选重出题
       · ② 点进去 → 再点回来，一来一回
       · ③ 拖到最前 → 再拖到最后，一来一回
       · ④ 第五步之后的循环本来就只在打脉冲（已经答过就不再点）
       · ⑤⑥ 展开收回 / 重排，都是可重复的
       · ⑦⑧ 浮层开一次关一次 / 重练一次
       ================================================================ */
    var TUT_STEPS = [
        { ico: '📚', h: '先挑要练的单元', sel: '#unitTriggerBtn', loopMs: 2600,
          p: '点「📚 选择单元」打开单元表，<b>可以一次勾好几个单元</b>，每个年级右上还有「本册全选」；点「确定」之后题库就按这些单元重新出题。下面演示是真的在操作它。',
          run: function () { return tutDemoUnits(); } },

        { ico: '👆', h: '点单词，飞进答题区', sel: '#cardPool', loopMs: 3400,
          p: '点池子里的一张卡，它<b>飞进上面的答题区并留在那儿</b>，池里那张变灰。<b>要取出来，得再点一次答题区里的那张卡</b>——不是点一下就自己收回去。',
          run: function () { return tutDemoPick(); } },

        { ico: '↔️', h: '在答题区里换位置', sel: '#answerZone', loopMs: 4400,
          p: '按住答题区里的任意单词<b>左右拖动</b>，其余单词会被弹性「挤」到旁边。排错了不用取出来重放，拖一下就行。',
          run: function () { return tutDemoDrag(); } },

        { ico: '✅', h: '点检查，看排得对不对', sel: '#checkBtn', loopMs: 5600,
          p: '位置对的卡片变<b>绿</b>，第一个错的变<b>红并抖动</b>，上面那行同时告诉你错在第几个位置。<b>标点也算分</b>——句号、问号要放到对的位置。同一题连错 6 次，答题区会清空并出现「🧭 对位卡片」：按 1、2、3 的顺序点，点错位置是点不动的。',
          run: function () { return tutDemoCheck(); } },

        { ico: '📐', h: '卡住了就看句型提示', sel: '#patternToggle', loopMs: 3400,
          p: '点中文旁的「📐 看句型提示」。它给的是<b>英文骨架</b>（比如「主语 + can + 家务」），不会把整句写给你；<b>答对之后</b>才显示完整句型。',
          run: function () { return tutDemoHint(); } },

        { ico: '🔀', h: '排乱了就重排，难度也能调', sel: '#shuffleBtn', loopMs: 3200,
          p: '点「🔀 重排」清空答题区、单词重新打散。右边设置栏里还能开「🧠 干扰词」（<b>下一题起</b>多塞几个不相干的词）、关掉「🔤 拆分短语」（把短语当成一整张卡练整体识别）、或切到「🎯 听音组句」。',
          run: function () { return tutDemoShuffle(); } },

        { ico: '📕', h: '错题会自动排回来', sel: '#wrongBtn', loopMs: 4400,
          p: '答错的句子进<b>错题本</b>，按 10 分钟 → 1 小时 → 8 小时 → 1 天 → 3 天 → 7 天的间隔自动排回来。点「📕 错题本」能看清单，也能挑一条单独重练。',
          run: function () { return tutDemoWrong(); } },

        { ico: '🔍', h: '做过的句子能重练', sel: '#historyList', loopMs: 3800,
          p: '判分只给线索：「少了 1 个词」「还漏了 1 个标点」「这个词该更靠前」，<b>不会直接给答案</b>——它就在你手边，给了反而看不出自己错在哪。底部「最近练习」一直留着，<b>点任意一条中文就能重做那句话</b>。',
          run: function () { return tutDemoHistory(); } }
    ];

    /* ================================================================
       快照 / 还原
       教学要真的操作界面，就一定会改到学生手上的状态（单元选择 / 当前题 /
       分数 / 历史 / 间隔复习队列 / 设置栏）。**开教学时整份拍下来，
       关教学时整份放回去** —— 否则一节教学就把学生正做的那道题冲掉了，
       那正是老师最烦的"丢练习数据"。
       ================================================================ */
    var tutSnap = null;

    function tutSnapshot() {
        return {
            units: Array.from(state.selectedUnits),
            currentEn: state.currentEn, currentZh: state.currentZh,
            reviewMode: state.reviewMode, srsMarked: state.srsMarked,
            correctWords: state.correctWords.slice(),
            patternHint: state.patternHint, patternFull: state.patternFull,
            shuffledWords: state.shuffledWords.slice(),
            answerItems: state.answerItems.map(function (it) {
                return { id: it.id, word: it.word, poolIndex: it.poolIndex };
            }),
            usedIndices: state.usedIndices.slice(),
            isAnswered: state.isAnswered,
            currentIndex: state.currentIndex, score: state.score,
            history: state.history.map(function (h) { return { en: h.en, zh: h.zh, correct: h.correct }; }),
            scored: Array.from(state.scoredSentences),
            failed: Array.from(state.failedSentences),
            retryMode: state.retryMode, attempts: state.attempts,
            guided: state.guided, guidedIndex: state.guidedIndex,
            reviewQueue: (state.reviewQueue || []).slice(),
            srs: JSON.parse(JSON.stringify(state.srs || {})),
            autoRead: state.autoRead,
            qmode: state.qmode,
            moreOld: state.moreOldWords, splitPh: state.splitPhrases,
            hintOpen: patternToggle.classList.contains('on'),
            statusText: statusBadge.textContent, statusClass: statusBadge.className
        };
    }

    function tutRestore(s) {
        if (!s) return;
        if (autoNextTimer) { clearTimeout(autoNextTimer); autoNextTimer = null; }
        state.selectedUnits = new Set(s.units);
        state.currentEn = s.currentEn; state.currentZh = s.currentZh;
        state.reviewMode = s.reviewMode; state.srsMarked = s.srsMarked;
        state.correctWords = s.correctWords.slice();
        state.patternHint = s.patternHint; state.patternFull = s.patternFull;
        state.shuffledWords = s.shuffledWords.slice();
        state.answerItems = s.answerItems.map(function (it) {
            return { id: it.id, word: it.word, poolIndex: it.poolIndex };
        });
        state.usedIndices = s.usedIndices.slice();
        state.isAnswered = s.isAnswered;
        state.currentIndex = s.currentIndex; state.score = s.score;
        state.history = s.history.map(function (h) { return { en: h.en, zh: h.zh, correct: h.correct }; });
        state.scoredSentences = new Set(s.scored);
        state.failedSentences = new Set(s.failed);
        state.retryMode = s.retryMode; state.attempts = s.attempts;
        state.guided = s.guided; state.guidedIndex = s.guidedIndex;
        state.reviewQueue = s.reviewQueue.slice();
        state.srs = JSON.parse(JSON.stringify(s.srs));
        state.autoRead = s.autoRead;
        state.qmode = s.qmode;
        state.moreOldWords = s.moreOld;
        state.splitPhrases = s.splitPh;
        modeSelect.value = s.qmode;
        moreOldWordsCheck.checked = s.moreOld;
        splitPhrasesCheck.checked = s.splitPh;
        updateUnitTriggerLabel();
        updateHistoryUI();
        resetPatternHint();
        if (s.hintOpen && !patternToggle.hidden) patternToggle.click();   // 学生原来开着就还开着
        if (!state.currentEn) { showUnitPrompt(); return; }
        renderCardPool();
        renderAnswerZone();
        chineseHint.textContent = (state.qmode === 'listen' && !state.reviewMode)
            ? '（点下面「🔊 播放句子」听题）' : state.currentZh;
        progress.textContent = (state.currentIndex + 1) + '/' + state.totalQuestions;
        updateScore();
        checkBtn.disabled = state.isAnswered;
        nextBtn.disabled = !state.isAnswered;
        statusBadge.textContent = s.statusText;
        statusBadge.className = s.statusClass;
    }

    /* ---------- 运行器 ---------- */
    var tutIdx = 0, tutRunning = false, tutTimers = [], tutLoopTimer = null;

    function tutStopLoops() {
        tutTimers.forEach(function (id) { clearInterval(id); clearTimeout(id); });
        tutTimers = [];
        if (tutLoopTimer != null) { clearTimeout(tutLoopTimer); tutLoopTimer = null; }
    }
    function tutNext() { if (tutIdx < TUT_STEPS.length - 1) { tutGo(tutIdx + 1); } else { tutClose(); } }
    function tutPrev() { if (tutIdx > 0) tutGo(tutIdx - 1); }

    function tutRunStep() {
        var st = TUT_STEPS[tutIdx];
        var n = 0, busy = false;
        var fire = function () {
            if (!tutRunning || TUT_STEPS[tutIdx] !== st) return;
            if (busy) return;   // 上一次还没演完就别叠着起（否则单元表会被开两次）
            busy = true;
            Promise.resolve(st.run(n)).catch(function () {}).then(function () {
                busy = false;
                // 演示过程中聚光灯会临时指向别处（比如单元表）。演示一做完就把它
                // **收回这一步的锚点**，否则会停在一个已经被关掉的浮层原来的地方。
                if (tutRunning && TUT_STEPS[tutIdx] === st && st.sel) {
                    var el = document.querySelector(st.sel);
                    if (el) tutSpotOn([el], 8);
                }
                arm(st.loopMs);
            });
            n++;
        };
        // ⚠️⚠️ 「演完再等」的自调度链，**不要用 setInterval**：
        //     第 1 步光演示本身就有 5 秒（开单元表 → 全选 → 取消全选 → 选一个 → 确定），
        //     比它的 loopMs 还长 —— setInterval 会在演示进行中拍下好几拍，
        //     全被 busy 闸丢掉，实际周期变成两倍，验收里"停留 14.5 秒点了几次"
        //     就会时好时坏（实测同一份代码一次 unitConfirm=2、一次 =1）。
        //     自调度保证每一轮 = 演示 + loopMs，稳定推进。
        var arm = function (ms) {
            if (!ms || TUT_REDUCED) return;      // 减少动效下不循环（那正是"减少动效"的意思）
            tutLoopTimer = setTimeout(function () {
                tutLoopTimer = null;
                if (!tutRunning || TUT_STEPS[tutIdx] !== st) return;
                fire();
            }, ms);
        };
        fire();
    }

    function tutGo(i) {
        if (!tutRunning) return;
        tutIdx = Math.max(0, Math.min(TUT_STEPS.length - 1, i));
        var st = TUT_STEPS[tutIdx];
        tutStopLoops();
        tutClearTaps();
        tById('tutIco').textContent = st.ico;
        tById('tutH').textContent = st.h;
        tById('tutP').innerHTML = st.p;
        tById('tutNo').textContent = '第 ' + (tutIdx + 1) + ' 步 / 共 ' + TUT_STEPS.length + ' 步';
        tById('tutBar').style.width = ((tutIdx + 1) / TUT_STEPS.length * 100) + '%';
        tById('tutPrev').disabled = (tutIdx === 0);
        tById('tutNext').textContent = (tutIdx === TUT_STEPS.length - 1) ? '开始玩 🚀' : '下一步 →';
        var dots = tById('tutDots');
        dots.innerHTML = '';
        TUT_STEPS.forEach(function (_, k) {
            var d = document.createElement('i');
            if (k === tutIdx) d.className = 'on';
            d.addEventListener('click', function () { tutGo(k); });
            dots.appendChild(d);
        });
        if (st.sel) {
            var el = document.querySelector(st.sel);
            if (el) tutSpotOn([el], 8); else tutSpotOff();
        } else { tutSpotOff(); }
        if (tutCardEl) tutCardEl.classList.add('on');   // 尺寸随文案变，摆位前先让它可测
        tutRunStep();
    }

    function tutOpen() {
        if (tutRunning) return;
        tutRunning = true;
        tutSnap = tutSnapshot();
        // 演示期间：关掉"答对朗读后自动跳题"，掐掉挂着的自动跳题定时器 ——
        // 两者都会在演示中途把题换掉
        state.autoRead = false;
        if (autoNextTimer) { clearTimeout(autoNextTimer); autoNextTimer = null; }
        // 听音组句下没有中文、要靠点播放，教学不好演；先切回「看中文组句」（收尾还原）
        if (state.qmode === 'listen') { state.qmode = 'build'; modeSelect.value = 'build'; }
        try { lsSet(TUT_KEY, '1'); } catch (e) {}
        tById('tutTour').classList.add('show');
        tutCardEl.classList.add('on');
        // 一个单元都没选时（第一次安装），教学也得有东西可演：
        // 真的给一个单元、真的出一题；收尾会还原成"没选单元"的空状态
        if (state.selectedUnits.size === 0) {
            var first = Object.keys(TEMPLATES_DATA)[0];
            if (first) {
                state.selectedUnits = new Set([first]);
                state.reviewQueue = [];
                loadQuestion();
                if (!state.currentEn) {          // 这个单元没出题就退回空状态，别卡住
                    state.selectedUnits = new Set();
                    showUnitPrompt();
                }
            }
        }
        tutGo(0);
    }

    function tutClose() {
        if (!tutRunning) return;
        tutRunning = false;
        tutStopLoops();
        tutClearTaps();
        tById('tutTour').classList.remove('show');
        tutCardEl.classList.remove('on');
        tutSpotOff();
        // 关掉可能被演示打开的浮层
        var ov = tById('unitModalOverlay');
        if (ov && ov.classList.contains('show')) closeUnitModal();
        var wm = tById('wrongModalOverlay');
        if (wm) wm.classList.remove('show');
        // 整份放回学生原来的状态
        tutRestore(tutSnap);
        tutSnap = null;
    }

    /* ---------- 事件 ---------- */
    tById('tutNext').addEventListener('click', tutNext);
    tById('tutPrev').addEventListener('click', tutPrev);
    tById('tutClose').addEventListener('click', tutClose);
    tById('tutTour').addEventListener('click', function (e) { if (e.target === this) tutNext(); });
    document.addEventListener('keydown', function (e) {
        if (!tutRunning) return;
        if (e.key === 'Escape' || e.key === 'Esc') { e.preventDefault(); tutClose(); }
        else if (e.key === 'ArrowRight' || e.key === 'Enter') { e.preventDefault(); tutNext(); }
        else if (e.key === 'ArrowLeft') { e.preventDefault(); tutPrev(); }
    });
    window.addEventListener('resize', function () { if (tutRunning) tutPlaceCard(); });
    var tutBtn = tById('tutorialBtn');
    if (tutBtn) tutBtn.addEventListener('click', tutOpen);

    // 首次打开自动弹一次（看完就记下，之后只从 ❓ 进）
    var tutSeen = '0';
    try { tutSeen = lsGet(TUT_KEY) || '0'; } catch (e) {}
    if (tutSeen !== '1') setTimeout(tutOpen, 700);


    // ================================================================
    //  17. 清理
    // ================================================================
    document.addEventListener('visibilitychange', () => {
        if (document.hidden && dragState) {
            dragState.ghost.remove();
            dragState = null;
            isDragging = false;
            renderAnswerZone();
        }
    });
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            if (unitModalOverlay.classList.contains('show')) closeUnitModal();
            if (splitPhrasesConfirmOverlay.classList.contains('show')) {
                splitPhrasesCancel.click();
            }
        }
    });

    // ================================================================
    //  18. 启动
    // ================================================================
    setupBigCardGlow();
    setupPanelTilt();

    readSavedUnits().forEach(u => state.selectedUnits.add(u));
    updateUnitTriggerLabel();

    splitPhrasesCheck.checked = true;
    state.splitPhrases = true;

    loadHistoryFromStorage();
    updateHistoryUI();
    loadSrs();
    state.reviewQueue = [];
    const savedMode = lsGet(LS_MODE);
    if (savedMode && ['build', 'listen'].indexOf(savedMode) >= 0) {
        state.qmode = savedMode;
        modeSelect.value = savedMode;
    } else {
        state.qmode = 'build';
    }
    state.autoRead = lsGet(LS_AUTOREAD) !== '0';
    autoReadCheck.checked = state.autoRead;

    if (state.selectedUnits.size === 0) {
        showUnitPrompt();
    } else {
        loadQuestion();
        statusBadge.textContent = '🎯 点击下方单词开始';
        statusBadge.className = 'status-badge';
    }

    console.log('🧩 句型建筑师 · 已启动（卡片池小写 + 位置识别首字母大写）');
});
</script>
</body>
</html>
