<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
<title>🧩 句型建筑师 · 小学英语句型练习</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
        --ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);
        --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
        --anim-ease: var(--ease-smooth);
    }
    body {
        font-family: 'Segoe UI', 'PingFang SC', Roboto, system-ui, sans-serif;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: clamp(10px, 1.5vw, 24px);
        background: linear-gradient(145deg, #fce4d6 0%, #fde9d0 40%, #fef6e0 100%);
        transition: background 0.8s var(--ease-smooth);
        perspective: 1800px;
        perspective-origin: 50% 50%;
        overflow-x: hidden;
    }
    .app {
        width: 100%;
        max-width: min(1280px, calc(100vw - 32px));
        background: rgba(255, 245, 235, 0.70);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-radius: clamp(28px, 3vw, 48px);
        border: 1px solid rgba(255, 220, 180, 0.6);
        box-shadow: 0 20px 60px rgba(200, 150, 100, 0.12);
        overflow: hidden;
        transition: all 0.6s var(--ease-spring);
        position: relative;
        transform-style: preserve-3d;
        transform-origin: 50% 50%;
        will-change: transform;
    }
    .app.high-end {
        --anim-ease: var(--ease-spring);
        background:
            linear-gradient(160deg,
                rgba(255, 255, 255, 0.07) 0%,
                rgba(255, 250, 244, 0.03) 42%,
                rgba(255, 246, 236, 0.02) 62%,
                rgba(255, 255, 255, 0.05) 100%);
        backdrop-filter: blur(72px) saturate(190%) brightness(1.07) contrast(1.01);
        -webkit-backdrop-filter: blur(72px) saturate(190%) brightness(1.07) contrast(1.01);
        border: 1px solid rgba(255, 255, 255, 0.32);
        box-shadow:
            0 48px 120px rgba(180, 130, 80, 0.16),
            0 18px 44px rgba(255, 175, 135, 0.09),
            0 4px 14px rgba(255, 150, 120, 0.05),
            inset 0 1.5px 0 rgba(255, 255, 255, 1),
            inset 0 -1.5px 0.5px rgba(255, 205, 175, 0.35),
            inset 1px 0 0 rgba(255, 255, 255, 0.55),
            inset -1px 0 0 rgba(255, 255, 255, 0.55),
            inset 0 0 90px rgba(255, 225, 200, 0.06);
    }
    .app.high-end::before {
        content: '';
        position: absolute; inset: 0; border-radius: inherit;
        background:
            radial-gradient(ellipse 70% 30% at 22% 0%, rgba(255, 255, 255, 0.28), transparent 62%),
            radial-gradient(ellipse 50% 40% at 85% 100%, rgba(255, 190, 165, 0.12), transparent 68%),
            radial-gradient(ellipse 40% 20% at 60% 5%, rgba(255, 250, 240, 0.20), transparent 65%),
            radial-gradient(ellipse 30% 25% at 5% 85%, rgba(255, 210, 235, 0.08), transparent 70%);
        pointer-events: none; z-index: 0;
        filter: blur(18px); opacity: 0.85;
        animation: liquidShift 20s ease-in-out infinite alternate;
    }
    .app.high-end::after {
        content: '';
        position: absolute; inset: 0; border-radius: inherit; padding: 1px;
        background: conic-gradient(from 200deg at 50% 50%,
                rgba(255, 224, 196, 0.40), rgba(255, 190, 215, 0.22),
                rgba(200, 222, 255, 0.26), rgba(200, 255, 235, 0.18),
                rgba(255, 244, 196, 0.36), rgba(255, 224, 196, 0.40));
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        mask-composite: exclude;
        pointer-events: none; opacity: 0.55; z-index: 2; mix-blend-mode: screen;
    }
    @keyframes liquidShift {
        0%   { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 0.85; }
        50%  { transform: translate(1.5%, 1%) scale(1.03) rotate(0.8deg); opacity: 1; }
        100% { transform: translate(-1%, 1.5%) scale(1.015) rotate(-0.7deg); opacity: 0.9; }
    }
    .app.high-end .header,
    .app.high-end .settings {
        backdrop-filter: blur(28px) saturate(180%);
        -webkit-backdrop-filter: blur(28px) saturate(180%);
    }
    .app.high-end .header {
        background: linear-gradient(180deg, rgba(255,255,255,.10) 0%, rgba(255,250,244,.03) 100%);
        border-bottom: 1px solid rgba(255,255,255,.20);
        box-shadow: inset 0 1px 0 rgba(255,255,255,.75);
    }
    .app.high-end .settings {
        background: linear-gradient(180deg, rgba(255,255,255,.06) 0%, rgba(255,250,244,.02) 100%);
        border-bottom: 1px solid rgba(255,255,255,.16);
        box-shadow: inset 0 1px 0 rgba(255,255,255,.55);
    }
    .app.high-end .info-bar,
    .app.high-end .chinese-hint,
    .app.high-end .status-badge,
    .app.high-end .card-pool,
    .app.high-end .answer-zone,
    .app.high-end .history-section {
        background:
            linear-gradient(152deg,
                rgba(255, 255, 255, 0.09) 0%,
                rgba(255, 255, 255, 0.03) 48%,
                rgba(255, 250, 242, 0.05) 100%);
        backdrop-filter: blur(34px) saturate(200%) brightness(1.08);
        -webkit-backdrop-filter: blur(34px) saturate(200%) brightness(1.08);
        border: 1px solid rgba(255, 255, 255, 0.28);
        box-shadow:
            inset 0 1.5px 0 rgba(255, 255, 255, 0.95),
            inset 0 -1px 0.5px rgba(255, 205, 175, 0.22),
            0 6px 20px rgba(180, 130, 80, 0.06);
    }
    .app.high-end .info-bar,
    .app.high-end .chinese-hint,
    .app.high-end .history-section,
    .app.high-end .card-pool,
    .app.high-end .answer-zone { position: relative; }
    .app.high-end .info-bar::after,
    .app.high-end .chinese-hint::after,
    .app.high-end .history-section::after,
    .app.high-end .card-pool::after,
    .app.high-end .answer-zone::after {
        content: '';
        position: absolute; inset: 0; border-radius: inherit;
        background: radial-gradient(circle 240px at var(--cx, 50%) var(--cy, 50%),
                rgba(255, 255, 255, 0.16) 0%,
                rgba(255, 245, 232, 0.06) 42%,
                transparent 72%);
        opacity: var(--glow-op, 0);
        transition: opacity 0.55s ease;
        pointer-events: none;
        mix-blend-mode: screen;
        z-index: 3;
    }
    .app.high-end .card-pool .token,
    .app.high-end .answer-zone .token {
        background:
            linear-gradient(142deg,
                rgba(255, 255, 255, 0.32) 0%,
                rgba(255, 255, 255, 0.14) 40%,
                rgba(255, 248, 238, 0.16) 68%,
                rgba(255, 236, 218, 0.24) 100%);
        backdrop-filter: blur(24px) saturate(210%) brightness(1.10);
        -webkit-backdrop-filter: blur(24px) saturate(210%) brightness(1.10);
        border: 1px solid rgba(255, 255, 255, 0.48);
        box-shadow:
            inset 0 1.5px 0 rgba(255, 255, 255, 0.98),
            inset 0 -1px 0.5px rgba(255, 205, 175, 0.28),
            inset 1px 0 0 rgba(255, 255, 255, 0.45),
            inset -1px 0 0 rgba(255, 255, 255, 0.45),
            inset 0 0 26px rgba(255, 245, 232, 0.10),
            0 8px 22px rgba(180, 130, 80, 0.12),
            0 2px 6px rgba(180, 130, 80, 0.06);
        will-change: transform;
        transform-style: preserve-3d;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
    }
    .app.high-end .card-pool .token.used {
        opacity: 0;
        transform: scale(0.6) translateY(-28px) rotate(-8deg) !important;
    }
    .app.high-end .btn-glass,
    .app.high-end .action-row .btn,
    .app.high-end .info-bar .actions button,
    .app.high-end .tutorial-nav .btn,
    .app.high-end .tutorial-close,
    .app.high-end .history-list .h-item {
        backdrop-filter: blur(20px) saturate(190%);
        -webkit-backdrop-filter: blur(20px) saturate(190%);
    }
    .app.high-end .btn-glass {
        background: linear-gradient(150deg, rgba(255,255,255,.18) 0%, rgba(255,255,255,.06) 55%, rgba(255,248,240,.10) 100%);
        border: 1px solid rgba(255, 255, 255, 0.42);
        color: #6a3f28;
        box-shadow:
            inset 0 1px 0 rgba(255, 255, 255, 0.88),
            inset 0 -1px 0 rgba(255, 205, 175, 0.18),
            0 4px 14px rgba(180, 130, 80, 0.06);
    }
    .app.high-end .btn-glass:hover {
        background: linear-gradient(150deg, rgba(255,255,255,.30) 0%, rgba(255,250,244,.14) 100%);
        border-color: rgba(255, 240, 220, 0.70);
        transform: scale(1.05);
    }
    .app.high-end .btn-glass.on {
        background: linear-gradient(140deg,
            rgba(255, 226, 200, 0.48) 0%,
            rgba(255, 200, 165, 0.36) 50%,
            rgba(228, 165, 130, 0.42) 100%);
        border: 1px solid rgba(255, 255, 255, 0.55);
        color: #5a3020;
        box-shadow:
            inset 0 1.5px 0 rgba(255, 255, 255, 0.92),
            inset 0 -1px 0 rgba(190, 120, 80, 0.20),
            0 4px 14px rgba(217, 140, 106, 0.18);
    }
    .app.high-end .action-row .btn-primary {
        background: linear-gradient(148deg,
            rgba(255, 226, 200, 0.56) 0%,
            rgba(252, 200, 165, 0.42) 50%,
            rgba(228, 158, 126, 0.50) 100%);
        border: 1px solid rgba(255, 255, 255, 0.55);
        color: #fff;
        text-shadow: 0 1px 2px rgba(140, 70, 40, 0.20);
        box-shadow:
            inset 0 1.5px 0 rgba(255, 255, 255, 0.92),
            inset 0 -1px 0 rgba(190, 120, 80, 0.24),
            0 8px 24px rgba(217, 140, 106, 0.22);
    }
    .app.high-end .action-row .btn-primary:hover:not(:disabled) {
        background: linear-gradient(148deg,
            rgba(255, 236, 216, 0.68) 0%,
            rgba(255, 208, 175, 0.52) 50%,
            rgba(238, 172, 140, 0.60) 100%);
        border-color: rgba(255, 255, 255, 0.72);
        transform: translateY(-3px) scale(1.03);
    }
    .app.high-end .action-row .btn-primary:disabled { opacity: 0.42; }
    .app.high-end .action-row .btn-secondary {
        background: linear-gradient(150deg,
            rgba(255, 255, 255, 0.20) 0%,
            rgba(255, 255, 255, 0.07) 50%,
            rgba(255, 246, 236, 0.12) 100%);
        border: 1px solid rgba(255, 255, 255, 0.44);
        color: #5a3a2a;
        box-shadow:
            inset 0 1px 0 rgba(255, 255, 255, 0.88),
            inset 0 -1px 0 rgba(255, 205, 175, 0.16),
            0 4px 14px rgba(180, 130, 80, 0.06);
    }
    .app.high-end .action-row .btn-secondary:hover {
        background: linear-gradient(150deg,
            rgba(255, 255, 255, 0.34) 0%,
            rgba(255, 250, 244, 0.16) 100%);
        border-color: rgba(255, 240, 220, 0.72);
        transform: translateY(-3px);
    }
    .app.high-end .info-bar .actions button {
        background: linear-gradient(150deg, rgba(255,255,255,.18) 0%, rgba(255,255,255,.06) 100%);
        border: 1px solid rgba(255, 255, 255, 0.40);
        color: #5a3a2a;
        box-shadow:
            inset 0 1px 0 rgba(255, 255, 255, 0.80),
            0 3px 10px rgba(180, 130, 80, 0.06);
    }
    .app.high-end .history-list .h-item {
        background: linear-gradient(150deg, rgba(255,255,255,.14) 0%, rgba(255,255,255,.04) 100%);
        border: 1px solid rgba(255, 255, 255, 0.32);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.62);
    }
    .header {
        padding: clamp(12px, 1.6vh, 22px) clamp(18px, 2vw, 32px);
        display: flex; flex-wrap: wrap; gap: 8px 16px;
        align-items: center; justify-content: space-between;
        background: rgba(255, 235, 215, 0.40);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255, 220, 180, 0.3);
        position: relative; z-index: 1;
    }
    .logo {
        font-size: clamp(1.05rem, 0.6vw + 0.85rem, 1.5rem);
        font-weight: 800; color: #7a4a2a;
        display: flex; align-items: center; gap: 6px;
    }
    .logo span {
        background: linear-gradient(135deg, #f7b88a, #d98c6a);
        color: #fff;
        font-size: clamp(0.5rem, 0.2vw + 0.45rem, 0.65rem);
        padding: 2px 12px; border-radius: 30px; font-weight: 700;
    }
    .header-actions { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
    .btn-glass {
        background: rgba(255, 235, 215, 0.4);
        border: 1px solid rgba(255, 200, 160, 0.3);
        border-radius: 30px;
        padding: clamp(4px, 0.6vh, 7px) clamp(10px, 1vw, 16px);
        font-size: clamp(0.8rem, 0.3vw + 0.7rem, 1rem);
        cursor: pointer;
        transition: all 0.3s var(--ease-spring);
        font-family: inherit; color: #7a4a2a;
        backdrop-filter: blur(4px);
        position: relative; z-index: 1;
    }
    .btn-glass:hover { background: rgba(255, 245, 235, 0.7); border-color: #f7b88a; transform: scale(1.05); }
    .btn-glass.on {
        background: linear-gradient(135deg, rgba(255, 200, 160, 0.6), rgba(240, 160, 120, 0.5));
        border-color: rgba(255, 200, 160, 0.9);
        color: #5a3020;
        box-shadow:
            0 0 20px rgba(240, 160, 120, 0.4),
            inset 0 1px 0 rgba(255, 255, 255, 0.8);
    }
    .btn-icon { min-width: 40px; min-height: 40px; text-align: center; padding: 6px 10px; }
    .settings {
        padding: clamp(8px, 1.2vh, 14px) clamp(16px, 1.8vw, 26px);
        display: flex; flex-wrap: wrap; gap: 6px 14px;
        align-items: center;
        background: rgba(255, 235, 215, 0.35);
        border-bottom: 1px solid rgba(255, 220, 180, 0.25);
        position: relative; z-index: 1;
    }
    .settings .group { display: flex; align-items: center; gap: 4px 8px; flex-wrap: wrap; }
    .settings .group > label {
        font-size: clamp(0.55rem, 0.15vw + 0.5rem, 0.7rem);
        text-transform: uppercase; letter-spacing: 0.5px;
        font-weight: 700; color: #8a6a4a;
    }
    .settings .switch {
        display: flex; align-items: center; gap: 6px;
        font-size: clamp(0.65rem, 0.15vw + 0.6rem, 0.8rem);
        font-weight: 600; color: #5a3a2a; cursor: pointer;
    }
    .settings .switch input { width: 36px; height: 18px; accent-color: #d98c6a; cursor: pointer; }
    .settings .switch label { cursor: pointer; }
    .unit-trigger-btn {
        background: #fffaf3;
        border: 1px solid rgba(220, 180, 140, 0.4);
        border-radius: 20px;
        padding: 5px 14px;
        font-size: clamp(0.7rem, 0.15vw + 0.62rem, 0.85rem);
        font-weight: 700;
        color: #5a3a2a;
        cursor: pointer;
        font-family: inherit;
        transition: all 0.2s ease;
        display: inline-flex;
        align-items: center;
        gap: 6px;
    }
    .unit-trigger-btn:hover {
        background: #fff5eb;
        border-color: #f7b88a;
        transform: translateY(-1px);
    }
    .unit-trigger-btn .count {
        background: linear-gradient(135deg, #f7b88a, #d98c6a);
        color: #fff;
        border-radius: 12px;
        padding: 1px 9px;
        font-size: 0.7rem;
        font-weight: 700;
        min-width: 22px;
        text-align: center;
    }
    .unit-trigger-btn.need-pick { background: #fff3e2; border-color: #d98c6a; animation: pop 0.6s var(--ease-spring); }
    .unit-trigger-btn.need-pick .count { background: #b05a4a; }
    .main { padding: clamp(12px, 2vh, 24px) clamp(18px, 2vw, 32px) clamp(16px, 2.4vh, 28px); position: relative; z-index: 1; }
    .info-bar {
        display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
        gap: 8px 16px; padding: clamp(5px, 0.7vh, 9px) clamp(12px, 1.4vw, 20px);
        background: rgba(255, 235, 215, 0.35);
        border-radius: 40px; border: 1px solid rgba(255, 220, 180, 0.3);
        margin-bottom: clamp(10px, 1.4vh, 16px);
    }
    .info-bar .item {
        display: flex; align-items: center; gap: 6px;
        font-weight: 600;
        font-size: clamp(0.75rem, 0.2vw + 0.7rem, 0.9rem);
        color: #5a3a2a;
    }
    .info-bar .item .num {
        background: rgba(247, 184, 138, 0.2); padding: 2px 14px;
        border-radius: 30px; font-weight: 700; color: #7a4a2a;
    }
    .info-bar .item .score-num {
        background: linear-gradient(135deg, #ffb88a, #e08a6a);
        color: #fff; padding: 2px 16px; border-radius: 30px; font-weight: 700;
    }
    .info-bar .actions button {
        background: rgba(255, 235, 215, 0.4);
        border: 1px solid rgba(255, 200, 160, 0.2);
        border-radius: 30px; padding: 4px 14px;
        font-size: clamp(0.65rem, 0.15vw + 0.6rem, 0.8rem);
        font-weight: 700; color: #5a3a2a;
        cursor: pointer; transition: 0.25s var(--anim-ease); font-family: inherit;
    }
    .info-bar .actions button:hover { background: #fff9f0; border-color: #f7b88a; transform: translateY(-2px); }
    .chinese-hint {
        font-size: clamp(1.05rem, 0.4vw + 0.9rem, 1.4rem);
        font-weight: 700; color: #4a2a1a; text-align: center;
        padding: clamp(8px, 1.2vh, 14px) clamp(10px, 1.2vw, 16px);
        background: rgba(255, 235, 215, 0.4);
        border-radius: 30px; border: 1px solid rgba(255, 220, 180, 0.3);
        margin-bottom: clamp(8px, 1.2vh, 14px);
        min-height: clamp(44px, 5vh, 58px);
        display: flex; align-items: center; justify-content: center;
        gap: 8px; flex-wrap: wrap;
    }
    .chinese-hint .label {
        font-size: clamp(0.55rem, 0.15vw + 0.5rem, 0.7rem);
        text-transform: uppercase; letter-spacing: 0.5px;
        color: #8a6a4a; background: rgba(247, 184, 138, 0.15);
        padding: 0 12px; border-radius: 20px;
    }
    .chinese-hint .zh { font-size: clamp(1.15rem, 0.5vw + 0.95rem, 1.55rem); }
    .pattern-toggle {
        font-family: inherit; font-weight: 700; cursor: pointer;
        font-size: clamp(0.6rem, 0.15vw + 0.55rem, 0.75rem);
        color: #7a4a2a; background: rgba(247, 184, 138, 0.2);
        border: 1px dashed rgba(217, 140, 106, 0.6);
        padding: 6px 14px; border-radius: 30px;
        transition: all 0.2s ease;
    }
    .pattern-toggle:hover { background: rgba(247, 184, 138, 0.38); transform: translateY(-1px); }
    .pattern-toggle.on { background: rgba(217, 140, 106, 0.3); border-style: solid; }
    .pattern-badge[hidden], .pattern-toggle[hidden] { display: none; }
    .pattern-badge {
        font-size: clamp(0.6rem, 0.15vw + 0.55rem, 0.75rem);
        background: rgba(217, 140, 106, 0.15);
        padding: 2px 16px; border-radius: 30px;
        color: #7a4a2a; font-weight: 600; display: inline-block; margin-top: 2px;
    }
    .status-badge {
        display: block; padding: clamp(5px, 0.7vh, 9px) 18px; border-radius: 40px;
        font-weight: 700;
        font-size: clamp(0.75rem, 0.2vw + 0.7rem, 0.95rem);
        background: rgba(255, 235, 215, 0.3);
        color: #5a3a2a; border: 1px solid rgba(255, 220, 180, 0.25);
        margin-bottom: clamp(10px, 1.4vh, 16px);
        text-align: center; min-height: 38px;
        line-height: 1.6; transition: all 0.4s var(--anim-ease);
    }
    .status-badge.correct { background: #fce4d6; color: #7a4a2a; border-color: #e08a6a; animation: pop 0.6s var(--ease-spring); }
    .status-badge.wrong { background: #fce4d6; color: #b05a4a; border-color: #d98c6a; animation: shake 0.55s var(--ease-spring); }
    .status-badge.done { background: #fde9d0; border-color: #f7b88a; }
    /* 连错 6 次后的「对位卡片」引导 */
    .guide-card {
        margin: 0 0 clamp(10px, 1.4vh, 16px);
        padding: clamp(8px, 1.2vh, 14px) clamp(10px, 1.2vw, 16px);
        background: linear-gradient(135deg, #fff3e2, #ffe9d4);
        border: 2px solid rgba(217, 140, 106, 0.55);
        border-radius: clamp(18px, 1.8vw, 26px);
        animation: pop 0.5s var(--ease-spring);
    }
    .guide-card[hidden] { display: none; }
    .guide-title {
        font-size: clamp(0.72rem, 0.2vw + 0.66rem, 0.9rem);
        font-weight: 700; color: #7a4a2a; text-align: center;
        margin-bottom: 8px;
    }
    .guide-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .guide-slot {
        display: flex; align-items: center; gap: 6px;
        padding: 6px 12px; border-radius: 14px;
        background: #fffdf8;
        border: 1.5px dashed rgba(220, 180, 140, 0.6);
        font-weight: 700; color: #a08060;
        font-size: clamp(0.72rem, 0.2vw + 0.66rem, 0.92rem);
    }
    .guide-slot .guide-idx {
        font-size: 0.62rem; color: #fff; background: #c9a98c;
        border-radius: 10px; padding: 0 7px;
    }
    .guide-slot.done { border-style: solid; border-color: #b8c9a0; background: #f4f8ee; color: #6a7a5a; }
    .guide-slot.done .guide-idx { background: #8aa06a; }
    .guide-slot.now {
        border-style: solid; border-color: #d98c6a; background: #ffe4cc; color: #7a4a2a;
        box-shadow: 0 2px 10px rgba(217, 140, 106, 0.3);
        animation: demoPatternPulse 1.6s ease-in-out infinite;

/* ============================================================
   玩法教学 · 真实界面导览（教练标记 coach marks）
   做法照「作业过关墙」/「中英消消乐」那一套，关键差别在这里：
   **不在空舞台上摆示意图，而是圈住真实控件、在真按钮上打点击涟漪、
     并且真的去操作界面**（真开单元表、真点单词、真拖卡片、真点检查）。
   · .tut-spot 用 box-shadow:0 0 0 9999px 挖一个洞把周围压暗；
     它的 left/top/width/height 都带缓动 —— 换目标时聚光灯是**滑过去**的，
     不是跳过去（这一条是"优雅"的一半）
   · .tut-tap / .tut-tap-scale 打在真元素上：涟漪 / 按压
   · 每一步的 run() 直接点真元素，走工具自己的处理器，
     所以声音、动画、计分、判分全是真的
   · .tut-tour 层接管点击（学生中途点不坏演示），只有讲解卡上的按钮可点
   ⚠️ 层级必须在所有弹窗之上：单元表是 21000、错题本/确认弹窗是 22000，
      这里给 30000，否则挖洞压暗盖不住弹窗，聚光灯那道环也会被弹窗压住。
   ============================================================ */
.tut-tour{position:fixed;inset:0;z-index:30000;display:none}
.tut-tour.show{display:block}
.tut-spot{
  position:fixed;border-radius:14px;pointer-events:none;
  box-shadow:0 0 0 9999px rgba(58,32,14,.58);
  transition:left .42s cubic-bezier(.22,.8,.24,1),top .42s cubic-bezier(.22,.8,.24,1),
             width .42s cubic-bezier(.22,.8,.24,1),height .42s cubic-bezier(.22,.8,.24,1),
             border-radius .3s,opacity .3s;
}
.tut-spot.off{opacity:0}
/* 洞边上那道呼吸的环 */
.tut-spot::after{
  content:'';position:absolute;inset:-6px;border-radius:20px;
  border:2px solid rgba(247,184,138,.98);
  animation:spotRing 1.7s ease-out infinite;
}
@keyframes spotRing{
  0%{transform:scale(.995);opacity:.95;box-shadow:0 0 0 0 rgba(217,140,106,.55)}
  70%{transform:scale(1.035);opacity:0;box-shadow:0 0 0 18px rgba(217,140,106,0)}
  100%{opacity:0}
}
/* 讲解卡：跟着聚光灯走 */
.tut-card{
  position:fixed;width:min(348px,86vw);z-index:31000;
  background:linear-gradient(170deg,#fffdf9 0%,#fff4e6 100%);
  border-radius:16px;padding:13px 15px 11px;color:#4a2c17;

    // ================================================================
    //  2. 音效
    // ================================================================
    const Sound = {
        ctx: null,
        init() {
            if (!this.ctx) {
                try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { return; }
            }
            if (this.ctx.state === 'suspended') this.ctx.resume();
        },
        play(freq, dur = 0.08, vol = 0.2, type = 'sine') {
            if (!this.ctx) return;
            try {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(this.ctx.currentTime);
                osc.stop(this.ctx.currentTime + dur);
            } catch(e) {}
        },
        click() { this.play(660, 0.05, 0.08); setTimeout(()=>this.play(880,0.04,0.06), 30); },
        correct() { this.play(880, 0.1, 0.2); setTimeout(() => this.play(1108, 0.12, 0.2), 90); },

    function fnv1a8(text) {
        let h = 0x811C9DC5;
        const bytes = new TextEncoder().encode(text);
        for (let i = 0; i < bytes.length; i++) {
            h ^= bytes[i];
            h = Math.imul(h, 0x01000193) >>> 0;
        }
        return h.toString(16).padStart(8, '0');
    }
    // 与「英语认读系统」逐字节一致：<安全化前40字符>__<FNV-1a 前 8 位>.mp3
    function sentenceFileName(text) {
        const s = String(text || '');
        let slug = '';
        for (const ch of s) {
            slug += /[A-Za-z0-9]/.test(ch) ? ch : '_';
            if (slug.length >= 40) break;
        }
        return slug + '__' + fnv1a8(s) + '.mp3';
    }

    function getAudioEl() {

    function playUrl(url, timeoutMs) {
        if (audioMissing.has(url)) return Promise.resolve(false);
        return new Promise(resolve => {
            const el = getAudioEl();
            let done = false;
            const onErr = () => { audioMissing.add(url); finish(false); };
            const onOk = () => finish(true);
            function finish(ok) {
                if (done) return;
                done = true;
                el.removeEventListener('error', onErr);
                el.removeEventListener('playing', onOk);
                resolve(ok);
            }
            el.addEventListener('error', onErr, { once: true });
            el.addEventListener('playing', onOk, { once: true });
            el.src = url;
            const p = el.play();
            if (p && p.catch) p.catch(() => finish(false));   // NotAllowedError / AbortError
            setTimeout(() => finish(false), timeoutMs || 6000);
        });
    }
    function speakSentence(text) {
        // 手机（尤其 iOS）要求 speak() 发生在用户手势的直接调用链里：
        // 所以这里在 await 之前就同步调用，并用 onstart 判定到底有没有真的播出来
        return new Promise(resolve => {
            if (!('speechSynthesis' in window) || !window.SpeechSynthesisUtterance) { resolve(false); return; }
            let done = false;
            const ok = () => { if (!done) { done = true; resolve(true); } };
            const no = () => { if (!done) { done = true; resolve(false); } };
            try {
                speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(String(text));
                u.lang = 'en-US';
                u.rate = 0.9;
                u.onstart = ok;
                u.onerror = no;
                speechSynthesis.speak(u);
                setTimeout(no, 1800);   // 没有手势时不会触发 start
            } catch (e) { no(); }
        });
    }

    // 所以按「原样 → 全小写 → 首字母大写」依次试（本地碰巧能过、线上会 404 的坑）
    function wordAudioCandidates(w) {
        const out = [w, w.toLowerCase()];
        const cap = w.charAt(0).toUpperCase() + w.slice(1).toLowerCase();
        if (out.indexOf(cap) === -1) out.push(cap);

        if (await playUrl('./audio/' + encodeURIComponent(sentenceFileName(text)))) {
            audioFilesUsable = true;
            return 'file';
        }
        const words = String(text).match(/[A-Za-z'\-]+/g) || [];
        let all = words.length > 0;
        for (const w of words) {
            let played = false;
            for (const cand of wordAudioCandidates(w)) {

            }
            if (!played) { all = false; break; }
            await new Promise(r => setTimeout(r, 90));
        }
        if (all) { audioFilesUsable = true; return 'words'; }
        audioFilesUsable = false;
        return (await speakSentence(text)) ? 'tts' : 'none';
    }

    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];

    function normalizeToken(token) {
        if (token === null || token === undefined) return '';
        return String(token).toLowerCase().replace(/[.,!?;:]/g, '').trim();
    }
    function isPunctuationToken(t) {
        return /^[.,!?;:]+$/.test(t);

    // ★ 卡片池显示形式：普通单词小写，专有名词保留原始大小写
    function toDisplayForm(word) {
        if (!word) return word;
        if (isPunctuationToken(word)) return word;
        if (word === "'s") return word;
        const lower = word.toLowerCase();
        if (PROPER_NOUNS.has(lower)) {
            return word; // 专有名词保留原样
        }
        return lower; // 普通单词 → 全小写
    }

    // ★ 答题区第一个位置显示形式：普通单词首字母大写，专有名词保留原样
    function toFirstPositionForm(word) {
        if (!word) return word;
        if (isPunctuationToken(word)) return word;
        if (word === "'s") return word;
        const lower = word.toLowerCase();
        if (PROPER_NOUNS.has(lower)) {
            return word; // 专有名词保留原样
        }
        // 首字母大写
        return lower.charAt(0).toUpperCase() + lower.slice(1);
    }

    // 拆解 's
    function tokenizePhraseAware(sentence, splitPhrases) {
        let rawTokens = sentence.match(/[A-Za-z'\-]+|[.,!?;:]/g) || [];

        let tokens = [];
        for (const t of rawTokens) {
            const lowerT = t.toLowerCase();
            if (lowerT.endsWith("'s") && lowerT.length > 2 && !lowerT.endsWith("-'s")) {
                const stem = t.slice(0, -2);
                if (/[A-Za-z]/.test(stem)) {
                    tokens.push(stem);
                    tokens.push("'s");
                    continue;
                }
            }
            tokens.push(t);
        }

        if (splitPhrases) return tokens;

        const phrases = KNOWN_PHRASES.slice().sort((a, b) => b.split(/\s+/).length - a.split(/\s+/).length);
        let result = [];
        let i = 0;
        while (i < tokens.length) {
            let matched = false;
            for (const phrase of phrases) {
                const phraseWords = phrase.toLowerCase().split(/\s+/);
                if (i + phraseWords.length > tokens.length) continue;
                let match = true;
                for (let j = 0; j < phraseWords.length; j++) {
                    const tokenClean = normalizeToken(tokens[i + j]);
                    if (tokenClean !== phraseWords[j]) { match = false; break; }
                }
                if (match) {
                    const merged = tokens.slice(i, i + phraseWords.length).join(' ');
                    result.push(merged);
                    i += phraseWords.length;
                    matched = true;
                    break;
                }
            }
            if (!matched) {
                result.push(tokens[i]);
                i++;
            }
        }
        return result;
    }

    function lower(arr) { return arr.map(w => String(w).toLowerCase()); }

    // 当前选中单元里、所有槽位词表出现过的词
    function buildUnitWordPool() {

    // 这一题用到的槽位里的全部候选词（同类型近邻，做干扰词最有价值）
    function collectSlotPool(template) {
        const seen = new Set();
        Object.keys(template.slots || {}).forEach(k => {
            (template.slots[k] || []).forEach(item => {
                if (item && item.en) seen.add(item.en);

    // 干扰词按「同槽位类型 → 同单元 → 全库」三层取。
    // 原来直接从全局 OLD_WORDS 里抽，会出现"练第一单元却混进其它单元的单词"
    function getDistractors(excludeLower, count = 4, slotPool = null) {
        const used = new Set(excludeLower);
        const picked = [];
        const tiers = [];
        if (slotPool && slotPool.length) tiers.push(slotPool);
        tiers.push(buildUnitWordPool());
        tiers.push(OLD_WORDS);
        for (const tier of tiers) {
            if (picked.length >= count) break;
            for (const w of shuffleArray(tier.slice())) {
                if (picked.length >= count) break;
                const lw = String(w).toLowerCase();
                if (!lw || used.has(lw)) continue;
                used.add(lw);
                picked.push(w);
            }
        }
        return picked.slice(0, count);
    }
    function getBe(num) { return num === 'p' ? 'are' : 'is'; }
    function ease() {
