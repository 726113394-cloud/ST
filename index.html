<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
<title>🧩 句型建筑师 · 液态玻璃版</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
        --ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);
        --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
        --anim-ease: var(--ease-smooth);
    }
    body {
        font-family: 'Segoe UI', 'PingFang SC', Roboto, system-ui, sans-serif;
        min-height: 100vh; display: flex; justify-content: center; align-items: center;
        padding: clamp(10px, 1.5vw, 24px);
        background: linear-gradient(145deg, #fce4d6 0%, #fde9d0 40%, #fef6e0 100%);
    }

    /* ============================================================
       基础（扁平模式）—— 关闭高级渲染时使用，最大限度削减渲染负担
       ============================================================ */
    .app {
        width: 100%; max-width: min(1280px, calc(100vw - 32px));
        background: #fffaf3;
        border-radius: clamp(16px, 1.6vw, 24px);
        border: 1px solid rgba(220, 180, 140, 0.35);
        box-shadow: 0 2px 12px rgba(200, 150, 100, 0.08);
        overflow: hidden;
        position: relative;
        transition: background 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }

    /* ============================================================
       高级渲染 · iOS 26 液态玻璃（减弱卡片立体感）
       ============================================================ */
    .app.high-end {
        --anim-ease: var(--ease-spring);
        background:
            linear-gradient(160deg,
                rgba(255, 255, 255, 0.07) 0%, rgba(255, 250, 244, 0.03) 42%,
                rgba(255, 246, 236, 0.02) 62%, rgba(255, 255, 255, 0.05) 100%);
        backdrop-filter: blur(60px) saturate(170%) brightness(1.06);
        -webkit-backdrop-filter: blur(60px) saturate(170%) brightness(1.06);
        border: 1px solid rgba(255, 255, 255, 0.30);
        border-radius: clamp(24px, 2.4vw, 40px);
        box-shadow:
            0 32px 80px rgba(180, 130, 80, 0.13),
            0 12px 30px rgba(255, 175, 135, 0.07),
            inset 0 1.5px 0 rgba(255, 255, 255, 0.95),
            inset 0 -1.5px 0.5px rgba(255, 205, 175, 0.28),
            inset 0 0 70px rgba(255, 225, 200, 0.05);
    }
    .app.high-end::before {
        content: ''; position: absolute; inset: 0; border-radius: inherit;
        background:
            radial-gradient(ellipse 70% 30% at 22% 0%, rgba(255, 255, 255, 0.22), transparent 62%),
            radial-gradient(ellipse 50% 40% at 85% 100%, rgba(255, 190, 165, 0.09), transparent 68%),
            radial-gradient(ellipse 40% 20% at 60% 5%, rgba(255, 250, 240, 0.16), transparent 65%);
        pointer-events: none; z-index: 0; filter: blur(18px); opacity: 0.7;
        animation: liquidShift 24s ease-in-out infinite alternate;
    }
    .app.high-end::after {
        content: ''; position: absolute; inset: 0; border-radius: inherit; padding: 1px;
        background: conic-gradient(from 200deg at 50% 50%,
            rgba(255, 224, 196, 0.32), rgba(255, 190, 215, 0.18), rgba(200, 222, 255, 0.20),
            rgba(200, 255, 235, 0.14), rgba(255, 244, 196, 0.28), rgba(255, 224, 196, 0.32));
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        mask-composite: exclude;
        pointer-events: none; opacity: 0.45; z-index: 2; mix-blend-mode: screen;
    }
    @keyframes liquidShift {
        0% { transform: translate(0,0) scale(1); opacity: .7; }
        50% { transform: translate(1.2%,.8%) scale(1.02); opacity: .85; }
        100% { transform: translate(-.8%,1.2%) scale(1.01); opacity: .75; }
    }

    /* 高级渲染 · 面板玻璃 */
    .app.high-end .header {
        background: linear-gradient(180deg, rgba(255,255,255,.10) 0%, rgba(255,250,244,.03) 100%);
        border-bottom: 1px solid rgba(255,255,255,.20);
        backdrop-filter: blur(22px) saturate(160%);
        -webkit-backdrop-filter: blur(22px) saturate(160%);
        box-shadow: inset 0 1px 0 rgba(255,255,255,.70);
    }
    .app.high-end .settings {
        background: linear-gradient(180deg, rgba(255,255,255,.06) 0%, rgba(255,250,244,.02) 100%);
        border-bottom: 1px solid rgba(255,255,255,.16);
        backdrop-filter: blur(18px) saturate(155%);
        -webkit-backdrop-filter: blur(18px) saturate(155%);
        box-shadow: inset 0 1px 0 rgba(255,255,255,.50);
    }
    .app.high-end .info-bar,
    .app.high-end .chinese-hint,
    .app.high-end .status-badge,
    .app.high-end .card-pool,
    .app.high-end .answer-zone,
    .app.high-end .history-section {
        background: linear-gradient(152deg, rgba(255,255,255,.09) 0%, rgba(255,255,255,.03) 48%, rgba(255,250,242,.05) 100%);
        backdrop-filter: blur(26px) saturate(170%) brightness(1.06);
        -webkit-backdrop-filter: blur(26px) saturate(170%) brightness(1.06);
        border: 1px solid rgba(255,255,255,.26);
        box-shadow:
            inset 0 1.5px 0 rgba(255,255,255,.85),
            inset 0 -1px .5px rgba(255,205,175,.18),
            0 4px 14px rgba(180,130,80,.05);
    }
    .app.high-end .answer-zone {
        border-color: rgba(255,255,255,.32);
    }

    /* 高级渲染 · 大卡片柔光跟随 */
    .app.high-end .info-bar,
    .app.high-end .chinese-hint,
    .app.high-end .history-section,
    .app.high-end .card-pool,
    .app.high-end .answer-zone { position: relative; }
    .app.high-end .info-bar::after,
    .app.high-end .chinese-hint::after,
    .app.high-end .history-section::after,
    .app.high-end .card-pool::after,
    .app.high-end .answer-zone::after {
        content: ''; position: absolute; inset: 0; border-radius: inherit;
        background: radial-gradient(circle 200px at var(--cx,50%) var(--cy,50%),
            rgba(255,255,255,.13) 0%, rgba(255,245,232,.05) 42%, transparent 72%);
        opacity: var(--glow-op,0); transition: opacity .5s ease;
        pointer-events: none; mix-blend-mode: screen; z-index: 3;
    }

    /* 高级渲染 · 卡片（减弱立体感，跃然纸上） */
    .app.high-end .card-pool .token,
    .app.high-end .answer-zone .token {
        background: linear-gradient(142deg,
            rgba(255,255,255,.28) 0%, rgba(255,255,255,.12) 40%,
            rgba(255,248,238,.14) 68%, rgba(255,236,218,.20) 100%);
        backdrop-filter: blur(20px) saturate(185%) brightness(1.08);
        -webkit-backdrop-filter: blur(20px) saturate(185%) brightness(1.08);
        border: 1px solid rgba(255,255,255,.46);
        box-shadow:
            inset 0 1px 0 rgba(255,255,255,.96),
            inset 0 -1px 0.5px rgba(255,205,175,.18),
            0 4px 12px rgba(180,130,80,.10),
            0 1px 3px rgba(180,130,80,.06);
    }
    .app.high-end .card-pool .token.used {
        opacity: 0; transform: scale(.6) translateY(-24px) rotate(-6deg) !important;
    }

    /* 高级渲染 · 按钮玻璃 */
    .app.high-end .btn-glass {
        background: linear-gradient(150deg, rgba(255,255,255,.18) 0%, rgba(255,255,255,.06) 55%, rgba(255,248,240,.10) 100%);
        backdrop-filter: blur(16px) saturate(170%);
        -webkit-backdrop-filter: blur(16px) saturate(170%);
        border: 1px solid rgba(255,255,255,.42); color: #6a3f28;
        box-shadow: inset 0 1px 0 rgba(255,255,255,.80), 0 2px 8px rgba(180,130,80,.05);
    }
    .app.high-end .btn-glass:hover {
        background: linear-gradient(150deg, rgba(255,255,255,.28) 0%, rgba(255,250,244,.12) 100%);
        border-color: rgba(255,240,220,.68); transform: scale(1.04);
    }
    .app.high-end .btn-glass.on {
        background: linear-gradient(140deg, rgba(255,226,200,.46) 0%, rgba(255,200,165,.34) 50%, rgba(228,165,130,.40) 100%);
        border: 1px solid rgba(255,255,255,.55); color: #5a3020;
        box-shadow: inset 0 1px 0 rgba(255,255,255,.85), 0 3px 10px rgba(217,140,106,.14);
    }
    .app.high-end .action-row .btn-primary {
        background: linear-gradient(148deg, rgba(255,226,200,.56) 0%, rgba(252,200,165,.42) 50%, rgba(228,158,126,.50) 100%);
        backdrop-filter: blur(18px) saturate(180%);
        -webkit-backdrop-filter: blur(18px) saturate(180%);
        border: 1px solid rgba(255,255,255,.55); color: #fff;
        text-shadow: 0 1px 2px rgba(140,70,40,.20);
        box-shadow: inset 0 1px 0 rgba(255,255,255,.85), 0 4px 14px rgba(217,140,106,.18);
    }
    .app.high-end .action-row .btn-primary:hover:not(:disabled) {
        background: linear-gradient(148deg, rgba(255,236,216,.66) 0%, rgba(255,208,175,.50) 50%, rgba(238,172,140,.58) 100%);
        border-color: rgba(255,255,255,.72); transform: translateY(-2px);
        box-shadow: inset 0 1px 0 rgba(255,255,255,.95), 0 8px 22px rgba(217,140,106,.24);
    }
    .app.high-end .action-row .btn-primary:disabled { opacity: .42; }
    .app.high-end .action-row .btn-secondary {
        background: linear-gradient(150deg, rgba(255,255,255,.20) 0%, rgba(255,255,255,.07) 50%, rgba(255,246,236,.12) 100%);
        backdrop-filter: blur(18px) saturate(170%);
        -webkit-backdrop-filter: blur(18px) saturate(170%);
        border: 1px solid rgba(255,255,255,.44); color: #5a3a2a;
        box-shadow: inset 0 1px 0 rgba(255,255,255,.80), 0 3px 10px rgba(180,130,80,.05);
    }
    .app.high-end .action-row .btn-secondary:hover {
        background: linear-gradient(150deg, rgba(255,255,255,.32) 0%, rgba(255,250,244,.14) 100%);
        border-color: rgba(255,240,220,.70); transform: translateY(-2px);
    }
    .app.high-end .info-bar .actions button {
        background: linear-gradient(150deg, rgba(255,255,255,.18) 0%, rgba(255,255,255,.06) 100%);
        backdrop-filter: blur(14px) saturate(160%);
        -webkit-backdrop-filter: blur(14px) saturate(160%);
        border: 1px solid rgba(255,255,255,.40); color: #5a3a2a;
        box-shadow: inset 0 1px 0 rgba(255,255,255,.72);
    }
    .app.high-end .settings .unit-group .unit-check .unit-label {
        background: linear-gradient(150deg, rgba(255,255,255,.16) 0%, rgba(255,255,255,.05) 100%);
        backdrop-filter: blur(12px) saturate(160%);
        -webkit-backdrop-filter: blur(12px) saturate(160%);
        border: 1px solid rgba(255,255,255,.36); color: #5a3a2a;
        box-shadow: inset 0 1px 0 rgba(255,255,255,.65);
    }
    .app.high-end .history-list .h-item {
        background: linear-gradient(150deg, rgba(255,255,255,.14) 0%, rgba(255,255,255,.04) 100%);
        backdrop-filter: blur(10px) saturate(160%);
        -webkit-backdrop-filter: blur(10px) saturate(160%);
        border: 1px solid rgba(255,255,255,.32);
        box-shadow: inset 0 1px 0 rgba(255,255,255,.55);
    }

    /* ============ 头部 ============ */
    .header {
        padding: clamp(12px, 1.6vh, 22px) clamp(18px, 2vw, 32px);
        display: flex; flex-wrap: wrap; gap: 8px 16px;
        align-items: center; justify-content: space-between;
        background: #fff5eb;
        border-bottom: 1px solid rgba(220, 180, 140, 0.28);
        position: relative; z-index: 1;
    }
    .logo {
        font-size: clamp(1.05rem, 0.6vw + 0.85rem, 1.5rem);
        font-weight: 800; color: #7a4a2a;
        display: flex; align-items: center; gap: 6px;
    }
    .logo span {
        background: linear-gradient(135deg, #f7b88a, #d98c6a);
        color: #fff; font-size: clamp(0.5rem, 0.2vw + 0.45rem, 0.65rem);
        padding: 2px 12px; border-radius: 30px; font-weight: 700;
    }
    .header-actions { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
    .btn-glass {
        background: #fffaf3; border: 1px solid rgba(220, 180, 140, 0.40);
        border-radius: 20px;
        padding: clamp(4px, 0.6vh, 7px) clamp(10px, 1vw, 16px);
        font-size: clamp(0.8rem, 0.3vw + 0.7rem, 1rem);
        cursor: pointer; transition: background 0.18s ease, border-color 0.18s ease, transform 0.15s ease;
        font-family: inherit; color: #7a4a2a; position: relative; z-index: 1;
    }
    .btn-glass:hover { background: #fff5eb; border-color: #f7b88a; transform: scale(1.03); }
    .btn-glass.on {
        background: linear-gradient(135deg, #ffc8a0, #f0a078);
        border-color: rgba(255, 200, 160, 0.9); color: #5a3020;
    }
    .btn-icon { min-width: 36px; text-align: center; padding: 6px 10px; }

    /* ============ 设置栏 ============ */
    .settings {
        padding: clamp(8px, 1.2vh, 14px) clamp(16px, 1.8vw, 26px);
        display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center;
        background: #fff8f0;
        border-bottom: 1px solid rgba(220, 180, 140, 0.22);
        position: relative; z-index: 1;
    }
    .settings .group { display: flex; align-items: center; gap: 4px 8px; flex-wrap: wrap; }
    .settings .group label {
        font-size: clamp(0.55rem, 0.15vw + 0.5rem, 0.7rem);
        text-transform: uppercase; letter-spacing: 0.5px;
        font-weight: 700; color: #8a6a4a;
    }
    .settings .unit-group { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
    .settings .unit-group .unit-check {
        display: flex; align-items: center; gap: 3px;
        font-size: clamp(0.65rem, 0.15vw + 0.6rem, 0.8rem);
        font-weight: 600; color: #5a3a2a; cursor: pointer;
    }
    .settings .unit-group .unit-check input[type="checkbox"] {
        width: 14px; height: 14px; accent-color: #d98c6a; cursor: pointer;
    }
    .settings .unit-group .unit-check .unit-label {
        background: #fffaf3; padding: 0 8px; border-radius: 20px;
        border: 1px solid rgba(220, 180, 140, 0.25);
        transition: background 0.15s ease;
    }
    .settings .switch {
        display: flex; align-items: center; gap: 6px;
        font-size: clamp(0.65rem, 0.15vw + 0.6rem, 0.8rem);
        font-weight: 600; color: #5a3a2a; cursor: pointer;
    }
    .settings .switch input { width: 36px; height: 18px; accent-color: #d98c6a; cursor: pointer; }

    .main { padding: clamp(12px, 2vh, 24px) clamp(18px, 2vw, 32px) clamp(16px, 2.4vh, 28px); position: relative; z-index: 1; }

    .info-bar {
        display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
        gap: 8px 16px; padding: clamp(5px, 0.7vh, 9px) clamp(12px, 1.4vw, 20px);
        background: #fff5eb; border-radius: 16px;
        border: 1px solid rgba(220, 180, 140, 0.28);
        margin-bottom: clamp(10px, 1.4vh, 16px);
    }
    .info-bar .item {
        display: flex; align-items: center; gap: 6px; font-weight: 600;
        font-size: clamp(0.75rem, 0.2vw + 0.7rem, 0.9rem); color: #5a3a2a;
    }
    .info-bar .item .num {
        background: rgba(247, 184, 138, 0.2); padding: 2px 14px;
        border-radius: 30px; font-weight: 700; color: #7a4a2a;
    }
    .info-bar .item .score-num {
        background: linear-gradient(135deg, #ffb88a, #e08a6a);
        color: #fff; padding: 2px 16px; border-radius: 30px; font-weight: 700;
    }
    .info-bar .actions button {
        background: #fffaf3; border: 1px solid rgba(220, 180, 140, 0.30);
        border-radius: 20px; padding: 4px 14px;
        font-size: clamp(0.65rem, 0.15vw + 0.6rem, 0.8rem);
        font-weight: 700; color: #5a3a2a;
        cursor: pointer; transition: background 0.15s ease, border-color 0.15s ease; font-family: inherit;
    }
    .info-bar .actions button:hover { background: #fff5eb; border-color: #f7b88a; }

    .chinese-hint {
        font-size: clamp(1.05rem, 0.4vw + 0.9rem, 1.4rem);
        font-weight: 700; color: #4a2a1a; text-align: center;
        padding: clamp(8px, 1.2vh, 14px) clamp(10px, 1.2vw, 16px);
        background: #fff5eb; border-radius: 16px;
        border: 1px solid rgba(220, 180, 140, 0.28);
        margin-bottom: clamp(8px, 1.2vh, 14px); min-height: clamp(44px, 5vh, 58px);
        display: flex; align-items: center; justify-content: center;
        gap: 8px; flex-wrap: wrap;
    }
    .chinese-hint .label {
        font-size: clamp(0.55rem, 0.15vw + 0.5rem, 0.7rem);
        text-transform: uppercase; letter-spacing: 0.5px;
        color: #8a6a4a; background: rgba(247, 184, 138, 0.15);
        padding: 0 12px; border-radius: 20px;
    }
    .chinese-hint .zh { font-size: clamp(1.15rem, 0.5vw + 0.95rem, 1.55rem); }
    .pattern-badge {
        font-size: clamp(0.6rem, 0.15vw + 0.55rem, 0.75rem);
        background: rgba(217, 140, 106, 0.15); padding: 2px 16px;
        border-radius: 30px; color: #7a4a2a; font-weight: 600;
        display: inline-block; margin-top: 2px;
    }

    .status-badge {
        display: block; padding: clamp(5px, 0.7vh, 9px) 18px; border-radius: 16px;
        font-weight: 700; font-size: clamp(0.75rem, 0.2vw + 0.7rem, 0.95rem);
        background: #fff8f0; color: #5a3a2a;
        border: 1px solid rgba(220, 180, 140, 0.22);
        margin-bottom: clamp(10px, 1.4vh, 16px); text-align: center;
        min-height: 38px; line-height: 1.6;
    }
    .status-badge.correct { background: #fce4d6; color: #7a4a2a; border-color: #e08a6a; }
    .status-badge.wrong { background: #fce4d6; color: #b05a4a; border-color: #d98c6a; }
    .status-badge.done { background: #fde9d0; border-color: #f7b88a; }

    .card-pool {
        display: flex; flex-wrap: wrap; gap: clamp(6px, 0.8vw, 10px);
        justify-content: center;
        padding: clamp(10px, 1.4vh, 16px) clamp(6px, 0.8vw, 12px);
        min-height: clamp(60px, 8vh, 86px);
        background: #fff8f0; border-radius: 16px;
        border: 2px dashed rgba(220, 180, 140, 0.35);
        margin-bottom: clamp(10px, 1.4vh, 16px);
        position: relative;
    }
    .card-pool .token {
        padding: clamp(5px, 0.8vh, 9px) clamp(14px, 1.5vw, 22px);
        border-radius: 24px; font-weight: 700;
        font-size: clamp(0.9rem, 0.3vw + 0.8rem, 1.15rem);
        color: #4a2a1a; background: #fffdf8;
        border: 1.5px solid rgba(220, 180, 140, 0.40);
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.15s ease,
            background 0.15s ease, border-color 0.15s ease, opacity 0.18s ease;
        user-select: none; -webkit-user-select: none;
        box-shadow: 0 1px 3px rgba(180, 130, 80, 0.06);
        position: relative; touch-action: manipulation;
    }
    .card-pool .token:hover:not(.used) {
        transform: translateY(-2px);
        border-color: #d98c6a; background: #fff9f0;
        box-shadow: 0 4px 10px rgba(217, 140, 106, 0.12);
    }
    .card-pool .token:active:not(.used) { transform: scale(0.97); }
    .card-pool .token.used {
        opacity: 0; transform: scale(0.95); pointer-events: none;
        transition: opacity 0.18s ease, transform 0.18s ease;
    }

    .answer-zone {
        display: flex; flex-wrap: wrap; gap: clamp(6px, 0.8vw, 10px);
        justify-content: center; align-items: center;
        min-height: clamp(56px, 7.5vh, 78px);
        padding: clamp(9px, 1.3vh, 15px) clamp(10px, 1.2vw, 16px);
        background: #fff5eb; border-radius: 16px;
        border: 2px solid rgba(220, 180, 140, 0.25);
        margin-bottom: clamp(10px, 1.4vh, 16px);
        position: relative; touch-action: none;
    }
    .answer-zone .placeholder {
        color: #b08a7a; font-weight: 600;
        font-size: clamp(0.75rem, 0.2vw + 0.7rem, 0.95rem);
        opacity: 0.6;
    }
    .answer-zone .token {
        padding: clamp(5px, 0.8vh, 9px) clamp(14px, 1.5vw, 22px);
        border-radius: 24px; font-weight: 700;
        font-size: clamp(0.9rem, 0.3vw + 0.8rem, 1.15rem);
        color: #4a2a1a; background: #fffdf8;
        border: 1.5px solid rgba(220, 180, 140, 0.40);
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.15s ease,
            background 0.15s ease, border-color 0.15s ease;
        user-select: none; -webkit-user-select: none;
        position: relative; touch-action: none;
        will-change: transform;
    }
    .answer-zone .token:hover {
        border-color: #d98c6a; background: #fff9f0;
        box-shadow: 0 4px 10px rgba(217, 140, 106, 0.10);
    }
    .answer-zone .token:active { cursor: grabbing; }
    .answer-zone .token .order {
        position: absolute; top: -8px; left: -8px;
        background: #f7b88a; color: #fff;
        font-size: 0.5rem; width: 20px; height: 20px;
        border-radius: 50%; display: flex; align-items: center; justify-content: center;
        font-weight: 800; pointer-events: none;
    }

    .action-row {
        display: flex; flex-wrap: wrap; gap: clamp(8px, 1vw, 12px);
        justify-content: center;
        margin-top: 4px; margin-bottom: clamp(6px, 1vh, 12px);
    }
    .action-row .btn {
        padding: clamp(7px, 1vh, 11px) clamp(20px, 2vw, 32px);
        border-radius: 24px; font-weight: 700;
        font-size: clamp(0.8rem, 0.25vw + 0.72rem, 1rem);
        border: none; cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
        font-family: inherit; display: inline-flex; align-items: center; gap: 6px;
    }

    const Sound = {
        ctx: null,
        init() {
            if (!this.ctx) {
                try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { return; }
            }
            if (this.ctx.state === 'suspended') this.ctx.resume();
        },
        play(freq, dur = 0.08, vol = 0.2, type = 'sine') {
            if (!this.ctx) return;
            try {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(this.ctx.currentTime);
                osc.stop(this.ctx.currentTime + dur);
            } catch(e) {}
        },
        click() { this.play(660, 0.05, 0.08); setTimeout(()=>this.play(880,0.04,0.06), 30); },
        correct() { this.play(880, 0.1, 0.2); setTimeout(() => this.play(1108, 0.12, 0.2), 90); },
        wrong() { this.play(280, 0.2, 0.12, 'sawtooth'); },
        done() { [523, 659, 784, 1047].forEach((f,i) => setTimeout(() => this.play(f, 0.15, 0.15), i*100)); },
        shuffle() { this.play(440, 0.06, 0.1); setTimeout(() => this.play(554, 0.06, 0.1), 70); },
        remove() { this.play(420, 0.05, 0.08); setTimeout(()=>this.play(300,0.05,0.06),50); },
        start() { this.play(660, 0.06, 0.1); setTimeout(() => this.play(880, 0.06, 0.1), 70); },

    // ================================================================
    //  5. 工具函数
    // ================================================================
    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }
    function tokenize(sentence) {
        const tokens = sentence.match(/[A-Za-z']+|[.,!?;:]/g);
        return tokens ? tokens.map(t => t.toLowerCase()) : [];
    }
    function getDistractors(exclude, count = 4) {
        const pool = OLD_WORDS.filter(w => !exclude.includes(w));
        if (pool.length === 0) return [];
        return shuffleArray([...pool]).slice(0, count);
    }
    function capitalizeFirst(word) {
        if (!word) return word;
        if (/[a-z]/.test(word[0])) return word[0].toUpperCase() + word.slice(1);
        return word;
    }
    function getBe(num) { return num === 'p' ? 'are' : 'is'; }
    function ease() {
        return state.highEnd
            ? 'cubic-bezier(0.34, 1.56, 0.64, 1)'
            : 'cubic-bezier(0.4, 0, 0.2, 1)';
    }

    function filterSlotByUnits(arr) {
        return arr.filter(item =>
            !item.src || item.src.some(u => state.selectedUnits.has(u))
        );
    }

    // ================================================================
    //  6. 生成题目
    // ================================================================
    function generateQuestion() {
        let pool = [];
        for (const unit of state.selectedUnits) {
            const data = TEMPLATES_DATA[unit];
            if (data) pool = pool.concat(data.templates.map(t => ({ ...t, unitDesc: data.desc })));
        }
        if (pool.length === 0) return null;

        for (let attempt = 0; attempt < 30; attempt++) {
            const template = pool[Math.floor(Math.random() * pool.length)];
            const slotKeys = Object.keys(template.slots);
            const chosen = {};
            let valid = true;

            for (const key of slotKeys) {
                if (key === 'be') continue;
                const arr = template.slots[key];
                const filtered = filterSlotByUnits(arr);
                if (filtered.length === 0) { valid = false; break; }
                chosen[key] = filtered[Math.floor(Math.random() * filtered.length)];
            }
            if (!valid) continue;

            let subjectNum = 's';
            for (const key of slotKeys) {
                if (key === 'be') continue;
                const item = chosen[key];
                if (item && item.num) { subjectNum = item.num; break; }
            }

            let en = template.en, zh = template.zh;
            for (const key of slotKeys) {
                if (key === 'be') continue;
                const val = chosen[key];
                let enVal = val.en, zhVal = val.zh;
                if (key === '职业') {
                    if (subjectNum === 'p') { enVal = val.plural; zhVal = val.zh; }
                    else {
                        if (template.en.includes('a {职业}')) { enVal = val.en; zhVal = val.zh; }
                        else { enVal = `a ${val.en}`; zhVal = `一位${val.zh}`; }
                    }
                }
                if (key === '动作') {
                    enVal = (subjectNum === 'p') ? val.base : val.en;
                }
                en = en.replace(`{${key}}`, enVal);
                zh = zh.replace(`{${key}}`, zhVal);
            }
            if (en.includes('{be}')) en = en.replace(/{be}/g, getBe(subjectNum));
            en = en.replace(/\ba a \b/g, 'a ');
            en = en.replace(/\ba an \b/g, 'an ');
            if (!en.endsWith('.') && !en.endsWith('?') && !en.endsWith('!')) en += '.';
            if (!zh.endsWith('。') && !zh.endsWith('？') && !zh.endsWith('！')) zh += '。';
            return {
                en, zh,
                patternDesc: template.unitDesc,
                templateEn: template.en,
                correctWords: tokenize(en),
            };
        }
        return null;
    }

    // ================================================================
    //  7. 卡片倾斜（仅在高级渲染时启用，且减弱幅度）
    // ================================================================
    function applyTilt(el) {
        if (!state.highEnd) return;
        if (el.dataset.tiltBound === '1') return;
        el.dataset.tiltBound = '1';

        let rafId = null, hovering = false;
        let tRX = 0, tRY = 0, tLift = 0;
        let cRX = 0, cRY = 0, cLift = 0;

        // 减弱后的参数
        const PERSPECTIVE = 1000;
        const ROT_RANGE = 12;   // 原 28，减半以上
        const LIFT = 14;        // 原 30

        function tick() {
            cRX += (tRX - cRX) * 0.18;
            cRY += (tRY - cRY) * 0.18;
            cLift += (tLift - cLift) * 0.18;
            const settled = !hovering &&
                Math.abs(tRX - cRX) < 0.04 &&
                Math.abs(tRY - cRY) < 0.04 &&
                Math.abs(tLift - cLift) < 0.12;
            if (settled) {
                el.style.transform = ''; el.style.zIndex = ''; rafId = null; return;
            }
            const scale = 1 + cLift * 0.006;
            el.style.transform =
                `perspective(${PERSPECTIVE}px) rotateX(${cRX.toFixed(2)}deg) ` +
                `rotateY(${cRY.toFixed(2)}deg) translateZ(${cLift.toFixed(2)}px) scale(${scale.toFixed(3)})`;
            rafId = requestAnimationFrame(tick);
        }
        function kick() { if (rafId === null) rafId = requestAnimationFrame(tick); }

        el.addEventListener('pointermove', (e) => {
            if (isDragging) return;
            if (e.pointerType === 'mouse' && e.buttons !== 0) return;
            const r = el.getBoundingClientRect();
            if (!r.width || !r.height) return;
            const px = (e.clientX - r.left) / r.width;
            const py = (e.clientY - r.top) / r.height;
            tRY = (px - 0.5) * ROT_RANGE;
            tRX = -(py - 0.5) * ROT_RANGE;
            tLift = LIFT; hovering = true; el.style.zIndex = '6'; kick();
        });
        el.addEventListener('pointerleave', () => {
            if (isDragging) return;
            hovering = false; tRX = 0; tRY = 0; tLift = 0; kick();
        });
        el.addEventListener('pointerdown', (e) => {
            if (isDragging) return;
            const r = el.getBoundingClientRect();
            if (!r.width || !r.height) return;
            const px = (e.clientX - r.left) / r.width;
            const py = (e.clientY - r.top) / r.height;
            cRX = -(py - 0.5) * 8; cRY = (px - 0.5) * 8; cLift = 12;
            if (!hovering) { tRX = 0; tRY = 0; tLift = 0; }
            kick();
        });
    }

    // ================================================================
    //  7b. 整个面板 3D 倾斜（仅高级渲染，减弱幅度）
    // ================================================================
    let panelTiltSetup = false;
    function setupPanelTilt() {
        if (panelTiltSetup) return;
        panelTiltSetup = true;
        let rafId = null, hovering = false;
        let tRX = 0, tRY = 0, cRX = 0, cRY = 0;
        const ROT_X_RANGE = 3.5;
        const ROT_Y_RANGE = 4.5;

        function tick() {
            cRX += (tRX - cRX) * 0.14;
            cRY += (tRY - cRY) * 0.14;
            const settled = !hovering &&
                Math.abs(tRX - cRX) < 0.02 && Math.abs(tRY - cRY) < 0.02;
            if (settled) { appEl.style.transform = ''; rafId = null; return; }
            appEl.style.transform =
                `rotateX(${cRX.toFixed(2)}deg) rotateY(${cRY.toFixed(2)}deg)`;
            rafId = requestAnimationFrame(tick);
        }
        function kick() { if (rafId === null) rafId = requestAnimationFrame(tick); }

        document.addEventListener('pointermove', (e) => {
            if (!state.highEnd) return;
            if (e.pointerType === 'touch') return;
            const vw = window.innerWidth, vh = window.innerHeight;
            tRY = (e.clientX / vw - 0.5) * ROT_Y_RANGE;
            tRX = -(e.clientY / vh - 0.5) * ROT_X_RANGE;
            hovering = true; kick();
        }, { passive: true });
        document.addEventListener('pointerleave', () => {
            if (!state.highEnd) return;
            hovering = false; tRX = 0; tRY = 0; kick();
        });
    }
    function resetPanelTilt() { appEl.style.transform = ''; }

    // ================================================================
    //  7c. 大卡片柔光跟随（仅高级渲染）
    // ================================================================
    const GLOW_SELECTOR = '.info-bar, .chinese-hint, .history-section, .card-pool, .answer-zone';
    let glowTargets = null, glowRaf = null, glowPointer = null;

    function getGlowTargets() {
        if (!glowTargets || !glowTargets[0] || !glowTargets[0].isConnected) {
            glowTargets = [...document.querySelectorAll(GLOW_SELECTOR)];
        }
        return glowTargets;
    }
    function setupBigCardGlow() {
        document.addEventListener('pointermove', (e) => {
            if (!state.highEnd) return;
            glowPointer = { x: e.clientX, y: e.clientY };
            if (glowRaf !== null) return;
            glowRaf = requestAnimationFrame(() => {
                glowRaf = null;
                if (!state.highEnd || !glowPointer) return;
                const { x, y } = glowPointer;
                getGlowTargets().forEach(el => {
                    const r = el.getBoundingClientRect();
                    if (!r.width || !r.height) return;
                    const px = (x - r.left) / r.width;
                    const py = (y - r.top) / r.height;
                    if (px < -0.12 || px > 1.12 || py < -0.12 || py > 1.12) {
                        if (el.dataset.glowOp !== '0') {
                            el.dataset.glowOp = '0';
                            el.style.setProperty('--glow-op', '0');
                        }
                        return;
                    }
                    el.style.setProperty('--cx', (px * 100).toFixed(1) + '%');
                    el.style.setProperty('--cy', (py * 100).toFixed(1) + '%');
                    if (el.dataset.glowOp !== '1') {
                        el.dataset.glowOp = '1';
                        el.style.setProperty('--glow-op', '1');
                    }
                });
            });
        }, { passive: true });
        document.addEventListener('pointerleave', () => {
            if (!state.highEnd) return;
            getGlowTargets().forEach(el => {
                el.dataset.glowOp = '0';
                el.style.setProperty('--glow-op', '0');
            });
        });
    }

    // ================================================================
    function renderCardPool() {
        const oldRects = new Map();
        cardPool.querySelectorAll('.token').forEach(el => {
            const key = el.dataset.poolIdx;
            if (key !== undefined) oldRects.set(key, el.getBoundingClientRect());
        });
        cardPool.innerHTML = '';
        state.shuffledWords.forEach((word, idx) => {
            const div = document.createElement('div');
            div.className = 'token';
            div.dataset.poolIdx = idx;
            div.textContent = word;
            if (state.usedIndices.includes(idx)) {
                div.classList.add('used');
            } else {
                div.addEventListener('click', () => addToAnswer(idx, word, div));
                if (state.highEnd) applyTilt(div);
            }
            cardPool.appendChild(div);
        });
        requestAnimationFrame(() => {
            cardPool.querySelectorAll('.token').forEach(el => {
                const key = el.dataset.poolIdx;
                const oldRect = oldRects.get(key);
                if (!oldRect) return;
                const newRect = el.getBoundingClientRect();
                const dx = oldRect.left - newRect.left;
                const dy = oldRect.top - newRect.top;
                if (Math.abs(dx) > 0.5 || Math.abs(dy) > 0.5) {
                    if (state.highEnd) {
                        el.animate([
                            { transform: `translate(${dx}px, ${dy}px) scale(0.97)` },
                            { transform: `translate(${dx*0.3}px, ${dy*0.3}px) scale(1.02)`, offset: 0.65 },
                            { transform: 'translate(0, 0) scale(1)' }
                        ], { duration: 320, easing: ease() });
                    } else {
                        // 扁平模式：直接过渡，无重绘
                        el.animate([
                            { transform: `translate(${dx}px, ${dy}px)` },
                            { transform: 'translate(0, 0)' }
                        ], { duration: 140, easing: 'ease-out' });
                    }
                }
            });
        });
    }

    // ================================================================
    //  9. 渲染答案区
    // ================================================================
    function renderAnswerZone(opts = {}) {
        const { sourceRect = null, newItemId = null } = opts;
        const oldRects = new Map();
        answerZone.querySelectorAll('.token[data-id]').forEach(el => {
            oldRects.set(parseInt(el.dataset.id), el.getBoundingClientRect());
        });

        answerZone.innerHTML = '';
        if (state.answerItems.length === 0) {
            answerZone.innerHTML = `<span class="placeholder">👆 点击下方单词添加到此处</span>`;
            return;
        }

        state.answerItems.forEach((item, idx) => {
            const div = document.createElement('div');
            div.className = 'token';
            div.dataset.id = item.id;
            let display = item.word;
            if (idx === 0 && /[a-z]/.test(item.word[0])) display = capitalizeFirst(item.word);
            div.textContent = display;
            const orderSpan = document.createElement('span');
            orderSpan.className = 'order';
            orderSpan.textContent = idx + 1;
            div.appendChild(orderSpan);
            if (dragState && dragState.itemId === item.id) {
                div.style.visibility = 'hidden';
            } else {
                attachAnswerToken(div, item.id);
                if (state.highEnd) applyTilt(div);
            }
            answerZone.appendChild(div);
        });

        requestAnimationFrame(() => {
            const tokens = [...answerZone.querySelectorAll('.token[data-id]')];
            tokens.forEach((el) => {
                const id = parseInt(el.dataset.id);
                const newRect = el.getBoundingClientRect();
                if (id === newItemId && sourceRect) {
                    const dx = sourceRect.left - newRect.left;
                    const dy = sourceRect.top - newRect.top;
                    if (state.highEnd) {
                        el.animate([
                            { transform: `translate(${dx}px, ${dy}px) scale(0.75) rotate(-8deg)`, opacity: 0.3, offset: 0 },
                            { transform: `translate(${dx*0.55}px, ${dy*0.55 - 10}px) scale(1.10) rotate(4deg)`, opacity: 1, offset: 0.55 },
                            { transform: `translate(${dx*0.15}px, ${dy*0.15 + 3}px) scale(0.96) rotate(-2deg)`, opacity: 1, offset: 0.82 },
                            { transform: 'translate(0, 0) scale(1) rotate(0deg)', opacity: 1, offset: 1 }
                        ], { duration: 420, easing: 'cubic-bezier(0.34, 1.56, 0.64, 1)', fill: 'backwards' });
                    } else {
                        // 扁平模式：简单淡入
                        el.animate([
                            { transform: `translate(${dx}px, ${dy}px) scale(0.94)`, opacity: 0.4, offset: 0 },
                            { transform: 'translate(0, 0) scale(1)', opacity: 1, offset: 1 }
                        ], { duration: 200, easing: 'ease-out', fill: 'backwards' });
                    }
                    return;
                }
                const oldRect = oldRects.get(id);
                if (oldRect) {
                    const dx = oldRect.left - newRect.left;
                    const dy = oldRect.top - newRect.top;
                    if (Math.abs(dx) > 0.5 || Math.abs(dy) > 0.5) {
                        if (state.highEnd) {
                            const horiz = Math.abs(dx) >= Math.abs(dy);
                            const sx0 = horiz ? 0.88 : 1;
                            const sy0 = horiz ? 1 : 0.88;
                            const sx1 = horiz ? 1.05 : 1;
                            const sy1 = horiz ? 1 : 1.05;
                            el.animate([
                                { transform: `translate(${dx}px, ${dy}px) scale(${sx0}, ${sy0})` },
                                { transform: `translate(${dx*0.36}px, ${dy*0.36}px) scale(${sx1}, ${sy1})`, offset: 0.6 },
                                { transform: `translate(${dx*0.09}px, ${dy*0.09}px) scale(0.99, 0.99)`, offset: 0.84 },
                                { transform: 'translate(0, 0) scale(1, 1)' }
                            ], { duration: 340, easing: 'cubic-bezier(0.34, 1.56, 0.64, 1)', fill: 'backwards' });
                        } else {
                            el.animate([
                                { transform: `translate(${dx}px, ${dy}px)` },
                                { transform: 'translate(0, 0)' }
                            ], { duration: 140, easing: 'ease-out', fill: 'backwards' });
                        }
                    }
                } else {
                    el.animate([
                        { transform: 'scale(0.9)', opacity: 0 },
                        { transform: 'scale(1)', opacity: 1 }
                    ], { duration: state.highEnd ? 300 : 160, easing: ease(), fill: 'backwards' });
                }
            });
        });
    }

    // ================================================================
    //  10. 添加 / 移除 / 换位
    // ================================================================
    function addToAnswer(poolIndex, word, sourceEl) {
        if (state.isAnswered) return;
        if (state.usedIndices.includes(poolIndex)) return;
        const sourceRect = sourceEl ? sourceEl.getBoundingClientRect() : null;
        const newId = ++nextItemId;
        state.answerItems.push({ id: newId, word, poolIndex });
        state.usedIndices.push(poolIndex);
        Sound.click();
        renderCardPool();
        renderAnswerZone({ sourceRect, newItemId: newId });
    }
    function removeFromAnswer(itemId) {
        if (state.isAnswered) return;
        const idx = state.answerItems.findIndex(it => it.id === itemId);
        if (idx === -1) return;
        const item = state.answerItems[idx];
        state.answerItems.splice(idx, 1);
        const ui = state.usedIndices.indexOf(item.poolIndex);
        if (ui !== -1) state.usedIndices.splice(ui, 1);
        Sound.remove();
        renderCardPool();
        renderAnswerZone();
    }
    function reorderItems(draggingId, beforeId) {
        const curIdx = state.answerItems.findIndex(it => it.id === draggingId);
        if (curIdx === -1) return false;
        const [item] = state.answerItems.splice(curIdx, 1);
        let insertIdx;
        if (beforeId === null) insertIdx = state.answerItems.length;
        else {
            insertIdx = state.answerItems.findIndex(it => it.id === beforeId);
            if (insertIdx === -1) insertIdx = state.answerItems.length;
        }
        state.answerItems.splice(insertIdx, 0, item);
        return true;
    }

    // ================================================================
    //  11. 拖动
    // ================================================================
    function getInsertBeforeId(clientX, draggingId) {
        const tokens = [...answerZone.querySelectorAll('.token[data-id]')];
        for (const el of tokens) {
            const id = parseInt(el.dataset.id);
            if (id === draggingId) continue;
            const rect = el.getBoundingClientRect();
            if (clientX < rect.left + rect.width / 2) return id;
        }
        return null;
    }
    function startRealDrag(itemId, offsetX, offsetY, pointerX, pointerY) {
        const origEl = answerZone.querySelector(`.token[data-id="${itemId}"]`);
        if (!origEl) return;
        const rect = origEl.getBoundingClientRect();
        const ghost = origEl.cloneNode(true);
        ghost.style.cssText = `
            position: fixed; left: ${rect.left}px; top: ${rect.top}px;
            width: ${rect.width}px; height: ${rect.height}px;
            pointer-events: none; z-index: 10000; margin: 0;
            transform: rotate(-2deg) scale(1.06);
            box-shadow: 0 12px 30px rgba(217, 140, 106, 0.28), 0 4px 10px rgba(217, 140, 106, 0.15);
            transition: none; opacity: 0.96;
            border-radius: 24px;
        `;
        if (state.highEnd) {
            ghost.style.background = 'linear-gradient(140deg, rgba(255,255,255,0.55) 0%, rgba(255,240,225,0.32) 100%)';
            ghost.style.backdropFilter = 'blur(20px) saturate(180%)';
            ghost.style.webkitBackdropFilter = 'blur(20px) saturate(180%)';
            ghost.style.border = '1px solid rgba(255,255,255,0.75)';
        } else {
            ghost.style.background = '#fffdf8';
            ghost.style.border = '1.5px solid rgba(220, 180, 140, 0.45)';
        }
        document.body.appendChild(ghost);
        origEl.style.visibility = 'hidden';
        const curIdx = state.answerItems.findIndex(it => it.id === itemId);
        const nextItem = state.answerItems[curIdx + 1];
        dragState = { itemId, ghost, offsetX, offsetY, targetBeforeId: nextItem ? nextItem.id : null };
        updateRealDrag(pointerX, pointerY);
    }
    function updateRealDrag(pointerX, pointerY) {
        if (!dragState) return;
        dragState.ghost.style.left = (pointerX - dragState.offsetX) + 'px';
        dragState.ghost.style.top = (pointerY - dragState.offsetY) + 'px';
        const beforeId = getInsertBeforeId(pointerX, dragState.itemId);
        if (beforeId !== dragState.targetBeforeId) {
            dragState.targetBeforeId = beforeId;
            reorderItems(dragState.itemId, beforeId);
            Sound.drop();
            renderAnswerZone();
        }
    }
    function endRealDrag(clientX, clientY) {
        if (!dragState) return;
        const { itemId, ghost } = dragState;
        ghost.remove();
        const azRect = answerZone.getBoundingClientRect();
        const inside = clientX >= azRect.left - 30 && clientX <= azRect.right + 30 &&
                       clientY >= azRect.top - 30 && clientY <= azRect.bottom + 30;
        dragState = null;
        if (!inside) {
            const idx = state.answerItems.findIndex(it => it.id === itemId);
            if (idx !== -1) {
                const item = state.answerItems[idx];
                state.answerItems.splice(idx, 1);
                const ui = state.usedIndices.indexOf(item.poolIndex);
                if (ui !== -1) state.usedIndices.splice(ui, 1);
                Sound.remove();
                renderCardPool();
            }
        }
        renderAnswerZone();
    }
    function attachAnswerToken(el, itemId) {
        el.addEventListener('pointerdown', (e) => {
            if (state.isAnswered || dragState || isDragging) return;
            if (e.pointerType === 'mouse' && e.button !== 0) return;
            const pid = e.pointerId;
            const startX = e.clientX, startY = e.clientY;
            const rect = el.getBoundingClientRect();
            const offsetX = e.clientX - rect.left;
            const offsetY = e.clientY - rect.top;
            let didDrag = false;
            const onMove = (ev) => {
                if (ev.pointerId !== pid) return;
                const dx = ev.clientX - startX, dy = ev.clientY - startY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (!didDrag && dist > 8) {
                    didDrag = true; isDragging = true;
                    startRealDrag(itemId, offsetX, offsetY, ev.clientX, ev.clientY);
                }
                if (didDrag) updateRealDrag(ev.clientX, ev.clientY);
            };
            const onEnd = (ev) => {
                if (ev.pointerId !== pid) return;
                document.removeEventListener('pointermove', onMove);
                document.removeEventListener('pointerup', onEnd);
                document.removeEventListener('pointercancel', onEnd);
                if (didDrag) endRealDrag(ev.clientX, ev.clientY);
                else removeFromAnswer(itemId);
                isDragging = false;
            };
            document.addEventListener('pointermove', onMove);
            document.addEventListener('pointerup', onEnd);
            document.addEventListener('pointercancel', onEnd);
        });
    }

    // ================================================================
    //  12. 游戏逻辑
    // ================================================================
    function loadQuestion() {
        if (autoNextTimer) { clearTimeout(autoNextTimer); autoNextTimer = null; }
        state.retryMode = false;
        if (state.selectedUnits.size === 0) {
            document.querySelectorAll('#unitCheckGroup input[type="checkbox"]:not(#unit-all)').forEach(cb => cb.checked = true);
            document.getElementById('unit-all').checked = true;
            state.selectedUnits.clear();
            document.querySelectorAll('#unitCheckGroup input[type="checkbox"]:not(#unit-all)').forEach(cb => {
                if (cb.checked) state.selectedUnits.add(cb.value);
            });
        }
        const q = generateQuestion();
        if (!q) {
            statusBadge.textContent = '⚠️ 没有可用的句型模板';
            statusBadge.className = 'status-badge';
            return;
        }
        state.currentEn = q.en;
        state.currentZh = q.zh;
        state.correctWords = q.correctWords;
        chineseHint.textContent = q.zh;
        patternBadge.textContent = `📐 句型：${q.templateEn}`;

        let distractors = [];
        if (state.moreOldWords) {
            const exclude = new Set(q.correctWords);
            distractors = getDistractors([...exclude], 4);
        }
        let allWords = q.correctWords.slice();
        distractors.forEach(d => allWords.push(d));
        state.shuffledWords = shuffleArray(allWords);
        state.answerItems = [];
        state.usedIndices = [];
        state.isAnswered = false;
        checkBtn.disabled = false;
        nextBtn.disabled = true;
        renderCardPool();
        renderAnswerZone();
        statusBadge.textContent = '🔄 点击下方单词添加到句子，拖动可换位';
        statusBadge.className = 'status-badge';
        progress.textContent = `${state.currentIndex+1}/${state.totalQuestions}`;
        updateScore();
    }

    function loadHistoricalQuestion(item) {
        if (autoNextTimer) { clearTimeout(autoNextTimer); autoNextTimer = null; }
        state.retryMode = true;
        state.currentEn = item.en;
        state.currentZh = item.zh;
        state.correctWords = tokenize(item.en);
        chineseHint.textContent = item.zh;
        patternBadge.textContent = `📖 复习旧句子（不重复计分）`;

        let allWords = state.correctWords.slice();
        if (state.moreOldWords) {
            const exclude = new Set(state.correctWords);
            const distractors = getDistractors([...exclude], 4);
            distractors.forEach(d => allWords.push(d));
        }
        state.shuffledWords = shuffleArray(allWords);
        state.answerItems = [];
        state.usedIndices = [];
        state.isAnswered = false;

        checkBtn.disabled = false;
        nextBtn.disabled = true;
        renderCardPool();
        renderAnswerZone();
        statusBadge.textContent = '📖 复习旧句子（已练习过的句子不重复计分）';
        statusBadge.className = 'status-badge';
        progress.textContent = `📖 复习`;
        Sound.start();
    }

    function checkAnswer() {
        if (state.isAnswered) return;
        const user = state.answerItems.map(it => it.word);
        const correct = state.correctWords;
        if (user.length !== correct.length) {
            statusBadge.textContent = '❌ 单词数量不对，请检查是否漏选或有多余单词';
            statusBadge.className = 'status-badge wrong';
            Sound.wrong();
            return;
        }
        let allMatch = true;
        for (let i = 0; i < correct.length; i++) {
            if (user[i] !== correct[i]) { allMatch = false; break; }
        }
        if (allMatch) {
            state.isAnswered = true;
            const key = state.currentEn;
            const alreadyScored = state.scoredSentences.has(key);
            const previouslyFailed = state.failedSentences.has(key);

            if (alreadyScored || previouslyFailed || state.retryMode) {
                statusBadge.textContent = '✅ 完全正确！（此句已练习过，不重复计分）';
            } else {
                state.score += 2;
                state.scoredSentences.add(key);
                statusBadge.textContent = '✅ 完全正确！ +2分（即将进入下一题）';
            }
            statusBadge.className = 'status-badge correct';
            Sound.correct();
            state.history.push({ en: state.currentEn, zh: state.currentZh, correct: true });
            updateHistoryUI();
            checkBtn.disabled = true;
            nextBtn.disabled = false;
            if (autoNextTimer) clearTimeout(autoNextTimer);
            autoNextTimer = setTimeout(() => {
                autoNextTimer = null;
                if (state.isAnswered) nextQuestion();
            }, state.highEnd ? 1200 : 900);
        } else {
            state.failedSentences.add(state.currentEn);
            let wrongIdx = -1;
            for (let i = 0; i < Math.min(user.length, correct.length); i++) {
                if (user[i] !== correct[i]) { wrongIdx = i; break; }
            }
            statusBadge.textContent = `❌ 第 ${wrongIdx+1} 个单词位置错误，再试试！（此句之后不计分）`;
            statusBadge.className = 'status-badge wrong';
            Sound.wrong();
            state.history.push({ en: state.currentEn, zh: state.currentZh, correct: false });
            updateHistoryUI();
        }
    }

    function nextQuestion() {
        if (autoNextTimer) { clearTimeout(autoNextTimer); autoNextTimer = null; }
        if (state.retryMode) {
            state.retryMode = false;
            state.currentIndex++;
            if (state.currentIndex < state.totalQuestions) loadQuestion();
            else finishRound();
            return;
        }
        if (!state.isAnswered) {
            if (state.answerItems.length === 0) {
                statusBadge.textContent = '⏳ 请先排列句子再继续';
                statusBadge.className = 'status-badge';
                return;
            }
            if (confirm('当前答案未检查，确定跳过吗？')) {
                state.failedSentences.add(state.currentEn);
                state.history.push({ en: state.currentEn, zh: state.currentZh, correct: false });
                updateHistoryUI();
                state.currentIndex++;
                if (state.currentIndex < state.totalQuestions) loadQuestion();
                else finishRound();
                return;
            } else return;
        }
        state.currentIndex++;
        if (state.currentIndex < state.totalQuestions) loadQuestion();
        else finishRound();
    }

    function finishRound() {
        statusBadge.textContent = '🎉 全部完成！点击「重排」再来一轮';
        statusBadge.className = 'status-badge done';
        Sound.done();
        cardPool.innerHTML = '';
        answerZone.innerHTML = `<span class="placeholder">🎉 完成！</span>`;
        checkBtn.disabled = true;
        nextBtn.disabled = true;
        progress.textContent = `${state.totalQuestions}/${state.totalQuestions}`;
    }

    function resetGame() {
        state.currentIndex = 0;
        state.score = 0;
        state.history = [];
        state.scoredSentences = new Set();
        state.failedSentences = new Set();
        state.retryMode = false;
        updateHistoryUI();
        if (state.selectedUnits.size === 0) {
            document.querySelectorAll('#unitCheckGroup input[type="checkbox"]:not(#unit-all)').forEach(cb => cb.checked = true);
            document.getElementById('unit-all').checked = true;
            state.selectedUnits.clear();
            document.querySelectorAll('#unitCheckGroup input[type="checkbox"]:not(#unit-all)').forEach(cb => {
                if (cb.checked) state.selectedUnits.add(cb.value);
            });
        }
        loadQuestion();
        statusBadge.textContent = '🎯 点击下方单词开始';
        statusBadge.className = 'status-badge';
        Sound.start();
    }

    function updateScore() {
        scoreEl.textContent = state.score;
        if (state.highEnd) {
            scoreEl.animate([
                { transform: 'scale(1)' },
                { transform: 'scale(1.20)' },
                { transform: 'scale(1)' }
            ], { duration: 400, easing: ease() });
        }
    }

    function updateHistoryUI() {
        historyList.innerHTML = '';
        const items = state.history.slice(-12).reverse();
        items.forEach(item => {
            const div = document.createElement('div');
            div.className = 'h-item';
            div.innerHTML = `${item.correct ? '✅' : '❌'} ${item.zh}`;
            div.title = `${item.en}（点击重新练习）`;
            div.addEventListener('click', () => { loadHistoricalQuestion(item); });
            historyList.appendChild(div);
        });
    }

    // ================================================================
    //  13. 单元选择
    // ================================================================
    function renderUnitChecks() {
        const units = Object.keys(TEMPLATES_DATA);
        unitCheckGroup.innerHTML = '';
        const allDiv = document.createElement('span');
        allDiv.className = 'unit-check';
        allDiv.innerHTML = `<input type="checkbox" id="unit-all" checked /> <label for="unit-all" class="unit-label">全部</label>`;
        unitCheckGroup.appendChild(allDiv);
        units.forEach(u => {
            const div = document.createElement('span');
            div.className = 'unit-check';
            div.innerHTML = `<input type="checkbox" id="unit-${u}" value="${u}" checked /> <label for="unit-${u}" class="unit-label">${u}</label>`;
            unitCheckGroup.appendChild(div);
        });
        const allCheck = document.getElementById('unit-all');
        const unitChecks = unitCheckGroup.querySelectorAll('input[type="checkbox"]:not(#unit-all)');
        allCheck.addEventListener('change', function() {
            const checked = this.checked;
            unitChecks.forEach(cb => cb.checked = checked);
            updateSelectedUnits();
        });
        unitChecks.forEach(cb => {
            cb.addEventListener('change', function() {
                const allChecked = Array.from(unitChecks).every(c => c.checked);
                allCheck.checked = allChecked;
                updateSelectedUnits();
            });
        });
        function updateSelectedUnits() {
            state.selectedUnits.clear();
            unitChecks.forEach(cb => { if (cb.checked) state.selectedUnits.add(cb.value); });
            if (state.selectedUnits.size > 0) {
                resetGame();
            } else {
                statusBadge.textContent = '⚠️ 请至少选择一个单元';
                statusBadge.className = 'status-badge';
                cardPool.innerHTML = '';
                answerZone.innerHTML = `<span class="placeholder">👆 请选择单元</span>`;
            }
        }
        updateSelectedUnits();
    }

    // ================================================================
    //  14. 事件绑定
    // ================================================================
    moreOldWordsCheck.addEventListener('change', function() {
        state.moreOldWords = this.checked;
        if (state.selectedUnits.size > 0) loadQuestion();
    });
    shuffleBtn.addEventListener('click', function() {
        if (state.isAnswered) {
            statusBadge.textContent = '⏳ 本题已答，请点击下一题';
            statusBadge.className = 'status-badge';
            return;
        }
        state.answerItems = [];
        state.usedIndices = [];
        const correct = state.correctWords;
        const distractors = state.shuffledWords.filter(w => !correct.includes(w));
        let all = correct.slice();
        distractors.forEach(d => all.push(d));
        state.shuffledWords = shuffleArray(all);
        Sound.shuffle();
        renderCardPool();
        renderAnswerZone();
        statusBadge.textContent = '🔀 已重排，请重新排列';
        statusBadge.className = 'status-badge';
    });
    checkBtn.addEventListener('click', checkAnswer);
    nextBtn.addEventListener('click', nextQuestion);
    clearHistoryBtn.addEventListener('click', function() {
        state.history = [];
        updateHistoryUI();
    });
    historyBtn.addEventListener('click', function() {
        if (state.history.length === 0) { alert('暂无练习记录'); return; }
        let msg = '📜 练习历史 (最近12条)\n\n';
        state.history.slice(-12).reverse().forEach((item, i) => {
            const icon = item.correct ? '✅' : '❌';
            msg += `${i+1}. ${icon} ${item.zh}\n   (${item.en})\n`;
        });
        alert(msg);
    });
    resetProgressBtn.addEventListener('click', function() {
        if (confirm('重置所有进度和分数？')) {
            state.totalQuestions = 20;
            resetGame();
        }
    });
    glassToggle.addEventListener('click', function() {
        state.highEnd = !state.highEnd;
        appEl.classList.toggle('high-end', state.highEnd);
        glassToggle.classList.toggle('on', state.highEnd);
        modeTag.textContent = state.highEnd ? '液态玻璃' : '流畅版';
        localStorage.setItem('highEnd', state.highEnd ? '1' : '0');
        if (!state.highEnd) resetPanelTilt();
        if (state.shuffledWords.length > 0) {
            renderCardPool();
            renderAnswerZone();
        }
        Sound.shuffle();
    });
    if (localStorage.getItem('highEnd') === '1') {
        state.highEnd = true;
        appEl.classList.add('high-end');
        glassToggle.classList.add('on');
        modeTag.textContent = '液态玻璃';
    }

    // ================================================================
    //  15. 教学弹窗
    // ================================================================
    const tutorialSteps = [
        { title: '第一步：点击单词', desc: '点击下方卡片池中的单词，它会飞入上方答题区，按顺序排列成句子。' },
        { title: '第二步：拖动换位', desc: '在答题区内按住任意单词左右拖动，其余单词会被弹性「挤」到旁边。' },
        { title: '第三步：检查答案', desc: '排列完成后点击「检查答案」，系统会判断正误。答对会自动进入下一题。' },
        { title: '第四步：句型提醒', desc: '不确定句子结构？看看中文上方的「📐 句型」小标签，它会提示这个句子的模板结构。' },
        { title: '第五步：重新练习', desc: '想练习之前见过的句子？点击底部「最近练习」中任意一条中文，就能重新排列那句话。' }
    ];
    let tutorialIndex = 0;

    function updateTutorialStep(idx) {
        tutorialIndex = idx;
        tutorialTitle.textContent = tutorialSteps[idx].title;
        tutorialDesc.textContent = tutorialSteps[idx].desc;
        stageContents.forEach((el, i) => el.classList.toggle('active', i === idx));
        tutorialDots.forEach((d, i) => d.classList.toggle('active', i === idx));
        tutorialNext.textContent = idx === tutorialSteps.length - 1 ? '开始游戏 🚀' : '下一步 →';
    }
    function openTutorial() { tutorialOverlay.classList.add('show'); updateTutorialStep(0); }
    function closeTutorial() { tutorialOverlay.classList.remove('show'); }

    tutorialBtn.addEventListener('click', openTutorial);
    tutorialClose.addEventListener('click', closeTutorial);
    tutorialSkip.addEventListener('click', closeTutorial);
    tutorialNext.addEventListener('click', () => {
        if (tutorialIndex >= tutorialSteps.length - 1) closeTutorial();
        else updateTutorialStep(tutorialIndex + 1);
    });
    tutorialOverlay.addEventListener('click', (e) => {
        if (e.target === tutorialOverlay) closeTutorial();
    });
    if (!localStorage.getItem('tutorialShown')) {
        setTimeout(() => {
            openTutorial();
            localStorage.setItem('tutorialShown', '1');
        }, 600);
    }

    // ================================================================
    //  16. 清理 & 启动
    // ================================================================
    document.addEventListener('visibilitychange', () => {
        if (document.hidden && dragState) {
            dragState.ghost.remove();
            dragState = null;
            isDragging = false;
            renderAnswerZone();
        }
    });

    setupBigCardGlow();
    setupPanelTilt();
    renderUnitChecks();
    console.log('🧩 句型建筑师 · 液态玻璃版已启动');
});
</script>
</body>
</html>
